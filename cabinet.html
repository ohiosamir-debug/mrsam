:root{color-scheme:light;--bg:#F5F3EF;--surface:#fff;--ink:#153E2D;--muted:#5B6B62;--forest:#153E2D;--night:#0F2A1F;--lime:#D5F36A;--violet:#8C7BFF;--pink:#FF6FB5;--sand:#E9E3D7;

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.55 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding-inline:clamp(16px,3.5vw,32px)}
:focus-visible{outline:3px solid #E88135;outline-offset:3px;border-radius:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;min-height:44px}
.logo svg{width:54px;height:45px}
.logo b{font:900 18px/1 var(--display);text-transform:uppercase}
.back{font-weight:900;text-decoration:none;min-height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--sand)}
.hero{background:var(--forest);color:#F2F7EF;border-radius:34px;padding:clamp(24px,4vw,48px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;position:relative;overflow:hidden}

.hero h1{margin:0;font:900 clamp(30px,5vw,60px)/1 var(--display);text-transform:uppercase;letter-spacing:-.01em}
.hero h1 .hl{color:var(--lime)}
.hero p{margin:14px 0 0;color:#BCD0C2;font-size:clamp(16px,1.6vw,19px);max-width:46ch}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:18px}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
.cab{border-radius:30px;padding:clamp(22px,2.6vw,30px);display:flex;flex-direction:column;gap:14px;text-decoration:none;position:relative;overflow:hidden;transition:transform .2s var(--ease);box-shadow:0 10px 0 rgba(15,42,31,.18)}
.cab:hover{transform:translateY(-4px)}
.cab.ielts{background:var(--violet);color:#fff}
.cab.toefl{background:var(--pink);color:#fff}
.cab.math{background:var(--lime);color:var(--ink)}
.cab .emo{font-size:44px;line-height:1}
.cab .tag{align-self:flex-start;background:rgba(255,255,255,.9);color:var(--ink);border-radius:999px;padding:6px 12px;font:800 11px/1 var(--display);text-transform:uppercase;letter-spacing:.06em}
.cab h2{margin:0;font:900 clamp(24px,2.6vw,32px)/1 var(--display);text-transform:uppercase}
.cab ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-weight:800}
.cab li::before{content:"✓ ";font-weight:900}
.cab .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;font:900 15px/1 var(--font);text-decoration:none;transition:transform .14s var(--ease),box-shadow .14s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px)}
.btn-dark{background:var(--night);color:#fff;box-shadow:0 4px 0 #000}
.btn-ghost{background:rgba(255,255,255,.22);color:inherit;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.cab.math .btn-ghost{background:rgba(255,255,255,.5);box-shadow:inset 0 0 0 2px rgba(21,62,45,.35)}
.help{margin:22px 0 48px;background:var(--surface);border-radius:26px;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;font-weight:800}
.help .btn{background:var(--lime);color:var(--ink);box-shadow:0 4px 0 #A9C93F}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.teacher-link{margin:22px 0 0;text-align:center;font-weight:800;font-size:14px}.teacher-link a{color:var(--muted);text-underline-offset:3px}

.top-r{display:flex;align-items:center;gap:8px}
.top-r .back{border:0;cursor:pointer;font-family:inherit;font-size:15px}
.card{background:var(--surface);border-radius:28px;padding:clamp(20px,3vw,32px);box-shadow:0 10px 0 rgba(15,42,31,.08)}
.muted{color:var(--muted)}.small{font-size:14px}
.loading{margin:40px 0;text-align:center;font-weight:800;color:var(--muted)}
.lg-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:18px;margin-top:18px;align-items:start}
@media (max-width:860px){.lg-grid{grid-template-columns:minmax(0,1fr)}}
.lg-form{display:flex;flex-direction:column;gap:14px}
.lg-form h2,.demos h2,.empty h2{margin:0;font:900 clamp(22px,2.4vw,28px)/1.1 var(--display);text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:900;font-size:14px}
.input,.pw-wrap input{width:100%;min-height:52px;border:0;border-radius:16px;background:#F3F1EA;box-shadow:inset 0 0 0 2px var(--sand);padding:0 16px;font:800 17px/1 var(--font);color:var(--ink)}
.input:focus,.pw-wrap input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--forest)}
.input[aria-invalid="true"],.pw-wrap input[aria-invalid="true"]{box-shadow:inset 0 0 0 2px #C2410C}
.pw-wrap{position:relative;display:flex}
.pw-wrap input{padding-right:110px}
.pw-eye{position:absolute;right:6px;top:6px;bottom:6px;border:0;border-radius:12px;background:var(--surface);font:900 13px/1 var(--font);padding:0 12px;cursor:pointer;color:var(--ink)}
.pw-hint{color:var(--muted);font-weight:700;font-size:13px}
.err{margin:0;color:#B3261E;font-weight:800}
.note{margin:0 0 14px;background:#FFF3B8;border-radius:14px;padding:10px 14px;font-weight:800}
.link{border:0;background:none;padding:0;min-height:44px;font:900 15px/1 var(--font);color:var(--ink);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lg-links{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.lg-form .btn{align-self:flex-start;border:0;cursor:pointer}
.arr{display:inline-flex;width:18px;height:18px}.arr svg{width:100%;height:100%}
.demos{display:flex;flex-direction:column;gap:10px}
.demos p{margin:0}
.demo-list{display:flex;flex-direction:column;gap:6px}
.demo-chip{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 14px 6px 6px;border-radius:18px;text-decoration:none;font-weight:900;box-shadow:inset 0 0 0 2px var(--sand)}
.demo-chip:hover{box-shadow:inset 0 0 0 2px var(--forest)}
.courses{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin:18px 0 0}
.courses.n1{grid-template-columns:minmax(0,520px)}
.courses.n2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));max-width:900px}
.pgrid > .pblock:last-child:nth-child(odd){grid-column:1/-1}
.course{border-radius:30px;padding:clamp(20px,2.6vw,28px);display:flex;flex-direction:column;gap:10px;text-decoration:none;box-shadow:0 10px 0 rgba(15,42,31,.18);transition:transform .2s var(--ease);min-height:240px;color:var(--ink)}
a.course:hover{transform:translateY(-4px)}
.course.t-lime{background:var(--lime)}.course.t-mint{background:#7FD8B6}.course.t-yellow{background:#FFD84D}
.course.t-violet{background:var(--violet);color:#fff}.course.t-pink{background:var(--pink);color:#fff}
.course-ic{width:64px;height:64px;display:block}.course-ic .cicon,.course-ic svg{width:100%;height:100%;display:block;overflow:visible}
.course h2{margin:0;font:900 clamp(21px,2.2vw,26px)/1.05 var(--display);text-transform:uppercase}
.course p{margin:0;font-weight:800;opacity:.9}
.course-go{margin-top:auto;display:inline-flex;align-items:center;gap:8px;align-self:flex-start;min-height:46px;padding:0 18px;border-radius:999px;background:var(--night);color:#fff;font-weight:900}
.course .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
.empty{margin-top:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty p{margin:0}
.empty .btn{border:0;cursor:pointer}
.kids{display:flex;flex-direction:column;gap:18px;margin-top:18px}
.kid{display:flex;flex-direction:column;gap:16px}
.kid-head{display:flex;align-items:center;gap:12px}
.kid-head h2{margin:0;font:900 clamp(22px,2.4vw,28px)/1.05 var(--display);text-transform:uppercase}
.ava{width:52px;height:52px;border-radius:50%;background:var(--lime);display:grid;place-items:center;font:900 22px/1 var(--display);flex:none}
.ptabs{display:flex;gap:8px;flex-wrap:wrap}
.ptabs button{display:inline-flex;align-items:center;gap:8px;min-height:50px;padding:4px 16px 4px 4px;border:0;border-radius:999px;background:#F3F1EA;font:900 15px/1 var(--font);color:var(--ink);cursor:pointer;box-shadow:inset 0 0 0 2px var(--sand)}
.ptabs button[aria-selected="true"]{background:var(--forest);color:#F2F7EF;box-shadow:none}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:860px){.pgrid{grid-template-columns:minmax(0,1fr)}}
.pblock{background:#F7F5F0;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pblock.wide{grid-column:1/-1}
.pblock h3{margin:0;font:900 15px/1.2 var(--display);text-transform:uppercase;letter-spacing:.02em}
.pblock p{margin:0}
.plan p{margin:0 0 4px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plist li{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:10px 12px;min-width:0}
.pl-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.pl-main b{font-weight:900;overflow-wrap:anywhere}
.pl-main small{color:var(--muted);font-weight:700;font-size:13px}
.pl-main .cm{color:var(--ink)}
.pl-side{display:flex;align-items:center;gap:8px;flex:none}
.pl-side .big{font:900 20px/1 var(--display)}
.st{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:999px;font-weight:900;font-size:12.5px;white-space:nowrap}
.st.todo{background:#FFE4CC}.st.wait{background:#E8E1F4}.st.done{background:#DCEEDC}
.kpi-line{font-weight:800}.kpi-line b{font:900 22px/1 var(--display)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(0,2fr) 48px minmax(60px,auto);gap:10px;align-items:center}
.bar-row .bl{font-weight:800;font-size:14.5px}
.bar-row small{color:var(--muted);font-weight:700;font-size:12.5px}
.bt{height:12px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--sand);overflow:hidden}
.bt i{display:block;height:100%;border-radius:999px;background:#9BB3A6}
.bt i.good{background:#3FA36B}.bt i.mid{background:#E5B12E}.bt i.low{background:#E07A4F}
@media (max-width:560px){.bar-row{grid-template-columns:minmax(0,1fr) 48px;row-gap:4px}.bar-row .bt{grid-column:1/-1;grid-row:2}.bar-row small{display:none}}
.pays .plist li{background:#fff}
/* Mr.Sam: переключатель курсов в шапке кабинета */
.dsw{position:relative;display:inline-flex;flex:0 1 auto;min-width:0}
.dsw-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;max-width:100%;padding:3px 12px 3px 3px;border:0;border-radius:999px;background:#FFFFFF;color:#153E2D;box-shadow:inset 0 0 0 2px #E1DCD1;font-family:inherit;font-weight:900;font-size:14px;line-height:1.1;cursor:pointer;white-space:nowrap}
.dsw-btn:hover{box-shadow:inset 0 0 0 2px #153E2D}
.dsw-btn:focus-visible{outline:3px solid #8C7BFF;outline-offset:2px}
.dsw-static{cursor:default}.dsw-static:hover{box-shadow:inset 0 0 0 2px #E1DCD1}
.dsw-name{overflow:hidden;text-overflow:ellipsis;min-width:0}
.dsw-chev{width:16px;height:16px;flex:none;transition:transform .15s}
.dsw-btn[aria-expanded="true"] .dsw-chev{transform:rotate(180deg)}
.dsw.on-dark .dsw-btn{background:rgba(255,255,255,.1);color:inherit;box-shadow:none}
.dsw.on-dark .dsw-btn:hover,.dsw.on-dark .dsw-btn[aria-expanded="true"]{background:rgba(255,255,255,.2)}
.dsw.on-dark .dsw-static:hover{background:rgba(255,255,255,.1)}
.dsw-tile{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.dsw-tile .cicon,.dsw-tile svg{width:28px;height:28px;display:block}
.dsw-tile.t-lime{background:#E9F8B4}.dsw-tile.t-mint{background:#CFF0E2}.dsw-tile.t-yellow{background:#FFEFAE}.dsw-tile.t-violet{background:#E2DDFF}.dsw-tile.t-pink{background:#FFD9EB}
.dsw-menu{position:absolute;z-index:60;top:calc(100% + 8px);left:0;width:300px;max-width:calc(100vw - 24px);background:#FFFFFF;color:#153E2D;border-radius:22px;padding:10px;box-shadow:0 18px 40px -12px rgba(15,42,31,.45),0 0 0 1px rgba(21,62,45,.08);display:flex;flex-direction:column;gap:4px}
.dsw-menu[hidden]{display:none}
.dsw-cap{font-family:inherit;font-weight:900;font-size:11px;line-height:1;text-transform:uppercase;letter-spacing:.08em;color:#5B6B62;padding:6px 10px 4px}
.dsw-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:16px;text-decoration:none;color:inherit;min-height:52px}
.dsw-item:hover,.dsw-item:focus-visible{background:#F3F1EA;outline:none}
.dsw-item:focus-visible{box-shadow:inset 0 0 0 2px #8C7BFF}
.dsw-item.on{background:#153E2D;color:#F2F7EF}
.dsw-item.on small{color:#D5F36A}
.dsw-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.dsw-txt b{font-weight:900;font-size:15px;line-height:1.15}
.dsw-txt small{font-weight:700;font-size:12.5px;line-height:1.25;color:#5B6B62}
.dsw-all{display:flex;align-items:center;justify-content:center;min-height:44px;margin-top:4px;border-radius:14px;font-weight:900;font-size:13.5px;color:#153E2D;text-decoration:none;box-shadow:inset 0 0 0 2px #E6E1D8}
.dsw-all:hover{box-shadow:inset 0 0 0 2px #153E2D}
@media (max-width:560px){.dsw-btn{padding-right:8px;gap:6px}.dsw-tile{width:34px;height:34px}.dsw-tile .cicon,.dsw-tile svg{width:24px;height:24px}.dsw-name{max-width:96px}}
@media (max-width:380px){.dsw-name{display:none}.dsw-btn{padding-right:6px}}
@media (prefers-reduced-motion:reduce){.dsw-chev{transition:none}}
/* экран «курс не открыт» */
.noacc{max-width:620px;margin:32px auto;display:flex;flex-direction:column;gap:14px}
.noacc-list{display:grid;gap:8px}
.noacc-list a{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:18px;text-decoration:none;color:#153E2D;background:#FFFFFF;box-shadow:inset 0 0 0 2px #E6E1D8;min-height:60px}
.noacc-list a:hover{box-shadow:inset 0 0 0 2px #153E2D}
.noacc-list b{font-weight:900}
.noacc-list small{display:block;font-weight:700;font-size:13px;color:#5B6B62}

</style>

r=\"middle\" font-family=\"Unbounded,Arial Black,sans-serif\" font-weight=\"900\" font-size=\"24\" fill=\"#fff\">x</text><text x=\"44\" y=\"30\" text-anchor=\"middle\" font-family=\"Unbounded,Arial Black,sans-serif\" font-weight=\"900\" font-size=\"14\" fill=\"#fff\">2</text></g></g></svg>", "dice": "<svg viewBox=\"0 0 64 64\" aria-hidden=\"true\" class=\"ci\"><g filter=\"url(#claySh)\"><g filter=\"url(#clay)\"><rect x=\"8\" y=\"8\" width=\"48\" height=\"48\" rx=\"13\" fill=\"#FFFFFF\" transform=\"rotate(-8 32 32)\"/><circle cx=\"21\" cy=\"21\" r=\"4.5\" fill=\"#8C7BFF\" transform=\"rotate(-8 32 32)\"/><circle cx=\"43\" cy=\"21\" r=\"4.5\" fill=\"#8C7BFF\" transform=\"rotate(-8 32 32)\"/><circle cx=\"32\" cy=\"32\" r=\"4.5\" fill=\"#8C7BFF\" transform=\"rotate(-8 32 32)\"/><circle cx=\"21\" cy=\"43\" r=\"4.5\" fill=\"#8C7BFF\" transform=\"rotate(-8 32 32)\"/><circle cx=\"43\" cy=\"43\" r=\"4.5\" fill=\"#8C7BFF\" transform=\"rotate(-8 32 32)\"/></g></g></svg>", "graph": "<svg viewBox=\"0 0 64 64\" aria-hidden=\"true\" class=\"ci\"><g filter=\"url(#claySh)\"><g filter=\"url(#clay)\"><rect x=\"6\" y=\"8\" width=\"52\" height=\"48\" rx=\"12\" fill=\"#FFFFFF\"/><path d=\"M14 46c8-2 10-16 18-18s10 6 18-14\" fill=\"none\" stroke=\"#8C7BFF\" stroke-width=\"5\" stroke-linecap=\"round\"/><circle cx=\"50\" cy=\"14\" r=\"4.5\" fill=\"#FF6FB5\"/></g></g></svg>"};

<script>/* ===== Mr.Sam: пароли. Локально: PBKDF2-SHA256 в браузере. С сервером: пароль проверяет Google Таблица, кабинет хранит только токен. ===== */
window.MrSamAuth = (function () {
  "use strict";
  const MIN = 6;
  const enc = s => new TextEncoder().encode(s);
  const hex = buf => [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, "0")).join("");
  const rnd = n => { const a = new Uint8Array(n); (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach((_, i) => { a[i] = Math.random() * 256 | 0; }); return hex(a); };
  async function derive(pass, salt) {
    if (window.crypto && crypto.subtle) {
      const key = await crypto.subtle.importKey("raw", enc(pass), "PBKDF2", false, ["deriveBits"]);
      return "p1:" + hex(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: enc(salt), iterations: 150000, hash: "SHA-256" }, key, 256));
    }
    // запасной вариант для старых браузеров без WebCrypto
    let h1 = 0x811c9dc5, h2 = 0x01000193, s = salt + ":" + pass;
    for (let r = 0; r < 20000; r++) for (let i = 0; i < s.length; i++) { h1 = Math.imul(h1 ^ s.charCodeAt(i), 16777619) >>> 0; h2 = Math.imul(h2 ^ h1, 2246822519) >>> 0; }
    return "f1:" + h1.toString(16) + h2.toString(16);
  }
  async function make(pass) { const salt = rnd(16); return { salt, hash: await derive(pass, salt) }; }
  async function verify(pass, rec) { return !!(rec && rec.salt && rec.hash) && (await derive(pass, rec.salt)) === rec.hash; }
  async function post(api, params) { const r = await fetch(api, { method: "POST", body: new URLSearchParams(params) }); return r.json(); }
  const ERR = {
    no_code: "Код не найден. Проверь его или напиши Самиру.",
    no_access: "Этот курс тебе не открыт. Твои курсы на странице «Мои курсы», вход там тот же.",
    parent: "Это код родителя. Родители входят на странице «Мои курсы».",
    wrong_password: "Неверный пароль.",
    locked: "Слишком много неверных попыток. Подожди 15 минут или напиши Самиру, он сбросит пароль.",
    weak_password: "Пароль должен быть не короче " + MIN + " символов.",
    has_password: "Пароль уже задан. Введи его или попроси Самира сбросить.",
    no_password: "Для этого кода ещё нет пароля. Придумай его.",
    auth: "Сессия закончилась. Войди заново."
  };
  const msg = (j, fallback) => j && j.error ? (ERR[j.error] || fallback) + (j.error === "wrong_password" && j.left != null ? " Осталось попыток: " + j.left + "." : "") : fallback;
  /* поле пароля с кнопкой «показать» */
  function field(h, id, label, opts) {
    opts = opts || {};
    const input = h("input", { id, type: "password", autocomplete: opts.autocomplete || "current-password", required: true, minlength: opts.min || null, spellcheck: "false", "aria-describedby": opts.describedby || null, placeholder: opts.placeholder || "" });
    const eye = h("button", { type: "button", class: "pw-eye", "aria-label": "Показать пароль", "aria-pressed": "false", onclick: () => { const show = input.type === "password"; input.type = show ? "text" : "password"; eye.setAttribute("aria-pressed", show ? "true" : "false"); eye.setAttribute("aria-label", show ? "Скрыть пароль" : "Показать пароль"); eye.textContent = show ? "Скрыть" : "Показать"; input.focus(); } }, "Показать");
    const wrap = h("div", { class: "field pw-field" }, h("label", { for: id }, label), h("div", { class: "pw-wrap" }, input, eye), opts.hint ? h("small", { class: "pw-hint" }, opts.hint) : null);
    return { wrap, input };
  }
  return { MIN, make, verify, post, msg, field };
})();

<script>/* ===== Mr.Sam: направления ученика. Один вход на все кабинеты и переключатель курсов.
   Кабинеты курсов лежат на отдельных страницах, но у ученика одна сессия: вошёл один раз и переходит между своими курсами без пароля.
   Сессия хранит только токен входа и список выданных курсов, пароль здесь не хранится. Список курсов присылает сервер. ===== */
window.MrSamDirs = (function () {
  "use strict";
  const LIST = [
    { id: "math", name: "Математика", short: "Математика", href: "math.html", icon: "ruler", tone: "lime", about: "План по темам, задания с подсказками, игры" },
    { id: "english", name: "Английский язык", short: "Английский", href: "english.html", icon: "chat", tone: "mint", about: "Грамматика, слова, чтение и домашка" },
    { id: "mathen", name: "Математика на английском", short: "Math in English", href: "mathen.html", icon: "calc", tone: "yellow", about: "Задачи на английском, словарик терминов, свой план" },
    { id: "ielts", name: "IELTS", short: "IELTS", href: "ielts.html", icon: "cap", tone: "violet", about: "Reading, Listening, Writing в формате IELTS" },
    { id: "toefl", name: "TOEFL", short: "TOEFL", href: "toefl.html", icon: "globe", tone: "pink", about: "Задания нового формата TOEFL и шкала 1–6" }
  ];
  const BY = {}; LIST.forEach(d => { BY[d.id] = d; });
  const HUB = "cabinet.html", KEY = "mrsam.session.v1";
  /** хранилища кабинетов: при выходе убираем токен этого ученика везде */
  const STORES = ["mrsam.math.v1", "mrsam.mathen.v1", "mrsam.english.v1", "mrsam.ielts.v1", "mrsam.toefl.v1"];
  const clean = arr => LIST.map(d => d.id).filter(id => (arr || []).indexOf(id) >= 0);
  const name = id => BY[id] ? BY[id].name : String(id || "");

  function get() {
    try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.code && s.token && (s.role === "student" || s.role === "parent")) return s; } catch (e) {}
    return null;
  }
  function set(s) {
    if (!s || !s.code || !s.token) return;
    try { localStorage.setItem(KEY, JSON.stringify({ role: s.role || "student", code: String(s.code).toUpperCase(), name: s.name || "", token: s.token, tracks: clean(s.tracks), at: Date.now() })); } catch (e) {}
  }
  /** обновить список курсов (сервер прислал свежий) */
  function update(code, patch) { const s = get(); if (s && s.code === String(code || "").toUpperCase()) set(Object.assign(s, patch)); }
  function clear(token) { const s = get(); if (s && token && s.token !== token) return; try { localStorage.removeItem(KEY); } catch (e) {} }
  /** выход: сессия и токены этого кода во всех кабинетах на устройстве */
  function logoutAll(code) {
    code = String(code || "").toUpperCase();
    clear();
    STORES.forEach(k => {
      try {
        const a = JSON.parse(localStorage.getItem(k) || "null");
        if (!a || a.v !== 2 || !a.accounts) return;
        const id = "code:" + code, acc = a.accounts[id];
        if (!acc) return;
        delete acc.token; if (a.current === id) a.current = null;
        localStorage.setItem(k, JSON.stringify(a));
      } catch (e) {}
    });
  }

  /* ---------- переключатель: только выданные курсы ---------- */
  const el = (tag, attrs, kids) => {
    const n = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => { if (v == null || v === false) return; if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? "" : v); });
    (kids || []).forEach(c => { if (c != null) n.append(c); });
    return n;
  };
  const chev = () => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true"); s.setAttribute("class", "dsw-chev"); s.innerHTML = '<path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>'; return s; };
  function tile(d, icon) { return el("span", { class: "dsw-tile t-" + d.tone, "aria-hidden": "true" }, [icon ? icon(d.icon) : null]); }
  /**
   * cur: курс этой страницы; tracks: выданные ученику; opts: { icon(name) → узел, dark: тёмная шапка, hub: ссылка «Все мои курсы» }
   * Один курс: просто подпись. Несколько: кнопка со списком.
   */
  function switcher(cur, tracks, opts) {
    opts = opts || {};
    const list = clean(tracks), d0 = BY[cur];
    const root = el("div", { class: "dsw" + (opts.dark ? " on-dark" : "") });
    if (!d0) return root;
    if (list.length < 2) { root.append(el("span", { class: "dsw-btn dsw-static" }, [tile(d0, opts.icon), el("span", { class: "dsw-name", text: d0.short })])); return root; }
    const id = "dsw-" + Math.random().toString(36).slice(2, 7);
    const menu = el("div", { class: "dsw-menu", id, hidden: true });
    const btn = el("button", { type: "button", class: "dsw-btn", "aria-expanded": "false", "aria-controls": id, "aria-label": "Курс: " + d0.name + ". Переключить курс" },

      const j = await post(ss.role === "parent" ? { action: "parent_me", token: ss.token } : { action: "login", token: ss.token });
      if (j && j.ok && j.role === "parent") { DIRS.set(Object.assign(ss, { name: j.name })); return renderParent(j); }
      if (j && j.ok) { DIRS.set({ role: "student", code: j.code || ss.code, name: j.name, token: ss.token, tracks: j.tracks }); return renderStudent(j); }
      if (j && (j.error === "auth" || j.error === "parent")) { DIRS.logoutAll(ss.code); setWho(null); note = "Сессия закончилась, войди ещё раз."; return renderLogin(); }
      renderMsg("Не получилось загрузить", "Сервер ответил с ошибкой. Попробуй ещё раз через минуту.", true);
    } catch (e) { renderMsg("Нет связи", "Проверь интернет и попробуй ещё раз.", true); }
  }
  addEventListener("pageshow", e => { if (e.persisted) boot(); });
  boot();
})();
</script>
</body>
</html>
