<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Кубоград: математика на кубиках</title>
<meta name="mrsam:topic" content="addsub">
<meta name="mrsam:skill" content="Сложение, вычитание и умножение на кубиках">
<meta name="mrsam:levels" content="1:Лёгкий|2:Средний|3:Сложный">
<style>
:root{--forest:#153E2D;--lime:#D5F36A;--pink:#FF6FB5;--ink:#10261B;--u:clamp(13px,1.2vw + 6px,22px);
  --grass:#7BC74D;--grass2:#5FA83A;--dirt:#9A6436;--stone:#9AA4AA;--plank:#C99A5B;--sand:#F3D27A;--gold:#F5C542;--gem:#46D3E6;--wheat:#E9C84B;--leaf:#4CAF50;--water:#5FB8F2}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font:800 16px/1.4 "Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(180deg,#8FD6FF 0%,#CFEFFF 46%,#E9F7D9 100%);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #FF8A3D;outline-offset:2px}
.app{position:fixed;inset:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
/* верхняя панель */
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hud .chip{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:12px;background:rgba(255,255,255,.75);box-shadow:0 3px 0 rgba(16,38,27,.18);font-size:14px}
.hud .chip b{font-size:16px}
.hud .title{background:var(--forest);color:#fff}
.hud .title b{color:var(--lime)}
.hud .sp{flex:1}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.75);box-shadow:0 3px 0 rgba(16,38,27,.18);display:grid;place-items:center}
.ib svg{width:20px;height:20px}
.dots{display:flex;gap:4px}
.dots i{width:12px;height:12px;border-radius:3px;background:rgba(16,38,27,.15)}
.dots i.ok{background:var(--grass)}.dots i.no{background:var(--pink)}.dots i.help{background:#F2B33D}.dots i.now{background:#fff;box-shadow:0 0 0 2px var(--forest)}
/* мир: награда за верные ответы */
.world{position:relative;align-self:center;justify-self:center;display:grid;grid-template-columns:repeat(18,var(--w));grid-auto-rows:var(--w);--w:clamp(14px,3.6vw,26px);padding:6px;border-radius:14px;background:rgba(255,255,255,.35);box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.world i{display:block;border-radius:2px;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .3s}
.world i.hid{background:rgba(255,255,255,.28)!important;background-image:none!important;box-shadow:inset 0 0 0 1.5px rgba(16,38,27,.22)!important}
.b-grass{background:linear-gradient(var(--grass) 0 38%,var(--dirt) 38%);box-shadow:inset -2px -2px 0 rgba(0,0,0,.18)}
.b-dirt{background:var(--dirt);box-shadow:inset -2px -2px 0 rgba(0,0,0,.2),inset 2px 2px 0 rgba(255,255,255,.12)}
.b-stone{background:var(--stone);box-shadow:inset -2px -2px 0 rgba(0,0,0,.2),inset 2px 2px 0 rgba(255,255,255,.25)}
.b-dark{background:#3A3F44;box-shadow:inset 2px 2px 0 rgba(0,0,0,.35)}
.b-plank{background:repeating-linear-gradient(180deg,var(--plank) 0 30%,#A87A42 30% 34%);box-shadow:inset -2px -2px 0 rgba(0,0,0,.15)}
.b-roof{background:#D9483B;box-shadow:inset -2px -2px 0 rgba(0,0,0,.22),inset 2px 2px 0 rgba(255,255,255,.2)}
.b-glass{background:#BFEAFF;box-shadow:inset 0 0 0 2px #7FA9BF}
.b-door{background:#7A4A22;box-shadow:inset 0 0 0 2px #5A3416}
.b-leaf{background:var(--leaf);box-shadow:inset -2px -2px 0 rgba(0,0,0,.18),inset 2px 2px 0 rgba(255,255,255,.18)}
.b-wood{background:#8A5A2B;box-shadow:inset -2px 0 0 rgba(0,0,0,.2)}
.b-gem{background:var(--stone);background-image:radial-gradient(circle at 35% 40%,var(--gem) 0 18%,transparent 19%),radial-gradient(circle at 68% 66%,var(--gem) 0 16%,transparent 17%);box-shadow:inset -2px -2px 0 rgba(0,0,0,.2)}
.b-gold{background:var(--stone);background-image:radial-gradient(circle at 40% 35%,var(--gold) 0 18%,transparent 19%),radial-gradient(circle at 65% 70%,var(--gold) 0 15%,transparent 16%);box-shadow:inset -2px -2px 0 rgba(0,0,0,.2)}
.b-soil{background:repeating-linear-gradient(90deg,#6E4523 0 45%,#5A381B 45% 55%);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.b-wheat{background:#6E4523;background-image:radial-gradient(circle at 30% 30%,#F4D35E 0 22%,transparent 23%),radial-gradient(circle at 70% 65%,#F4D35E 0 22%,transparent 23%),radial-gradient(circle at 70% 25%,#9BD35A 0 14%,transparent 15%),radial-gradient(circle at 28% 72%,#9BD35A 0 14%,transparent 15%);box-shadow:inset -2px -2px 0 rgba(0,0,0,.2)}
.b-carrot{background:#6E4523;background-image:radial-gradient(circle at 50% 40%,#FF8A3D 0 26%,transparent 27%),radial-gradient(circle at 50% 16%,#58B947 0 16%,transparent 17%);box-shadow:inset -2px -2px 0 rgba(0,0,0,.2)}
.b-water{background:var(--water);box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
.b-sky{background:transparent}
/* задача */
.play{min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;justify-items:center}
.task{display:flex;align-items:center;gap:12px;padding:8px 18px;border-radius:18px;background:#fff;box-shadow:0 5px 0 rgba(16,38,27,.18);font:900 clamp(30px,7vw,48px)/1 system-ui,sans-serif;letter-spacing:-.01em}
.ansbox{min-width:2.4em;padding:4px 10px;border-radius:12px;background:#F1F5EA;color:var(--forest);text-align:center;box-shadow:inset 0 2px 0 rgba(0,0,0,.08)}
.ansbox.ok{background:var(--lime)}.ansbox.no{background:#FFD6E8;animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.stage{width:100%;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:4px}
.board{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,28px);flex-wrap:wrap;padding:12px 14px;border-radius:20px;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
.op{font:900 34px/1 system-ui,sans-serif;color:var(--forest);align-self:center}
.pile{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:60px}
.pile small{font:900 13px/1 system-ui,sans-serif;color:rgba(16,38,27,.7)}
.pile .n{font:900 22px/1 system-ui,sans-serif}
.stack{display:flex;flex-direction:column-reverse;gap:3px;align-items:center}
.ones{display:grid;grid-template-columns:repeat(5,var(--u));gap:2px;justify-content:center}
.huns{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:calc(var(--u) * 10)}
.cube{width:var(--u);height:var(--u);border-radius:3px;background:var(--c,var(--grass));box-shadow:inset calc(var(--u) * -.2) calc(var(--u) * -.2) 0 rgba(0,0,0,.22),inset calc(var(--u) * .14) calc(var(--u) * .14) 0 rgba(255,255,255,.38)}
.rod{display:flex;gap:0;border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.rod .cube{border-radius:0}
.rod .cube:first-child{border-radius:4px 0 0 4px}.rod .cube:last-child{border-radius:0 4px 4px 0}
.hun{width:calc(var(--u) * 3);height:calc(var(--u) * 3);border-radius:6px;display:grid;place-items:center;font:900 calc(var(--u) * .9)/1 system-ui,sans-serif;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);background:var(--c,var(--grass));box-shadow:inset -5px -5px 0 rgba(0,0,0,.22),inset 4px 4px 0 rgba(255,255,255,.3),0 3px 0 rgba(0,0,0,.2)}
.c1{--c:#6CC24A}.c2{--c:#F2B33D}.c3{--c:#46B8E6}.c4{--c:#B48CFF}
.glow{animation:gl 1s ease-in-out infinite alternate}
@keyframes gl{to{filter:brightness(1.25) drop-shadow(0 0 6px #fff)}}
.pop{animation:pp .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes pp{from{transform:scale(.2)}}
.gone{opacity:.18;filter:grayscale(1)}
.ghost .cube,.ghost .hun{background:transparent;box-shadow:inset 0 0 0 2px rgba(16,38,27,.35)}
.table{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border-radius:16px;background:repeating-linear-gradient(90deg,#C99A5B 0 18px,#B98848 18px 20px);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.table small{color:#3B2410}
.field{display:grid;gap:3px;padding:8px;border-radius:12px;background:#6E4523}
.field i{width:var(--u);height:var(--u);border-radius:3px;background:linear-gradient(180deg,#8EDB57 0 45%,#E9C84B 45%);box-shadow:inset -2px -2px 0 rgba(0,0,0,.2)}
.field i.on{background:linear-gradient(180deg,#B9F07C 0 45%,#FFE36B 45%);box-shadow:0 0 0 2px #fff}
.field .rowlab{width:auto;height:auto;background:none;box-shadow:none;color:#FFE9A8;font:900 12px/var(--u) system-ui,sans-serif;padding-left:6px;border-radius:0}
.say{min-height:2.6em;max-width:640px;text-align:center;font-size:clamp(15px,3.6vw,18px);padding:0 10px;color:var(--forest)}
.say b{color:#B2367A}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:0;background:#fff;box-shadow:0 4px 0 rgba(16,38,27,.25);font-weight:900}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(16,38,27,.25)}
.btn.lime{background:var(--lime);box-shadow:0 4px 0 #9CBF3A;color:var(--forest)}
.btn.dark{background:var(--forest);color:#fff;box-shadow:0 4px 0 #0A1F16}
/* цифры */
.pad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;width:min(560px,100%);justify-self:center}
.pad button{min-height:52px;border-radius:14px;border:0;background:#fff;box-shadow:0 4px 0 rgba(16,38,27,.22);font:900 22px/1 system-ui,sans-serif}
.pad button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(16,38,27,.22)}
.pad .go{background:var(--lime);color:var(--forest);box-shadow:0 4px 0 #9CBF3A}
.pad .del{background:#FFE6F1}
@media (min-width:900px){.app{grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto auto minmax(0,1fr)}.hud,.world{grid-column:1/-1}.play{grid-column:1}.pad{grid-column:2;grid-row:3;align-self:center;grid-template-columns:repeat(3,1fr);width:100%}.pad button{min-height:64px}}
@media (max-width:420px){:root{--u:12px}.task{padding:6px 12px}.pad button{min-height:46px;font-size:20px}}
@media (max-height:640px) and (max-width:899px){.world{--w:12px}.pad button{min-height:42px}}

.panel{width:min(620px,100%);padding:22px;border-radius:26px;background:#fff;box-shadow:0 8px 0 rgba(16,38,27,.25)}
.panel h1{margin:0 0 6px;font:900 clamp(28px,6vw,40px)/1 system-ui,sans-serif;text-transform:uppercase;letter-spacing:-.02em;color:var(--forest)}
.panel h1 span{color:#3FA34D}
.panel p{margin:0 0 12px;font-weight:700}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.mode{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:12px;border-radius:18px;border:3px solid transparent;background:#F3F7EC;box-shadow:0 4px 0 rgba(16,38,27,.15)}
.mode[aria-pressed="true"]{border-color:var(--forest);background:#EEF8D6}
.mode b{font-size:17px}
.mode small{font-weight:700;color:#4E6157;line-height:1.3}
.mode .mi{display:flex;gap:2px;height:22px;align-items:flex-end}
.mode .mi i{width:10px;height:10px;border-radius:2px;background:var(--c)}
.lvls{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.lvls button{min-height:42px;padding:0 14px;border-radius:12px;border:2px solid rgba(16,38,27,.15);background:#fff;font-weight:900}
.lvls button[aria-pressed="true"]{background:var(--forest);color:#fff;border-color:var(--forest)}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 14px}
.how div{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border-radius:14px;background:#F6F4EF;font-size:13px;text-align:center}
.goalp{padding:8px 12px;border-radius:12px;background:#EEF8D6;color:var(--forest)}
.stars{display:flex;gap:6px;justify-content:center;margin:6px 0 12px}
.stars svg{width:48px;height:48px}
@media (max-width:560px){.modes{grid-template-columns:minmax(0,1fr)}.mode{flex-direction:row;align-items:center}.mode small{display:none}.how div{padding:8px 4px;font-size:11.5px}.panel{padding:18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

</div>

<div class="screen" id="end" hidden>
  <div class="panel" style="text-align:center">

    <div class="ctrl"><button class="btn lime" id="again" type="button" data-en="Another round">Ещё раунд</button><button class="btn" id="toMenu" type="button" data-en="Change mode">Другой режим</button></div>
  </div>
</div>

      typed = String(task.r); showAns("ok"); $("say").innerHTML = steps[steps.length - 1].say + L(" Запомни шаги, и следующий получится.", " Remember the steps, and you will get the next one.");
      $("stepB").hidden = true; $("hintB").hidden = true; $("nextB").hidden = false; paintDots(); $("nextB").focus();
    }
  }
  $("nextB").addEventListener("click", function () { $("nextB").hidden = true; next(); });
  function paintDots() { var d = $("dots"); d.innerHTML = ""; for (var i = 0; i < ROUND; i++) d.appendChild(el("i", results[i] || (i === idx ? "now" : ""))); $("pos").textContent = Math.min(idx + 1, ROUND) + "/" + ROUND; }
  function paintGoal() { if (!goal) return; $("goalChip").hidden = false; $("goalN").textContent = Math.min(goalOk, goal); $("goalOf").textContent = goal; }
  function newTask() {
    task = gen(); typed = ""; tries = 0; hintUsed = false; first = null; steps = []; stepI = -1; locked = false; tq = Date.now();
    $("q").textContent = task.txt; showAns(); scene0(); paintDots();
    $("say").innerHTML = mode === "mul" ? L("Сколько всего клеток на грядке?", "How many squares are in the bed?") : mode === "sub" ? L("Сколько кубиков останется?", "How many cubes will be left?") : L("Сколько кубиков будет вместе?", "How many cubes altogether?");
    $("hintB").hidden = false; $("stepB").hidden = true; $("nextB").hidden = true;
  }
  function next() { idx++; if (idx >= ROUND) return finish(); newTask(); }
  function startRound() {
    idx = 0; results = []; seen = {};
    $("mName").textContent = MODES[mode].name; $("mLv").textContent = MODES[mode].lv[level - 1];
    $("menu").hidden = true; $("end").hidden = true; $("app").hidden = false;
    makeWorld(); paintGoal(); newTask();
  }
  var STAR = function (on) { return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z" fill="' + (on ? "#FFC83D" : "#E3E6E1") + '" stroke="' + (on ? "#E0A11B" : "#C9CEC7") + '" stroke-width="1.4" stroke-linejoin="round"/></svg>'; };
  function finish() {
    var ok = results.filter(function (r) { return r === "ok"; }).length, stars = ok >= 9 ? 3 : ok >= 7 ? 2 : ok >= 4 ? 1 : 0;
    var key = "kg.best." + mode + "." + level, best = +(store.get(key) || 0); if (stars > best) store.set(key, stars);
    $("stars").innerHTML = STAR(stars >= 1) + STAR(stars >= 2) + STAR(stars >= 3);
    $("endT").textContent = stars === 3 ? L("Мастер Кубограда!", "Cubetown master!") : stars ? L("Раунд пройден", "Round complete") : L("Попробуй ещё раз", "Try again");
    $("endP").textContent = EN
      ? "Right on the first try: " + ok + " of " + ROUND + "." + (stars < 3 ? " Cube hints will help, and three stars need 9 first-try answers." : " Time to level up.") + (goal ? " Samir's goal: " + Math.min(goalOk, goal) + " of " + goal + "." : "")
      : "Сразу верно: " + ok + " из " + ROUND + "." + (stars < 3 ? " Подсказки на кубиках помогут разобраться, а для трёх звёзд нужно 9 верных сразу." : " Можно поднимать уровень.") + (goal ? " Цель Самира: " + Math.min(goalOk, goal) + " из " + goal + "." : "");
    $("end").hidden = false; sfx.win();
    post({ event: "finish", correct: ok, total: ROUND, stars: stars, mode: mode, level: level });
  }
  $("again").addEventListener("click", startRound);
  $("toMenu").addEventListener("click", openMenu);
  $("menuB").addEventListener("click", openMenu);

  /* ---------- меню ---------- */
  function openMenu() {
    $("end").hidden = true; $("menu").hidden = false;
    var m = $("modes"); m.innerHTML = "";
    Object.keys(MODES).filter(function (k) { return !fixed || k === mode; }).forEach(function (k) {
      var M = MODES[k], b = el("button", "mode"); b.type = "button"; b.setAttribute("aria-pressed", k === mode ? "true" : "false");
      var mi = el("span", "mi"); M.col.concat(M.col).forEach(function (c, i) { var q = el("i"); q.style.setProperty("--c", c); q.style.height = (8 + (i % 3) * 6) + "px"; mi.appendChild(q); });
      b.appendChild(mi); b.appendChild(el("b", "", M.name)); b.appendChild(el("small", "", M.desc));
      b.addEventListener("click", function () { mode = k; openMenu(); });
      m.appendChild(b);
    });
    var l = $("lvls"); l.innerHTML = "";
    MODES[mode].lv.forEach(function (name, i) { if (fixed && i + 1 !== level) return; var b = el("button", "", name + (+(store.get("kg.best." + mode + "." + (i + 1)) || 0) ? " · " + "★".repeat(+store.get("kg.best." + mode + "." + (i + 1))) : "")); b.type = "button"; b.setAttribute("aria-pressed", i + 1 === level ? "true" : "false"); b.addEventListener("click", function () { level = i + 1; openMenu(); }); l.appendChild(b); });
    if (goal) { $("goalP").hidden = false; $("goalP").textContent = EN
      ? "Samir's task: " + goal + " " + en1(goal, "correct answer", "correct answers") + " on the first try · " + MODES[mode].lv[level - 1] + ". Done so far: " + Math.min(goalOk, goal) + "."
      : "Задание Самира: " + goal + " " + plTail(goal, "верный ответ", "верных ответа", "верных ответов") + " с первой попытки" + (CFG.levelName ? " · " + CFG.levelName : "") + ". Уже есть: " + Math.min(goalOk, goal) + "."; }
    $("start").focus();
  }
  $("start").addEventListener("click", startRound);
  var hr = $("howRod"); hr.style.setProperty("--u", "9px"); for (var i = 0; i < 10; i++) hr.appendChild(cube());
  openMenu();
})();
</script>
</body>
</html>
