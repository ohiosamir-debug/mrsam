<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mr.Sam · Кабинет IELTS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20256%20256%22%3E%3Crect%20width%3D%22256%22%20height%3D%22256%22%20rx%3D%2264%22%20fill%3D%22%23D5F36A%22/%3E%3Cg%20transform%3D%22translate%2820%2034%29%20scale%281.82%29%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22fvT%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%22.6%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23FFFDF6%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23F1EBDC%22/%3E%3C/linearGradient%3E%3ClinearGradient%20id%3D%22fvW%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%22.35%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23E8FA9C%22/%3E%3Cstop%20offset%3D%22.5%22%20stop-color%3D%22%23C9EC5A%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%239FCB33%22/%3E%3C/linearGradient%3E%3CradialGradient%20id%3D%22fvB%22%20cx%3D%22.5%22%20cy%3D%22.5%22%20r%3D%22.5%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23FF8FA0%22%20stop-opacity%3D%22.75%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23FF8FA0%22%20stop-opacity%3D%220%22/%3E%3C/radialGradient%3E%3CradialGradient%20id%3D%22fvS%22%20cx%3D%22.4%22%20cy%3D%22.35%22%20r%3D%22.7%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23FFF6B8%22/%3E%3Cstop%20offset%3D%22.6%22%20stop-color%3D%22%23FFD84D%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23F2B92A%22/%3E%3C/radialGradient%3E%3C/defs%3E%3Cpath%20d%3D%22M34%2056%20L114%2043%20L9%2094%20Z%22%20fill%3D%22url%28%23fvW%29%22%20stroke%3D%22%23123F2B%22%20stroke-width%3D%226.5%22%20stroke-linejoin%3D%22round%22/%3E%3Cpath%20d%3D%22M42%2062%20L82%2055%22%20stroke%3D%22%23fff%22%20stroke-opacity%3D%22.6%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M11%206%20L114%2043%20L34%2056%20Z%22%20fill%3D%22url%28%23fvT%29%22%20stroke%3D%22%23123F2B%22%20stroke-width%3D%226.5%22%20stroke-linejoin%3D%22round%22/%3E%3C/g%3E%3C/svg%3E">
<meta name="description" content="Личный кабинет ученика Mr.Sam: тренировочные тесты IELTS и TOEFL, разбор ошибок и график прогресса.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,500;0,600;0,700;0,800;0,900;0,1000;1,700&family=Unbounded:wght@600;800;900&display=swap">
<style>
/* Layout: app shell: top bar + three views (Обзор / Тесты / История) + full-width test runner.
   Same Mr.Sam tokens as the site, one rounded face (Nunito) in several weights. Light-only by design. */
:root{
  color-scheme:light;
  --bg:#F7F8F2; --surface:#FFFFFF; --ink:#17382C; --muted:#53665B; --line:#D6DFD3;
  --forest:#153E2D; --forest-2:#1E4D39; --on-forest:#F2F7EF; --on-forest-muted:#BCD0C2;
  --lime:#D5F36A; --on-lime:#153E2D; --mint:#DCEEDC; --lavender:#E8E1F4; --peach:#FFE4CC;
  --orange-ink:#9A4A10; --error:#A33A12; --ok:#16815A;
  --s-r:#16815A; --s-l:#7A5BB5; --s-w:#C9711E;   /* разделы на графике: Reading / Listening / Writing */
  --font:"Nunito","Arial Rounded MT Bold","Varela Round",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:28px; --r-md:20px; --r-sm:14px; --wrap:1200px; --gutter:clamp(16px,3.5vw,32px);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.6 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100vh}
img,svg{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--font);font-weight:900;line-height:1.12;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(28px,3.6vw,42px);font-weight:1000}
h2{font-size:clamp(22px,2.4vw,28px)}
h3{font-size:18px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #E88135;outline-offset:3px;border-radius:8px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:var(--gutter)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.muted{color:var(--muted)}
.eyebrow{font:900 12px/1.2 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.skip{position:absolute;left:16px;top:-80px;z-index:100;background:var(--forest);color:var(--on-forest);padding:12px 18px;border-radius:12px;font-weight:900;text-decoration:none}
.skip:focus{top:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:0;font:900 15px/1.1 var(--font);text-decoration:none;cursor:pointer;transition:transform .16s var(--ease),background-color .16s;text-align:center}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--forest);color:var(--on-forest)}
.btn-primary:hover{background:var(--forest-2)}
.btn-lime{background:var(--lime);color:var(--on-lime)}
.btn-ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-ghost:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn-sm{min-height:44px;padding:0 16px;font-size:14px}
.link{background:none;border:0;padding:8px 0;min-height:44px;font:800 15px/1.2 var(--font);color:var(--ink);text-decoration:underline;text-underline-offset:4px;cursor:pointer}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(247,248,242,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;min-height:44px}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--forest);display:grid;place-items:center;flex:none}
.logo-mark svg{width:20px;height:20px}
.logo b{font:1000 17px/1 var(--font)}
.logo small{display:block;font:900 11px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.nav button{border:0;background:transparent;min-height:40px;padding:0 18px;border-radius:999px;font:900 15px/1 var(--font);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.nav button svg{width:18px;height:18px}
.nav button[aria-current="page"]{background:var(--forest);color:var(--on-forest)}
.user{display:flex;align-items:center;gap:8px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--peach);display:grid;place-items:center;font:1000 16px/1 var(--font);flex:none}
.user-name{font-weight:900;max-width:16ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:760px){
  .topbar .nav{display:none}
  .user-name{display:none}
  body.in-app{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
.bottom-nav button{flex:1;border:0;background:transparent;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:900 12px/1 var(--font);color:var(--muted);border-radius:14px;cursor:pointer}
.bottom-nav button svg{width:22px;height:22px}
.bottom-nav button[aria-current="page"]{color:var(--forest);background:var(--mint)}
.bottom-nav{display:none}
@media (max-width:760px){.bottom-nav{display:flex}}
.bottom-nav[hidden],body.running .bottom-nav{display:none}

.banner{background:var(--lavender);border-radius:var(--r-sm);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:800;font-size:15px;margin-top:20px}
.banner.demo{background:var(--peach)}

main{padding-block:28px 64px}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.view-head p{color:var(--muted);margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(18px,2.4vw,28px);min-width:0}

/* login */
.login{min-height:calc(100vh - 69px);display:grid;place-items:center;padding-block:32px}
.login-card{width:min(100%,520px);display:flex;flex-direction:column;gap:18px}
.login-card .pass-top{margin:calc(clamp(18px,2.4vw,28px) * -1) calc(clamp(18px,2.4vw,28px) * -1) 0;background:var(--lime);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:14px 22px;display:flex;justify-content:space-between;font:900 12px/1.3 var(--font);letter-spacing:.08em;text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:900;font-size:14px}
.field input,.field select,.field textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;min-height:50px;width:100%;font-weight:700}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--forest);box-shadow:0 0 0 3px var(--mint)}
.field [aria-invalid="true"]{border-color:var(--error)}
.err{color:var(--error);font-weight:800;font-size:14px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:440px){.row2{grid-template-columns:minmax(0,1fr)}}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:800;font-size:14px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.note{font-size:14px;color:var(--muted)}

/* overview */
.ov-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-6{grid-column:span 6}.span-4{grid-column:span 4}
@media (max-width:980px){.span-8,.span-4{grid-column:span 12}}
@media (max-width:760px){.span-6{grid-column:span 12}}
.next{background:var(--forest);color:var(--on-forest);border:0;display:flex;flex-direction:column;gap:14px}
.next .eyebrow{color:var(--on-forest-muted)}
.next p{color:var(--on-forest-muted)}
.next .btn{align-self:flex-start}
.exam-card{display:flex;flex-direction:column;gap:16px}
.exam-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.big{font:1000 clamp(44px,5vw,60px)/.95 var(--font);letter-spacing:-.02em}
.big small{font:900 15px/1 var(--font);color:var(--muted);letter-spacing:0;margin-left:6px}
.target-pill{display:inline-flex;align-items:center;gap:8px;background:var(--mint);border-radius:999px;padding:6px 6px 6px 14px;font:900 14px/1 var(--font)}
.target-pill select{border:0;background:var(--surface);border-radius:999px;min-height:36px;padding:0 10px;font-weight:900;cursor:pointer}
.gauge{height:12px;border-radius:99px;background:var(--bg);position:relative;overflow:visible;border:1px solid var(--line)}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--forest)}
.gauge b{position:absolute;top:-6px;bottom:-6px;width:3px;background:#E88135;border-radius:2px}
.gauge-labels{display:flex;justify-content:space-between;font:800 13px/1 var(--font);color:var(--muted);margin-top:8px}
.sections{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sec{background:var(--bg);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sec span{font:900 12px/1.2 var(--font);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.sec span i{width:10px;height:10px;border-radius:3px;flex:none}
.sec b{font:1000 24px/1.1 var(--font)}
.sec em{font:800 13px/1.2 var(--font);font-style:normal;color:var(--muted)}
.sec em.up{color:var(--ok)}
.sec em.down{color:var(--error)}
@media (max-width:420px){.sections{grid-template-columns:minmax(0,1fr)}}

.seg{display:inline-flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;min-height:38px;padding:0 16px;border-radius:999px;font:900 14px/1 var(--font);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.chart-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font:800 14px/1 var(--font);color:var(--muted);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend svg{width:14px;height:14px}
.chart-box{position:relative;width:100%;overflow:hidden}
.chart-box > svg{width:100%;height:auto;overflow:visible}
.chart-empty{padding:36px 12px;text-align:center;color:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:12px;padding:8px 12px;font:800 13px/1.35 var(--font);white-space:nowrap;transform:translate(-50%,calc(-100% - 12px));z-index:2}
.tip b{font-size:16px}

.weak{display:flex;flex-direction:column;gap:14px}
.weak-item{display:flex;flex-direction:column;gap:6px}
.weak-item .top{display:flex;justify-content:space-between;gap:10px;font-weight:900}
.weak-item .bar{height:10px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.weak-item .bar i{display:block;height:100%;border-radius:99px;background:#C9711E}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats3 div{background:var(--bg);border-radius:var(--r-sm);padding:12px}
.stats3 b{display:block;font:1000 26px/1 var(--font)}
.stats3 span{font-size:13px;color:var(--muted);font-weight:800}

/* tests catalog */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.test-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:980px){.test-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.test-grid{grid-template-columns:minmax(0,1fr)}}
.test-card{display:flex;flex-direction:column;gap:12px;transition:transform .18s var(--ease)}
.test-card:hover{transform:translateY(-3px)}
.test-card .tt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font:900 12px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;padding:7px 10px;border-radius:999px;white-space:nowrap}
.pill.ielts{background:var(--mint)}
.pill.toefl{background:var(--lavender)}
.pill.sec-r i,.pill.sec-l i,.pill.sec-w i{width:8px;height:8px;border-radius:2px}
.test-meta{display:flex;gap:14px;flex-wrap:wrap;font:800 14px/1.2 var(--font);color:var(--muted)}
.test-meta span{display:inline-flex;align-items:center;gap:6px}
.test-meta svg{width:16px;height:16px}
.test-card .best{font:900 14px/1.3 var(--font)}
.test-card .btn{margin-top:auto}

/* runner */
.run-bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 69px);z-index:20;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:20px}
.run-bar .in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.run-title{display:flex;flex-direction:column;gap:2px;min-width:0}
.run-title b{font:1000 18px/1.2 var(--font)}
.run-progress{flex:1;min-width:120px;max-width:360px;display:flex;flex-direction:column;gap:6px}
.run-progress .bar{height:8px;border-radius:99px;background:var(--mint);overflow:hidden}
.run-progress .bar i{display:block;height:100%;background:var(--forest);transition:width .25s}
.run-progress span{font:800 13px/1 var(--font);color:var(--muted)}
.timer{font:1000 20px/1 var(--font);background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;min-width:92px;text-align:center}
.timer.over{border-color:var(--error);color:var(--error)}
.confirm{background:var(--peach);border-radius:var(--r-sm);padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:800;margin-top:10px}
.run-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
.run-grid.single{grid-template-columns:minmax(0,820px);justify-content:center}
@media (max-width:900px){.run-grid{grid-template-columns:minmax(0,1fr)}}
.passage{position:sticky;top:160px;max-height:calc(100vh - 180px);overflow:auto;line-height:1.75}
@media (max-width:900px){.passage{position:static;max-height:none}}
.passage h3{font-size:22px;margin-bottom:12px}
.passage p{margin-bottom:12px}
.passage .pl{font:1000 14px/1 var(--font);color:var(--forest);background:var(--mint);border-radius:6px;padding:2px 7px;margin-right:6px}
.notice{border:2px dashed var(--line);border-radius:var(--r-sm);padding:16px;background:var(--bg)}
.part{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.part-head{display:flex;flex-direction:column;gap:4px}
.part-head .inst{color:var(--muted);font-size:15px}
.q{border:0;margin:0;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);min-width:0}
.q legend,.q .qtext{font-weight:900;padding:0;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start;float:left;width:100%}
.q legend + *{clear:both}
.qn{flex:none;min-width:30px;height:30px;border-radius:50%;background:var(--mint);display:grid;place-items:center;font:1000 13px/1 var(--font)}
.opts{display:grid;gap:8px;clear:both}
.opts.row{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:520px){.opts.row{grid-template-columns:minmax(0,1fr)}}
.opt{position:relative;display:block}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:800;font-size:15px;line-height:1.35}
.opt span::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);flex:none;background:var(--surface)}
.opt input:checked + span{border-color:var(--forest);background:var(--mint)}
.opt input:checked + span::before{border-color:var(--forest);background:radial-gradient(circle,var(--forest) 0 4px,var(--surface) 5px)}
.opt input:focus-visible + span{outline:3px solid #E88135;outline-offset:2px}
.gap-input{display:inline-block;width:auto;min-width:9ch;max-width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;font-weight:800}
.gap-input:focus{outline:none;border-color:var(--forest);box-shadow:0 0 0 3px var(--mint)}
.form-table{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:18px}
.form-table .lbl{font-weight:900;color:var(--muted);font-size:15px}
.form-table .val{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctest{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:18px 20px;line-height:2.6;font-size:17px}
.cw{white-space:nowrap}
.cw input{width:calc(var(--n) * 1ch + 22px);min-width:0;padding:4px 6px;min-height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);font-weight:900;letter-spacing:.05em}
.cw input:focus{outline:none;border-color:var(--forest);box-shadow:0 0 0 3px var(--mint)}
.audio{display:flex;flex-direction:column;gap:12px;background:var(--forest);color:var(--on-forest);border-radius:var(--r-md);padding:18px 20px}
.audio .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.audio .meta{color:var(--on-forest-muted);font-size:14px;font-weight:800}
.audio .wave{display:flex;gap:3px;align-items:center;height:28px}
.audio .wave i{width:4px;border-radius:2px;background:var(--lime);height:30%}
.audio.playing .wave i{animation:wv 1s ease-in-out infinite}
.audio.playing .wave i:nth-child(2n){animation-delay:.15s}.audio.playing .wave i:nth-child(3n){animation-delay:.3s}
@keyframes wv{50%{height:100%}}
.audio .warn{background:var(--peach);color:var(--ink);border-radius:10px;padding:10px 12px;font-weight:800;font-size:14px}
.say-btn{width:52px;height:52px;border-radius:50%;border:0;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;cursor:pointer;flex:none}
.say-btn svg{width:22px;height:22px}
.mini-say{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--forest);color:var(--on-forest);border-radius:999px;min-height:44px;padding:0 16px;font:900 14px/1 var(--font);cursor:pointer}
.mini-say svg{width:16px;height:16px}
.build{display:flex;flex-direction:column;gap:10px}
.build .slot{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg)}
.build .slot:empty::before{content:"Нажимай на слова по порядку";color:var(--muted);font-weight:800;font-size:14px;padding-left:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;min-height:40px;padding:0 12px;font:900 15px/1 var(--font);cursor:pointer}
.chip.used{opacity:.3;cursor:default}
.slot .chip{background:var(--mint);border-color:var(--forest)}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.speaker{font:900 14px/1.3 var(--font);color:var(--muted);margin-bottom:6px}
.essay textarea{min-height:340px;line-height:1.65;resize:vertical}
.wc{display:flex;justify-content:space-between;gap:10px;font:900 14px/1 var(--font);color:var(--muted)}
.wc .ok{color:var(--ok)}
.prompt-box{background:var(--lavender);border-radius:var(--r-md);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.prompt-box p{font-size:17px;line-height:1.6}
.run-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;padding:16px 0}

/* result */
.res-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px 32px;align-items:center;background:var(--forest);color:var(--on-forest);border:0}
@media (max-width:640px){.res-hero{grid-template-columns:minmax(0,1fr)}}
.res-score{font:1000 clamp(64px,9vw,104px)/.9 var(--font);letter-spacing:-.03em;color:var(--lime)}
.res-score small{display:block;font:900 14px/1.3 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--on-forest-muted);margin-top:8px}
.res-hero p{color:var(--on-forest-muted)}
.res-hero .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.res-hero .btn-ghost{background:transparent;color:var(--on-forest);box-shadow:inset 0 0 0 1.5px var(--on-forest-muted)}
.res-meta{display:flex;gap:10px 20px;flex-wrap:wrap;font-weight:900}
.res-meta span{background:rgba(255,255,255,.08);border-radius:999px;padding:6px 12px}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.skill{background:var(--bg);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.skill .top{display:flex;justify-content:space-between;font-weight:900;gap:8px}
.skill .bar{height:8px;border-radius:99px;background:var(--surface);overflow:hidden;border:1px solid var(--line)}
.skill .bar i{display:block;height:100%;background:var(--forest)}
.review{display:flex;flex-direction:column;gap:10px}
.rv{border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;background:var(--surface);display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 12px}
.rv .mark{grid-row:span 3;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:1000 14px/1 var(--font)}
.rv.right .mark{background:var(--mint);color:var(--ok)}
.rv.wrong .mark{background:var(--peach);color:var(--error)}
.rv .qq{font-weight:900}
.rv .aa{font-size:15px}
.rv .aa b.bad{color:var(--error)}
.rv .aa b.good{color:var(--ok)}
.rv .ev{font-size:14px;color:var(--muted);font-style:italic}
details.transcript{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm)}
details.transcript summary{cursor:pointer;min-height:52px;padding:14px 16px;font-weight:900}
details.transcript div{padding:0 16px 16px;display:flex;flex-direction:column;gap:6px}
.rubric{display:flex;flex-direction:column;gap:14px}
.crit{border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;background:var(--surface)}
.crit legend{font-weight:900;padding:0 4px}
.crit .opts{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.crit .opts{grid-template-columns:minmax(0,1fr)}}
.crit .opt span{flex-direction:column;align-items:flex-start;gap:2px;font-size:13px}
.crit .opt span::before{display:none}
.crit .opt span b{font-size:18px}

/* history */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:15px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:900 12px/1.2 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
tr:last-child td{border-bottom:0}
td.num{font-weight:1000}
.teacher{display:inline-block;background:var(--lime);border-radius:8px;padding:2px 8px;font-weight:900}
.empty{text-align:center;padding:40px 16px;display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--muted)}
.empty svg{width:80px;height:80px}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:12px 20px;font-weight:900;z-index:50;max-width:calc(100% - 32px);text-align:center}
@media (max-width:760px){body.in-app .toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}}


/* memes */
.meme{--r:-1.5deg;background:var(--surface);border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:8px;transform:rotate(var(--r));box-shadow:0 18px 40px -26px rgba(21,62,45,.55);border:1px solid var(--line);max-width:340px;width:100%;margin:0;transition:transform .25s var(--ease)}
.meme:hover{transform:rotate(0) scale(1.02)}
.meme.small{max-width:280px}
.meme-cap{font:1000 16px/1.25 var(--font);text-align:center;text-wrap:balance}
.meme-panel{background:var(--mint);border-radius:16px;padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative}
.meme-panel.alt{background:var(--peach)}
.meme-panel.lav{background:var(--lavender)}
.meme-panel .mascot{width:100%;max-width:150px;height:auto}
.meme.small .meme-panel .mascot{max-width:118px}
.meme-panel p{font:900 14px/1.3 var(--font)}
.meme-sticker{position:absolute;top:40px;right:6px;font:1000 13px/1 var(--font);background:var(--ink);color:#fff;border-radius:8px;padding:5px 7px;transform:rotate(6deg)}
.res-meme{display:flex;justify-content:center}
.ov-meme{display:flex;justify-content:center}

/* nav with five tabs */
@media (max-width:1120px){.nav button{padding:0 12px;font-size:14px}.nav button svg{display:none}}
.bottom-nav button{font-size:11px}

/* homework */
.hw-empty{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:700px){.hw-empty{grid-template-columns:minmax(0,1fr);justify-items:center}}
.hw-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;margin-bottom:8px}
@media (max-width:700px){.hw-top{grid-template-columns:minmax(0,1fr);justify-items:center}}
.hw-counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.hw-counts div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px}
.hw-counts b{display:block;font:1000 40px/1 var(--font)}
.hw-counts span{font-weight:800;color:var(--muted);font-size:14px}
.hw-sec{margin:28px 0 12px;font-size:22px}
.hw-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.hw-list{grid-template-columns:minmax(0,1fr)}}
.hw-card{display:flex;flex-direction:column;gap:12px}
.hw-card.hw-todo{border-color:var(--forest);border-width:2px}
.hw-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hw-head h3{font-size:19px;line-height:1.25}
.hw-meta{margin-top:6px}
.hw-due{display:inline-flex;font:900 13px/1 var(--font);background:var(--bg);border-radius:999px;padding:6px 10px}
.hw-due.soon{background:var(--peach);color:var(--orange-ink)}
.hw-due.late{background:#FBD9CC;color:var(--error)}
.hw-pill{flex:none;font:900 12px/1 var(--font);text-transform:uppercase;letter-spacing:.05em;padding:7px 10px;border-radius:999px;white-space:nowrap}
.hw-pill.todo{background:var(--lime);color:var(--on-lime)}
.hw-pill.wait{background:var(--lavender)}
.hw-pill.done{background:var(--mint);color:var(--ok)}
.hw-desc{color:var(--muted);font-size:15px}
.hw-answer{display:flex;flex-direction:column;gap:4px;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;overflow-wrap:anywhere}
.hw-grade{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;background:var(--mint);border-radius:14px;padding:12px 14px}
.hw-grade > b{font:1000 26px/1 var(--font);background:var(--surface);border-radius:12px;padding:10px 12px;min-width:64px;text-align:center}
.hw-form{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.hw-form textarea{min-height:84px;resize:vertical}
.lbl-fake{font-weight:900;font-size:14px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;min-height:120px;border:2px dashed var(--line);border-radius:var(--r-sm);background:var(--bg);padding:12px;cursor:pointer;transition:border-color .15s,background-color .15s}
.drop:hover,.drop.over{border-color:var(--forest);background:var(--mint)}
.drop svg{width:26px;height:26px}
.drop b{font-size:15px}
.drop small,.file-name{font-size:13px;color:var(--muted);font-weight:700;overflow-wrap:anywhere}
.hw-form input[type=file]{position:absolute;width:1px;height:1px;min-height:0;padding:0;border:0;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.hw-form input[type=file]:focus-visible + .drop{outline:3px solid #E88135;outline-offset:2px}

/* payments */
.pay-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:18px;align-items:start}
@media (max-width:900px){.pay-grid{grid-template-columns:minmax(0,1fr)}}
.pay-balance{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.pay-balance .meme{align-self:center;margin-top:8px}
.pay-packages{display:flex;flex-direction:column;gap:16px}
.pk-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.pk-list{grid-template-columns:minmax(0,1fr)}}
.pk{position:relative;display:block}
.pk input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pk-body{display:flex;flex-direction:column;gap:4px;min-height:84px;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--bg);transition:border-color .15s,background-color .15s}
.pk-body b{font:1000 19px/1.2 var(--font)}
.pk-body span{font-weight:800;font-size:14px;color:var(--muted)}
.pk input:checked + .pk-body{border-color:var(--forest);background:var(--mint)}
.pk input:focus-visible + .pk-body{outline:3px solid #E88135;outline-offset:2px}
.offer-check{display:flex;gap:10px;align-items:flex-start;font-weight:800;cursor:pointer;min-height:44px;padding-top:6px}
.offer-check input{width:22px;height:22px;flex:none;accent-color:var(--forest);margin:0}
.pay-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sbp{display:flex;flex-direction:column;gap:4px;background:var(--lavender);border-radius:16px;padding:14px 16px;width:100%}
.sbp b{font:1000 22px/1.2 var(--font)}
.sbp .btn{align-self:flex-start;margin-top:6px}
.note-warn{background:var(--peach);border-radius:12px;padding:12px 14px;font-weight:800;font-size:14px;width:100%}
.pay-confirm{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1.5px solid var(--forest);border-radius:16px;padding:16px}
.pay-confirm .btn{align-self:flex-start}

/* =================== JUICY: стиль сайта + личные темы =================== */
:root{
  --bg:#F5F3EF; --surface:#FFFFFF; --ink:#153E2D; --muted:#5B6B62; --line:#E6E1D8; --sand:#E9E3D7;
  --violet:#8C7BFF; --pink:#FF6FB5; --yellow:#FFD84D; --mint2:#7FD8B6; --night:#0F2A1F;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --r-lg:30px; --r-md:22px; --r-sm:16px;
  --acc:#D5F36A; --acc-ink:#153E2D; --acc-soft:#F0FAD0; --acc-deep:#A9C93F;
}
body[data-theme="violet"]{--acc:#8C7BFF;--acc-ink:#FFFFFF;--acc-soft:#ECE8FF;--acc-deep:#6A58E0}
body[data-theme="pink"]{--acc:#FF6FB5;--acc-ink:#FFFFFF;--acc-soft:#FFE3F1;--acc-deep:#D94A90}
body[data-theme="yellow"]{--acc:#FFD84D;--acc-ink:#153E2D;--acc-soft:#FFF5CC;--acc-deep:#D9AE1F}
body[data-theme="mint"]{--acc:#7FD8B6;--acc-ink:#153E2D;--acc-soft:#E0F6EC;--acc-deep:#4FB08C}
body{background:var(--bg);transition:background-color .3s}
h1{font:900 clamp(26px,3.4vw,40px)/1.05 var(--display);text-transform:uppercase;letter-spacing:-.01em}
h2{font:800 clamp(18px,1.9vw,23px)/1.15 var(--display);letter-spacing:-.01em}
h3{font-weight:900}
.eyebrow{font:800 11px/1.2 var(--display);letter-spacing:.08em}
.card{border:0;border-radius:var(--r-lg);box-shadow:0 1px 0 rgba(21,62,45,.04),0 18px 40px -30px rgba(21,62,45,.35)}

/* 3D buttons */
.btn{font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .14s var(--ease),box-shadow .14s,background-color .16s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn[disabled]{box-shadow:none;transform:none}
.btn-primary{background:var(--forest);color:#F2F7EF;box-shadow:0 4px 0 #0A2318}
.btn-primary:hover{background:#1B4A37;box-shadow:0 6px 0 #0A2318}
.btn-lime{background:var(--acc);color:var(--acc-ink);box-shadow:0 4px 0 var(--acc-deep)}
.btn-lime:hover{box-shadow:0 6px 0 var(--acc-deep)}
.btn-ghost{background:var(--surface);box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--sand)}
.btn-ghost:hover{box-shadow:inset 0 0 0 2px var(--ink),0 6px 0 var(--sand)}
.btn-danger{background:#E2483D;color:#fff;box-shadow:0 4px 0 #A92F26}
.btn-big{min-height:56px;padding:0 28px;font-size:16px}

/* topbar */
.topbar{background:rgba(245,243,239,.92);border-bottom:0}
.logo-mark{width:44px;height:38px;background:transparent;border-radius:0}
.logo-mark svg.logo-plane{width:44px;height:38px}
.logo b{font:900 16px/1 var(--display);text-transform:uppercase}
.nav{background:var(--forest);border:0;padding:5px;box-shadow:0 10px 24px -16px rgba(15,42,31,.7)}
.nav button{color:#BCD0C2;position:relative}
.nav button:hover{color:#fff}
.nav button[aria-current="page"]{background:var(--acc);color:var(--acc-ink)}
.nav-badge{min-width:20px;height:20px;border-radius:999px;background:var(--pink);color:#fff;font:900 11px/20px var(--font);padding:0 6px;text-align:center}
.bottom-nav button{position:relative}
.bottom-nav .nav-badge{position:absolute;top:4px;left:calc(50% + 6px)}
.bottom-nav button[aria-current="page"]{background:var(--acc-soft);color:var(--ink)}
.avatar{background:var(--acc);color:var(--acc-ink);font-size:20px;box-shadow:0 3px 0 var(--acc-deep)}
.avatar-lg{width:64px;height:64px;font-size:34px;border-radius:22px;box-shadow:0 5px 0 var(--acc-deep)}
.avatar-xl{width:96px;height:96px;font-size:52px;border-radius:30px;box-shadow:0 6px 0 var(--acc-deep)}
.user-chip{display:inline-flex;align-items:center;gap:10px;border:0;background:var(--surface);border-radius:999px;padding:4px 14px 4px 4px;min-height:48px;cursor:pointer;font:900 15px/1 var(--font);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.user-chip:hover,.user-chip[aria-current="page"]{box-shadow:inset 0 0 0 2px var(--ink)}
.user-chip .avatar{width:40px;height:40px;font-size:20px;box-shadow:none}
@media (max-width:760px){.user-chip{padding:4px}}
.banner{background:var(--acc-soft);border-radius:var(--r-md)}
.banner.demo{background:#FFE9D6}

/* login */
.login-card{gap:16px;width:min(100%,560px)}
.login-card .pass-top{background:var(--acc);color:var(--acc-ink);font-family:var(--display);font-weight:800;font-size:11px;transition:background-color .3s}
.login-hero{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:center}
.login-mascot svg{width:96px;height:auto;animation:bob 3.2s ease-in-out infinite}
.login-hero h1{font-size:clamp(22px,3vw,30px)}
.login-hero p{margin-top:6px}
.login-form{display:flex;flex-direction:column;gap:16px}
.login-me{display:flex;gap:14px;align-items:flex-end}
.login-ava{flex:none}
.login-tabs{width:100%}
.login-tabs button{flex:1}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.field input,.field select,.field textarea{background:var(--bg);border:2px solid transparent;border-radius:var(--r-sm)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);box-shadow:0 0 0 4px var(--acc-soft)}

/* pickers */
.pick{position:relative;display:block;cursor:pointer}
.pick input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pick-ava{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}
.pick-ava .pick span{display:grid;place-items:center;height:52px;border-radius:16px;background:var(--bg);font-size:26px;transition:transform .15s var(--ease)}
.pick-ava .pick:hover span{transform:translateY(-2px)}
.pick-ava input:checked + span{background:var(--acc);box-shadow:0 4px 0 var(--acc-deep);transform:translateY(-2px)}
.pick-theme{display:flex;flex-wrap:wrap;gap:8px}
.pick-theme .pick span{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 8px;border-radius:999px;background:var(--bg);font:900 14px/1 var(--font)}
.pick-theme .pick span i{width:28px;height:28px;border-radius:50%;background:var(--sw);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.pick-theme input:checked + span{box-shadow:inset 0 0 0 2px var(--ink)}
.pick-track{display:flex;width:100%}
.pick-track .pick{flex:1}
.pick-track .pick span{display:flex;align-items:center;justify-content:center;min-height:42px;border-radius:999px;font:900 14px/1 var(--font);color:var(--muted)}
.pick-track input:checked + span{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 2px 0 var(--line)}
.pick input:focus-visible + span{outline:3px solid #E88135;outline-offset:2px}

/* overview hero */
.hero{background:var(--acc);color:var(--acc-ink);border-radius:var(--r-lg);padding:clamp(20px,3vw,34px);display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:center;position:relative;overflow:hidden;transition:background-color .3s}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.18);pointer-events:none}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero-main{display:flex;flex-direction:column;gap:14px;min-width:0;position:relative;z-index:1}
.hero-id{display:flex;gap:16px;align-items:center}
.hero-id .avatar{background:#fff;color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.15)}
.hero .eyebrow{color:inherit;opacity:.8}
.hero h1{font-size:clamp(26px,3.6vw,44px);overflow-wrap:anywhere}
.hero-goal{font:800 clamp(16px,1.6vw,19px)/1.35 var(--font)}
.hero-chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-x{display:inline-flex;align-items:center;gap:4px;min-height:38px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.75);color:var(--ink);font:900 14px/1 var(--font);border:0}
.chip-x.hot{background:var(--ink);color:#fff}
.chip-x.add{cursor:pointer;background:transparent;box-shadow:inset 0 0 0 2px currentColor;color:inherit}
.flight{background:rgba(255,255,255,.55);border-radius:20px;padding:16px 18px 12px;color:var(--ink)}
.flight-track{position:relative;height:10px;border-radius:99px;background:repeating-linear-gradient(90deg,rgba(21,62,45,.25) 0 8px,transparent 8px 14px);margin:18px 10px 0}
.flight-track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--ink)}
.flight-plane{position:absolute;top:50%;width:52px;transform:translate(-50%,-60%);filter:drop-shadow(0 4px 4px rgba(0,0,0,.15))}
.flight-plane svg{width:52px;height:auto}
.flight-flag{position:absolute;top:50%;transform:translate(-20%,-125%);font-size:22px;z-index:1}
.flight-labels{display:flex;justify-content:space-between;gap:10px;margin-top:16px;font:800 13px/1.2 var(--font)}
.flight-labels b{font:900 16px/1 var(--display)}
.hero-side{display:flex;flex-direction:column;gap:14px;align-items:flex-end;position:relative;z-index:1;min-width:0}
@media (max-width:900px){.hero-side{align-items:stretch}}
.sticky-note{background:var(--yellow);color:var(--ink);border-radius:6px 22px 22px 22px;padding:16px 18px;box-shadow:5px 5px 0 var(--ink);transform:rotate(1.6deg);max-width:360px;display:flex;flex-direction:column;gap:6px}
.sticky-note .eyebrow{opacity:1}
.sticky-note p{font:800 15px/1.45 var(--font)}
.hero-buddy{display:flex;align-items:flex-end;gap:6px}
.buddy-svg svg{width:clamp(110px,12vw,150px);height:auto;animation:bob 3.4s ease-in-out infinite}
.bubble{background:#fff;color:var(--ink);border-radius:20px 20px 4px 20px;padding:12px 14px;font:900 14px/1.3 var(--font);max-width:220px;box-shadow:0 4px 0 rgba(0,0,0,.12);margin-bottom:56px}
@media (max-width:900px){.hero-buddy{justify-content:flex-end}}

/* plan */
.plan{background:var(--forest);color:#F2F7EF;display:flex;flex-direction:column;gap:12px}
.plan .eyebrow{color:#BCD0C2}
.plan-list{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.plan-row{display:grid;grid-template-columns:40px minmax(0,1fr) 22px;gap:12px;align-items:center;text-align:left;border:0;background:rgba(255,255,255,.08);color:inherit;border-radius:18px;padding:12px;cursor:pointer;transition:background-color .15s,transform .15s var(--ease)}
.plan-row:hover{background:rgba(255,255,255,.14);transform:translateX(3px)}
.plan-row.hot{box-shadow:inset 0 0 0 2px var(--acc)}
.plan-emo{width:40px;height:40px;border-radius:12px;background:var(--acc);display:grid;place-items:center;font-size:20px}
.plan-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.plan-txt b{font:900 15px/1.25 var(--font);overflow-wrap:anywhere}
.plan-txt small{font:700 13px/1.3 var(--font);color:#BCD0C2}
.plan-go svg{width:20px;height:20px}
.exam-card .big{font:900 clamp(40px,4.4vw,54px)/.95 var(--display)}
.target-pill{background:var(--acc-soft)}
.gauge i{background:var(--acc-deep)}
.sec{background:var(--bg)}
.seg{background:var(--bg);border:0}
.stats3 div{background:var(--bg)}
.hw-counts div{background:var(--surface);box-shadow:0 18px 40px -30px rgba(21,62,45,.35)}
[hidden]{display:none!important}
.stats3 b{font-family:var(--display);font-weight:900}

/* profile */
.me-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
@media (max-width:900px){.me-grid{grid-template-columns:minmax(0,1fr)}}
.me-card{display:flex;flex-direction:column;gap:16px}
.me-card.span-all{grid-column:1/-1}
.me-preview{display:flex;gap:16px;align-items:center}
.me-preview b{display:block;font:900 20px/1.2 var(--display);text-transform:uppercase}

/* homework list */
.hw-counts div{border:0;border-radius:var(--r-md)}
.hw-counts .c-todo{background:var(--acc);color:var(--acc-ink)}
.hw-counts .c-todo span{color:inherit;opacity:.8}
.hw-counts b{font:900 40px/1 var(--display)}
.hw-sec{font:900 clamp(18px,2vw,22px)/1.1 var(--display);text-transform:uppercase}
.hw-card.hw-todo{box-shadow:inset 0 0 0 2px var(--ink),0 18px 40px -30px rgba(21,62,45,.35)}
.hw-card .btn{align-self:flex-start;margin-top:auto}
.hw-pill.todo{background:var(--acc);color:var(--acc-ink)}
.hp-chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.hp-chips li{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:999px;padding:6px 10px;font:800 13px/1.2 var(--font)}
.hp-chips li.ok{background:#DDF3E6;color:#11633F}
.hw-prog{display:flex;align-items:center;gap:12px}
.hw-prog .bar{flex:1;height:10px;border-radius:99px;background:var(--bg);overflow:hidden}
.hw-prog .bar i{display:block;height:100%;border-radius:99px;background:var(--acc-deep);transition:width .3s var(--ease)}
.hw-prog span{font:900 13px/1 var(--font);color:var(--muted);white-space:nowrap}
.hw-prog.big .bar{height:14px}
@media (max-width:520px){.hw-prog{flex-direction:column;align-items:stretch;gap:6px}.hw-prog .bar{flex:none}}

/* homework detail */
.hwd{max-width:900px}
.hwd-head{display:flex;flex-direction:column;gap:12px}
.hwd-head .back{align-self:flex-start;min-height:36px;padding:0;text-decoration:none;font-weight:900;color:var(--muted)}
.hwd-head .back:hover{color:var(--ink)}
.hwd-title{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hwd-title h1{font-size:clamp(22px,3vw,34px)}
.hw-meta{display:flex;gap:8px;flex-wrap:wrap}
.hp-list{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:none}
.hp{display:flex;flex-direction:column;gap:14px;transition:box-shadow .2s}
.hp.done{box-shadow:inset 0 0 0 2px #16815A,0 18px 40px -30px rgba(21,62,45,.35)}
.hp-head{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:14px;align-items:center}
.hp-num{width:46px;height:46px;border-radius:16px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;box-shadow:0 4px 0 var(--acc-deep);position:relative}
.hp-num b{font:900 18px/1 var(--display)}
.hp-num i{display:none;width:24px;height:24px}
.hp-num i svg{width:24px;height:24px}
.hp.done .hp-num{background:#16815A;color:#fff;box-shadow:0 4px 0 #0E5A3E}
.hp.done .hp-num b{display:none}
.hp.done .hp-num i{display:block}
.hp-title{display:flex;flex-direction:column;gap:4px;min-width:0}
.hp-type{font:800 12px/1.2 var(--font);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.hp-title h3{font:900 18px/1.25 var(--font)}
.hp-state{font:900 12px/1 var(--font);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.hp.done .hp-state{color:#16815A}
.hp-hint{background:var(--acc-soft);border-radius:14px;padding:10px 14px;font-weight:800;font-size:14px}
.hp-body{display:flex;flex-direction:column;gap:12px;min-width:0}
.hp-text{font-size:16px;line-height:1.6}
.hp-fb{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;background:#DDF3E6;border-radius:16px;padding:12px 14px}
.hp-fb > b{font:900 18px/1 var(--display);background:#fff;border-radius:12px;padding:10px 12px;min-width:56px;text-align:center}
.tick{display:flex;gap:12px;align-items:flex-start;cursor:pointer;min-height:44px;padding:10px 12px;border-radius:14px;background:var(--bg);font-weight:800}
.tick input{width:22px;height:22px;flex:none;accent-color:#16815A;margin:1px 0 0}
.tick:has(input:checked){background:#DDF3E6}
.checks{display:flex;flex-direction:column;gap:8px}
.hp-test{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:18px;padding:14px 16px}
.hp-test .tt{display:flex;gap:6px;flex-wrap:wrap}
.hp-test > b{font:900 17px/1.25 var(--font)}
.hp-score{display:flex;align-items:center;gap:10px;font-weight:800}
.hp-score b{font:900 26px/1 var(--display);color:#16815A}
.quiz-q{background:var(--bg);border:0}
.quiz-q.right{box-shadow:inset 0 0 0 2px #16815A}
.quiz-q.wrong{box-shadow:inset 0 0 0 2px #E2483D}
.quiz-q .opt span{background:var(--surface)}
.quiz-q .opt.is-right span{border-color:#16815A;background:#DDF3E6}
.quiz-ev{clear:both;margin-top:10px;font-weight:800;font-size:14px;color:var(--muted)}
.quiz-res{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.quiz-res b{font:900 24px/1 var(--display)}
.voc-count{font:900 14px/1 var(--font)}
.voc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.voc-card{display:flex;flex-direction:column;gap:6px}
.voc-flip{position:relative;border:0;cursor:pointer;min-height:96px;border-radius:18px;background:var(--forest);color:#fff;padding:12px;font:900 16px/1.2 var(--font);perspective:600px;box-shadow:0 4px 0 #0A2318;transition:transform .15s var(--ease)}
.voc-flip:hover{transform:translateY(-2px)}
.voc-front,.voc-back{display:grid;place-items:center;text-align:center;overflow-wrap:anywhere}
.voc-back{display:none;color:var(--ink)}
.voc-card.flipped .voc-flip{background:var(--acc-soft);box-shadow:0 4px 0 var(--sand)}
.voc-card.flipped .voc-front{display:none}
.voc-card.flipped .voc-back{display:grid}
.voc-card.flipped .voc-flip{animation:flip .3s var(--ease)}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.voc-know{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;min-height:40px;background:var(--bg);font:900 13px/1 var(--font);cursor:pointer;color:var(--muted)}
.voc-know span{display:contents}
.voc-know svg{width:16px;height:16px}
.voc-know[aria-pressed="true"]{background:#16815A;color:#fff}
.voc-card.known .voc-flip{box-shadow:0 4px 0 #16815A}
.essay textarea{min-height:300px}
.wc{align-items:center}
.wc-bar{flex:1;height:8px;border-radius:99px;background:var(--bg);overflow:hidden}
.wc-bar i{display:block;height:100%;background:var(--acc-deep);transition:width .2s}
.wc .ok{color:#16815A}
.prompt-box{background:var(--acc-soft)}
.rec{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bg);border-radius:18px;padding:14px}
.rec-start{min-height:56px}
.rec-dot{width:14px;height:14px;border-radius:50%;background:#E2483D;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3;transform:scale(.8)}}
.rec-time{font:900 20px/1 var(--display)}
.rec-audio{max-width:100%;flex:1;min-width:220px}
.rec-ok{font-weight:800}
.hw-answer{white-space:pre-wrap}
.hw-answer b{font-size:13px;color:var(--muted)}
.hwd-submit{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:18px;background:var(--ink);color:#fff;border-radius:24px;padding:12px 12px 12px 22px;box-shadow:0 18px 40px -16px rgba(15,42,31,.7);z-index:5}
.hwd-submit .in{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hwd-submit .submit-hint{font-weight:800}
.hwd-submit .btn-primary{background:var(--acc);color:var(--acc-ink);box-shadow:0 4px 0 var(--acc-deep)}
.hwd-submit .btn-primary[disabled]{background:rgba(255,255,255,.18);color:rgba(255,255,255,.7);opacity:1}
.hwd-submit .err{color:#FFB4A8;margin-top:8px}
@media (max-width:760px){.hwd-submit{bottom:calc(84px + env(safe-area-inset-bottom,0px))}.hwd-submit .btn{width:100%}.hwd-submit{padding:12px}}

/* memes and misc */
.meme{border:0;box-shadow:0 10px 0 var(--sand),0 24px 30px -22px rgba(15,42,31,.6)}
.meme-cap{font:900 14px/1.25 var(--display);text-transform:uppercase}
.meme-panel{background:var(--acc-soft)}
.meme-panel .mascot{max-width:160px}
.res-hero{background:var(--forest)}
.res-score{font-family:var(--display);font-weight:900;color:var(--acc)}
body[data-theme="violet"] .res-score,body[data-theme="pink"] .res-score{color:#fff}
.toast{background:var(--ink);font-weight:900;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-40px;font-style:normal;animation:fall 1.8s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.6}}
.test-card h2{font:900 19px/1.25 var(--font)}
.empty svg{width:96px;height:96px}

@media (max-width:420px){.sections{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.sec{padding:10px 8px}.sec span{font-size:9px;letter-spacing:.02em}.sec b{font-size:20px}.exam-top .target-pill{order:-1}}

.login-mascot.m3d{width:120px;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 10px 10px rgba(15,42,31,.25))}
.login-hero{grid-template-columns:120px minmax(0,1fr)}
.exam-badge{display:inline-flex;align-items:center;background:var(--acc);color:var(--acc-ink);border-radius:999px;padding:6px 12px;font:800 11px/1 var(--display);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;box-shadow:0 3px 0 var(--acc-deep)}
.other-cabs{display:flex;flex-direction:column;gap:8px;border-top:2px dashed var(--line);padding-top:14px}
.other-cabs div{display:flex;flex-wrap:wrap;gap:8px}
.other-cabs a{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border-radius:999px;background:var(--bg);font:900 14px/1 var(--font);text-decoration:none}
.other-cabs a:hover{background:var(--ink);color:#fff}
.logo-mark svg.logo-plane{width:48px;height:40px}
.logo small b{font:inherit;color:var(--ink)}
@media (max-width:420px){.login-hero{grid-template-columns:84px minmax(0,1fr)}.login-mascot.m3d{width:84px}}

.logo small{white-space:nowrap}
.recent{display:flex;flex-direction:column;gap:8px;border-top:2px dashed var(--line);padding-top:14px;margin-top:auto}
.recent-row{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--bg);border-radius:14px;padding:10px 14px;font-weight:800}
.recent-row i{width:10px;height:10px;border-radius:3px}
.recent-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* pay-hist-cards: таблицы на телефоне превращаются в карточки */
@media (max-width:620px){
  .table-wrap{border:0;background:transparent;overflow:visible}
  .table-wrap table{min-width:0;display:block}
  .table-wrap thead{display:none}
  .table-wrap tbody{display:flex;flex-direction:column;gap:8px}
  .table-wrap tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:0 10px 24px -20px rgba(21,62,45,.4)}
  .table-wrap td{border:0;padding:0;font-size:14px}
  .table-wrap[aria-label="История оплат"] td:nth-child(1){grid-column:1;color:var(--muted);font-weight:800;font-size:13px}
  .table-wrap[aria-label="История оплат"] td:nth-child(2){grid-column:1;font-weight:900;font-size:16px}
  .table-wrap[aria-label="История оплат"] td:nth-child(3){grid-column:2;grid-row:1/3;align-self:center;font:900 18px/1 var(--display)}
  .table-wrap[aria-label="История оплат"] td:nth-child(4){grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .table-wrap[aria-label="История оплат"] td:nth-child(5){grid-column:1/-1}
  .table-wrap[aria-label="Таблица попыток"] td:nth-child(1){grid-column:1;color:var(--muted);font-weight:800;font-size:13px}
  .table-wrap[aria-label="Таблица попыток"] td:nth-child(2){grid-column:1;font-weight:900;font-size:15px}
  .table-wrap[aria-label="Таблица попыток"] td:nth-child(3){grid-column:1;color:var(--muted);font-size:13px}
  .table-wrap[aria-label="Таблица попыток"] td:nth-child(4){grid-column:2;grid-row:1/4;align-self:center;font:900 24px/1 var(--display)}
  .table-wrap[aria-label="Таблица попыток"] td:nth-child(5),.table-wrap[aria-label="Таблица попыток"] td:nth-child(6){display:none}
  .table-wrap[aria-label="Таблица попыток"] td:nth-child(7){grid-column:1/-1}
  .table-wrap[aria-label="Таблица попыток"] td:nth-child(7):empty{display:none}
}

/* ===== стикеры v2: 3D-иконки и маскот-карточки ===== */
.cicon{display:inline-block;flex:none;line-height:0;width:22px;height:22px}
.cicon svg{width:100%;height:100%;overflow:visible}
.cicon.xs{width:22px;height:22px}
.chip-x .cicon{width:24px;height:24px;margin:-4px 2px -4px -4px}
.chip-x{gap:6px}
button.chip-x{cursor:pointer;border:0}
.samir-ava.xs{width:24px;height:24px;box-shadow:0 0 0 2px #fff;margin-left:-6px}
.plan-emo{background:rgba(255,255,255,.1)!important;width:44px;height:44px;border-radius:14px}
.plan-emo .cicon{width:34px;height:34px}
.plan-row{grid-template-columns:44px minmax(0,1fr) 22px}
.flight-plane{width:64px;transform:translate(-50%,-62%)}
.flight-plane .m3d{width:64px;animation:bob 3s ease-in-out infinite}
.flight-flag{transform:translate(-30%,-120%)}
.flight-flag .cicon{width:30px;height:30px}
.buddy-3d{position:relative;display:block;width:clamp(150px,15vw,190px)}
.buddy-3d .m3d{width:100%;animation:bob 3.4s ease-in-out infinite;filter:drop-shadow(0 14px 14px rgba(0,0,0,.22))}
.buddy-badge{position:absolute;right:-6px;top:-10px;width:48px;height:48px;animation:bob 2.6s ease-in-out infinite reverse}
.bubble{margin-bottom:64px}
.sticky-note{transform:none;border-radius:22px;box-shadow:0 14px 30px -18px rgba(0,0,0,.45);background:#FFF6CF}
.mcard{margin:0;background:var(--surface);border-radius:26px;padding:12px;display:flex;flex-direction:column;gap:12px;max-width:320px;width:100%;box-shadow:0 18px 40px -30px rgba(21,62,45,.5)}
.mcard.small{max-width:270px}
.mcard-art{position:relative;border-radius:20px;background:radial-gradient(120% 90% at 50% 70%,#fff 0,var(--acc-soft) 75%);aspect-ratio:16/10;display:grid;place-items:center;overflow:hidden}
.mcard.t-alt .mcard-art{background:radial-gradient(120% 90% at 50% 70%,#fff 0,#FFE9D6 75%)}
.mcard.t-lav .mcard-art{background:radial-gradient(120% 90% at 50% 70%,#fff 0,#ECE8FF 75%)}
.mcard-art .m3d{width:66%;animation:bob 3.4s ease-in-out infinite;filter:drop-shadow(0 10px 10px rgba(15,42,31,.18))}
.mcard-badge{position:absolute;right:12px;top:10px;width:44px;height:44px}
.mcard figcaption{padding:0 6px 6px;display:flex;flex-direction:column;gap:4px;text-align:left}
.mcard figcaption b{font:800 15px/1.25 var(--display)}
.mcard figcaption span{font-weight:700;color:var(--muted);font-size:14px;line-height:1.4}
.hp-type{display:inline-flex;align-items:center;gap:6px}
.hp-type .cicon{width:22px;height:22px}
.hp-chips li .cicon{width:20px;height:20px}
.hp-hint{display:flex;gap:8px;align-items:center}
.hp-hint .cicon{width:22px;height:22px}
.rec-start .cicon{width:26px;height:26px}
.avatar .ava-ic{width:72%;height:72%}
.avatar{overflow:hidden}

.pick-ava .pick span.cicon{width:36px;height:36px;padding:0;background:none;box-shadow:none;transform:none;display:inline-block}
.other-cabs a{gap:8px}
.other-cabs a .cicon{width:24px;height:24px}
.rc-chip .cicon{width:16px;height:16px}
.confetti i{position:absolute;top:-24px;display:block;animation:fall 1.8s cubic-bezier(.3,.6,.4,1) forwards}
.saved-acc{display:flex;flex-direction:column;gap:8px}
.saved-row{display:grid;grid-template-columns:44px minmax(0,1fr) 22px;gap:12px;align-items:center;border:0;background:var(--bg);border-radius:18px;padding:10px 14px 10px 10px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .15s var(--ease),box-shadow .15s}
.saved-row:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 2px var(--ink)}
.saved-row .avatar{width:44px;height:44px;border-radius:14px;box-shadow:none}
.saved-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.saved-txt b{font:900 16px/1.2 var(--font)}
.saved-txt small{font-weight:800;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved-go svg{width:20px;height:20px}
.acc-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn.subtle{color:var(--muted)}

/* пароли */
.pw-wrap{position:relative;display:flex}
.pw-wrap input{padding-right:96px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:var(--surface);border-radius:999px;min-height:36px;padding:0 12px;font:800 13px/1 var(--font);color:var(--muted);cursor:pointer}
.pw-eye:hover{color:var(--ink)}
.pw-hint{font-size:13px;color:var(--muted);font-weight:700}
.login-note{background:#FFF1D6;border-radius:14px;padding:10px 14px;font-weight:800;font-size:14px}
.unlock-who{display:flex;gap:14px;align-items:center;background:var(--bg);border-radius:20px;padding:12px}
.unlock-who b{display:block;font:900 18px/1.2 var(--font)}
.unlock-who small{font-weight:800;color:var(--muted)}
.unlock-who .avatar-lg{width:56px;height:56px;font-size:26px;border-radius:18px}
.login-links{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.login-links .link{min-height:40px}
.forgot{font-size:13px;font-weight:800;color:var(--muted)}
button.forgot{color:var(--muted);text-align:right;max-width:28ch}
.saved-lock{color:var(--muted)}
.saved-lock svg{width:18px;height:18px}

/* ===== запись на занятия + чек ===== */
.bk,.rc-wrap{--bk-ink:var(--ink,#153E2D);--bk-acc:var(--acc,#D5F36A);--bk-acc-ink:var(--acc-ink,#153E2D);--bk-acc-deep:var(--acc-deep,#A9C93F);--bk-acc-soft:var(--acc-soft,#F0FAD0);--bk-bg:var(--bg,#F5F3EF);--bk-line:#E6E1D8;--bk-muted:#5B6B62;--bk-disp:"Unbounded","Arial Black",system-ui,sans-serif}
.bk{display:flex;flex-direction:column;gap:16px;color:var(--bk-ink)}
.bk-card{background:#fff;border-radius:30px;padding:clamp(18px,2.4vw,28px);box-shadow:0 18px 40px -30px rgba(21,62,45,.35);min-width:0}
.bk h1{margin:4px 0 0;font:900 clamp(24px,3.2vw,38px)/1.05 var(--bk-disp);text-transform:uppercase}
.bk h2{margin:0 0 12px;font:800 clamp(17px,1.8vw,21px)/1.15 var(--bk-disp)}
.bk-eyebrow{font:800 11px/1.2 var(--bk-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--bk-muted)}
.bk-muted{color:var(--bk-muted)}
.bk-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;background:var(--bk-acc);color:var(--bk-acc-ink)}
.bk-head .bk-eyebrow,.bk-head .bk-muted{color:inherit;opacity:.85}
.bk-head p{margin:8px 0 0;max-width:60ch;font-weight:700}
.bk-live{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.8);color:var(--bk-ink);border-radius:999px;padding:9px 14px;font:900 13px/1 inherit;white-space:nowrap}
.bk-live.on{background:#fff}
.bk-live.on::first-letter{color:#16A34A}
.bk-live.err{background:#FFE1DA;color:#A33A12}
.bk-mylist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.bk-mylist li{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:12px;align-items:center;background:var(--bk-bg);border-radius:18px;padding:10px 12px 10px 16px}
.bk-mydate{display:flex;flex-direction:column;gap:2px;min-width:0}
.bk-mydate b{font:900 17px/1.2 inherit}
.bk-mydate span{font-weight:800;color:var(--bk-muted);font-size:14px}
.bk-tag{background:var(--bk-acc);color:var(--bk-acc-ink);border-radius:999px;padding:6px 10px;font:900 12px/1 inherit}
@media (max-width:520px){.bk-mylist li{grid-template-columns:40px minmax(0,1fr) auto}.bk-mylist li > :last-child{grid-column:2/-1;justify-self:start}}
.bk-warn{margin:10px 0 0;background:#FFF1D6;border-radius:14px;padding:10px 14px;font-weight:800;font-size:14px}
.bk-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.bk-grid{grid-template-columns:minmax(0,1fr)}}
.bk-cal-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.bk-cal-head .bk-muted{font-size:13px;font-weight:800}
.bk-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.bk-wd{font:900 11px/1 inherit;text-transform:uppercase;letter-spacing:.06em;color:var(--bk-muted);text-align:center;padding:4px 0}
.bk-day{position:relative;border:0;border-radius:14px;background:var(--bk-bg);min-height:64px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--bk-ink);font:inherit;transition:transform .12s,box-shadow .12s,background-color .12s}
.bk-day b{font:900 18px/1 var(--bk-disp)}
.bk-day small{font:800 10.5px/1.1 inherit;color:var(--bk-muted);text-align:center}
.bk-day i{font:900 9px/1 inherit;font-style:normal;text-transform:uppercase;color:var(--bk-muted);margin-bottom:-1px}
.bk-day.has{background:#fff;box-shadow:inset 0 0 0 2px var(--bk-line)}
.bk-day.has small{color:#16803F}
.bk-day.has:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 2px var(--bk-ink)}
.bk-day.mine{background:var(--bk-acc-soft)}
.bk-day.off{opacity:.38;cursor:default}
.bk-day[disabled]:not(.off){opacity:.2}
.bk-day.sel{background:var(--bk-ink);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.bk-day.sel small,.bk-day.sel i{color:#D9E7DD}
@media (max-width:420px){.bk-day{min-height:56px}.bk-day small{font-size:9px}.bk-day b{font-size:15px}}
.bk-tz{font-size:13px;font-weight:800;margin:-6px 0 10px}
.bk-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.bk-chip{border:0;border-radius:16px;min-height:62px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font:inherit;color:var(--bk-ink);transition:transform .12s,box-shadow .12s}
.bk-chip b{font:900 18px/1 var(--bk-disp)}
.bk-chip small{font:800 11px/1 inherit}
.bk-chip.free{background:#fff;box-shadow:inset 0 0 0 2px var(--bk-line),0 4px 0 var(--bk-line)}
.bk-chip.free small{color:#16803F}
.bk-chip.free:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 2px var(--bk-ink),0 5px 0 var(--bk-line)}
.bk-chip.free.sel{background:var(--bk-acc);color:var(--bk-acc-ink);box-shadow:inset 0 0 0 2px var(--bk-ink),0 4px 0 var(--bk-acc-deep)}
.bk-chip.free.sel small{color:inherit}
.bk-chip.taken{background:repeating-linear-gradient(-45deg,#F1EEE8 0 8px,#E8E4DC 8px 16px);color:#9AA59E;cursor:not-allowed}
.bk-chip.taken b{text-decoration:line-through}
.bk-chip.mine{background:var(--bk-ink);color:#fff;cursor:default}
.bk-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font:800 12px/1 inherit;color:var(--bk-muted)}
.bk-legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.bk-legend .free::before{background:#fff;box-shadow:inset 0 0 0 2px var(--bk-line)}
.bk-legend .taken::before{background:repeating-linear-gradient(-45deg,#F1EEE8 0 3px,#DDD8CE 3px 6px)}
.bk-legend .mine::before{background:var(--bk-ink)}
.bk-confirm{margin-top:16px;border-radius:20px;background:var(--bk-acc-soft);padding:16px;display:flex;flex-direction:column;gap:8px}
.bk-confirm > b{font:900 17px/1.25 var(--bk-disp)}
.bk-confirm textarea{width:100%;border:2px solid transparent;border-radius:14px;background:#fff;padding:10px 12px;font:700 15px/1.4 inherit;color:var(--bk-ink);resize:vertical}
.bk-confirm textarea:focus{outline:none;border-color:var(--bk-ink)}
.bk-lbl{font-weight:900;font-size:14px}
.bk-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border:0;border-radius:999px;background:var(--bk-ink);color:#fff;font:900 15px/1 inherit;cursor:pointer;box-shadow:0 4px 0 #0A2318;transition:transform .14s}
.bk-btn:hover{transform:translateY(-2px)}
.bk-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0A2318}
.bk-btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.bk-btn.ghost{background:#fff;color:var(--bk-ink);box-shadow:inset 0 0 0 2px var(--bk-line),0 3px 0 var(--bk-line)}
.bk-btn.sm{min-height:42px;padding:0 16px;font-size:14px}
.bk-go{align-self:flex-start;background:var(--bk-acc);color:var(--bk-acc-ink);box-shadow:0 4px 0 var(--bk-acc-deep);min-height:54px;padding:0 30px;font-size:16px}
.bk-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;opacity:0}
.rc-wrap{display:flex;flex-direction:column;gap:6px}
.rc{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;border:2px dashed #CFC8BB;border-radius:18px;background:#fff;padding:10px 12px;cursor:pointer;transition:border-color .15s,background-color .15s}
.rc:hover,.rc.over{border-color:var(--bk-ink);background:var(--bk-acc-soft)}
.rc.ok{border-style:solid;border-color:#16803F;background:#EAF7EF}
.rc-prev{width:56px;height:56px;border-radius:12px;background:var(--bk-bg) center/cover no-repeat;display:grid;place-items:center;font-size:26px}
.rc-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.rc-txt b{font:900 15px/1.2 inherit}
.rc-name{font:700 13px/1.3 inherit;color:var(--bk-muted);overflow-wrap:anywhere}
.rc-wrap input:focus-visible + .rc{outline:3px solid #E88135;outline-offset:2px}
.bk-link{background:none;border:0;padding:4px 0;font:800 14px/1.2 inherit;color:var(--bk-ink);text-decoration:underline;cursor:pointer;align-self:flex-start}
.bk-err{color:#A33A12;font-weight:800;font-size:14px;margin:0}
.rc-chip{display:inline-flex;align-items:center;gap:4px;background:#EAF7EF;color:#16803F;border-radius:999px;padding:4px 9px;font:900 12px/1 inherit;text-decoration:none}

.bk-parts{display:flex;flex-direction:column;gap:14px}
.bk-part-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font:900 14px/1 inherit}
.bk-part-h small{font:800 12px/1 inherit;color:var(--bk-muted)}
.bk-chips{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
.bk-conf-top{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center}
.bk-conf-top b{display:block;font:900 17px/1.25 var(--bk-disp)}
.bk-conf-top .bk-muted{font-size:14px;font-weight:700}
.samir-ava{display:inline-block;width:52px;height:52px;border-radius:50%;background:#DDE5E0 var(--samir,none) center/cover no-repeat;box-shadow:0 0 0 3px #fff,0 4px 10px -4px rgba(0,0,0,.35);flex:none}
.samir-ava.sm{width:30px;height:30px;box-shadow:0 0 0 2px #fff}

.bk-day .l-short{display:none}
@media (max-width:560px){.bk-day .l-long{display:none}.bk-day .l-short{display:block;font-size:10.5px}.bk-day{min-height:54px;border-radius:12px}.bk-days{gap:5px}}
.bk-day.off b{opacity:.6}
.rc-chip{white-space:nowrap}

.bk-myic .cicon{width:40px;height:40px}
.bk-part-h span{display:inline-flex;align-items:center;gap:8px}
.bk-part-h .cicon{width:26px;height:26px}
.rc-prev .cicon{width:40px;height:40px}
.cicon{display:inline-block;flex:none;line-height:0}
.cicon svg{width:100%;height:100%;overflow:visible}
/* ===== Mr.Sam Stories ===== */
.ms-row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:6px 4px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ms-row::-webkit-scrollbar{display:none}
.ms-item{flex:none;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:7px;width:86px;background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit}
.ms-ring{position:relative;width:78px;height:78px;border-radius:50%;padding:3px;background:conic-gradient(from 210deg,#D5F36A,#FFD84D,#FF6FB5,#8C7BFF,#D5F36A);transition:transform .2s cubic-bezier(.2,.7,.2,1)}
.ms-item:hover .ms-ring{transform:scale(1.06) rotate(-3deg)}
.ms-item:active .ms-ring{transform:scale(.95)}
.ms-item.seen .ms-ring{background:rgba(127,140,133,.45)}
.ms-in{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;border:3px solid var(--ms-gap,#F5F3EF);line-height:1;gap:2px;overflow:hidden}
.ms-in b{font:900 20px/1 "Unbounded","Arial Black",system-ui,sans-serif;letter-spacing:-.02em;color:#10291E;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-in small{font:900 8.5px/1 "Unbounded",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em;color:rgba(16,41,30,.7)}
.t-violet .ms-in,.ms-ava.t-violet{background:linear-gradient(150deg,#C9C0FF,#8C7BFF)}
.t-pink .ms-in,.ms-ava.t-pink{background:linear-gradient(150deg,#FFC2E0,#FF6FB5)}
.t-yellow .ms-in,.ms-ava.t-yellow{background:linear-gradient(150deg,#FFF0A8,#FFD84D)}
.t-lime .ms-in,.ms-ava.t-lime{background:linear-gradient(150deg,#F0FCC0,#D5F36A)}
.t-mint .ms-in,.ms-ava.t-mint{background:linear-gradient(150deg,#D4F6E8,#7FD8B6)}
.ms-new{position:absolute;right:-4px;bottom:2px;background:#FF5A6E;color:#fff;font:900 9px/1 "Unbounded",system-ui,sans-serif;text-transform:uppercase;padding:4px 6px;border-radius:999px;border:2px solid var(--ms-gap,#F5F3EF)}
.ms-name{font-weight:800;font-size:13px;line-height:1.15;text-align:center;max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.ms-lock,.ms-lock body{overflow:hidden}
.ms-ov{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:rgba(8,20,14,.78);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);opacity:0;transition:opacity .2s}
.ms-ov.in{opacity:1}
.ms-card{position:relative;width:min(420px,100vw);height:min(760px,100dvh);border-radius:30px;overflow:hidden;background:#10291E;color:#fff;touch-action:pan-y;user-select:none;-webkit-user-select:none;transform:scale(.94);transition:transform .25s cubic-bezier(.2,.7,.2,1);box-shadow:0 40px 90px -30px rgba(0,0,0,.7)}
.ms-ov.in .ms-card{transform:none}
@media (max-width:480px){.ms-card{border-radius:0;width:100vw;height:100dvh}}
.ms-bars{position:absolute;top:12px;left:12px;right:12px;z-index:5;display:flex;gap:4px}
.ms-bars span{flex:1;height:3.5px;border-radius:3px;background:rgba(255,255,255,.32);overflow:hidden}
.ms-bars i{display:block;height:100%;width:0;background:#fff;border-radius:3px}
.ms-top{position:absolute;top:24px;left:14px;right:8px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ms-who{display:flex;align-items:center;gap:10px;min-width:0}
.ms-who b{display:block;font:900 15px/1.1 "Unbounded",system-ui,sans-serif}
.ms-who small{display:block;font-weight:800;font-size:12.5px;opacity:.85}
.ms-ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:900 16px/1 "Unbounded",system-ui,sans-serif;color:#10291E;border:2px solid rgba(255,255,255,.8);flex:none}
.ms-x{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ms-x:focus-visible,.ms-nav:focus-visible,.ms-cta:focus-visible{outline:3px solid #D5F36A;outline-offset:2px}
.ms-nav{position:absolute;top:90px;bottom:90px;z-index:3;width:32%;background:transparent;border:0;cursor:pointer}
.ms-nav.prev{left:0}.ms-nav.next{right:0;width:68%}
.ms-stage{position:absolute;inset:0}
.ms-slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:96px 26px 104px;overflow:hidden;animation:msIn .35s cubic-bezier(.2,.7,.2,1)}
@keyframes msIn{from{opacity:0;transform:translateX(18px) scale(.985)}to{opacity:1;transform:none}}
.ms-slide.t-violet{background:linear-gradient(165deg,#6E5BF0 0%,#8C7BFF 45%,#C7A6FF 100%)}
.ms-slide.t-pink{background:linear-gradient(165deg,#E2408F 0%,#FF6FB5 48%,#FFB0A8 100%)}
.ms-slide.t-yellow{background:linear-gradient(165deg,#F2A93B 0%,#FFD84D 55%,#F6F08A 100%);color:#10291E}
.ms-slide.t-lime{background:linear-gradient(165deg,#153E2D 0%,#2F6B3D 50%,#9CC23A 100%)}

.gm-ov{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;background:#0B1A2A}

.gm-frame{flex:1;width:100%;border:0;background:#0B1A2A}
.gm-info{margin-left:auto;padding:6px 10px;border-radius:999px;background:rgba(213,243,106,.16);color:#D5F36A;font:900 11px/1.2 "Unbounded",system-ui,sans-serif;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}

/* ===== Mr.Sam · ачивки с иллюстрациями ===== */

.ach-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.ach-count{padding:7px 13px;border-radius:999px;background:#D5F36A;font:900 13px/1 "Unbounded","Arial Black",system-ui,sans-serif;color:#153E2D}
.ach-more{margin-left:auto;border:0;background:none;padding:6px 2px;font:900 14px/1.2 "Unbounded","Arial Black",system-ui,sans-serif;color:#153E2D;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px;cursor:pointer}
.ach-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media (max-width:1100px){.ach-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:760px){.ach-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:540px){.ach-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.ach{position:relative;display:flex;flex-direction:column;gap:6px;padding:8px 12px 14px;border-radius:24px;text-align:center;
  background:radial-gradient(120% 90% at 20% 0,#FFFFFF 0,#F7FBEF 45%,#EEF7DA 100%);box-shadow:inset 0 1px 0 #fff,0 16px 30px -24px rgba(21,62,45,.55);transition:transform .2s cubic-bezier(.2,.7,.2,1)}
.ach.on:hover{transform:translateY(-3px)}
.ach-art{position:relative;aspect-ratio:340/176;margin:0 -8px;background:url("ach.webp") calc(var(--k) * 100% / 11) 0/1200% 100% no-repeat}
.ach-t{font:900 14.5px/1.2 "Nunito",system-ui,sans-serif;color:#153E2D}
.ach-d{min-height:2.5em;font:700 12.5px/1.25 "Nunito",system-ui,sans-serif;color:#5B6B62}
.ach-foot{display:flex;align-items:center;gap:8px;margin-top:auto}
.ach-bar{flex:1;height:10px;border-radius:99px;background:#E2E8D6;overflow:hidden}
.ach-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#9ED62C,#C9EE4F);box-shadow:inset 0 -2px 0 rgba(0,0,0,.06)}
.ach-st{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#2FA34A;color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.ach-st svg{width:16px;height:16px}
.ach-n{flex:none;font:900 11.5px/1 "Nunito",system-ui,sans-serif;color:#8A938E;white-space:nowrap}
.ach:not(.on){background:radial-gradient(120% 90% at 20% 0,#FAFAF9 0,#F1F1EF 60%,#ECECEA 100%)}
.ach:not(.on) .ach-art{filter:grayscale(1) contrast(.85) brightness(1.06);opacity:.7}
.ach:not(.on) .ach-t{color:#8C948F}
.ach:not(.on) .ach-bar i{background:#B9C4AE}
.ach:not(.on) .ach-st{background:#E4E6E2;color:#98A09B;box-shadow:none}
.ach-lock{position:absolute;right:18%;bottom:6%;width:22%;max-width:46px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:#fff;color:#8E948F;box-shadow:0 6px 14px -6px rgba(0,0,0,.3)}
.ach-lock svg{width:52%;height:52%}
@media (prefers-reduced-motion:reduce){.ach{transition:none}}

.ny-cap::before{border-top-left-radius:inherit;border-top-right-radius:inherit}
@media (max-width:900px){.ny .ny-toggle{bottom:90px}}
