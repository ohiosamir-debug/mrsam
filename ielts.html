/* Mr.Sam: переключатель курсов в шапке кабинета */
.dsw{position:relative;display:inline-flex;flex:0 1 auto;min-width:0}
.dsw-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;max-width:100%;padding:3px 12px 3px 3px;border:0;border-radius:999px;background:#FFFFFF;color:#153E2D;box-shadow:inset 0 0 0 2px #E1DCD1;font-family:inherit;font-weight:900;font-size:14px;line-height:1.1;cursor:pointer;white-space:nowrap}
.dsw-btn:hover{box-shadow:inset 0 0 0 2px #153E2D}
.dsw-btn:focus-visible{outline:3px solid #8C7BFF;outline-offset:2px}
.dsw-static{cursor:default}.dsw-static:hover{box-shadow:inset 0 0 0 2px #E1DCD1}
.dsw-name{overflow:hidden;text-overflow:ellipsis;min-width:0}
.dsw-chev{width:16px;height:16px;flex:none;transition:transform .15s}
.dsw-btn[aria-expanded="true"] .dsw-chev{transform:rotate(180deg)}
.dsw.on-dark .dsw-btn{background:rgba(255,255,255,.1);color:inherit;box-shadow:none}
.dsw.on-dark .dsw-btn:hover,.dsw.on-dark .dsw-btn[aria-expanded="true"]{background:rgba(255,255,255,.2)}
.dsw.on-dark .dsw-static:hover{background:rgba(255,255,255,.1)}
.dsw-tile{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.dsw-tile .cicon,.dsw-tile svg{width:28px;height:28px;display:block}
.dsw-tile.t-lime{background:#E9F8B4}.dsw-tile.t-mint{background:#CFF0E2}.dsw-tile.t-yellow{background:#FFEFAE}.dsw-tile.t-violet{background:#E2DDFF}.dsw-tile.t-pink{background:#FFD9EB}
.dsw-menu{position:absolute;z-index:60;top:calc(100% + 8px);left:0;width:300px;max-width:calc(100vw - 24px);background:#FFFFFF;color:#153E2D;border-radius:22px;padding:10px;box-shadow:0 18px 40px -12px rgba(15,42,31,.45),0 0 0 1px rgba(21,62,45,.08);display:flex;flex-direction:column;gap:4px}
.dsw-menu[hidden]{display:none}
.dsw-cap{font-family:inherit;font-weight:900;font-size:11px;line-height:1;text-transform:uppercase;letter-spacing:.08em;color:#5B6B62;padding:6px 10px 4px}
.dsw-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:16px;text-decoration:none;color:inherit;min-height:52px}
.dsw-item:hover,.dsw-item:focus-visible{background:#F3F1EA;outline:none}
.dsw-item:focus-visible{box-shadow:inset 0 0 0 2px #8C7BFF}
.dsw-item.on{background:#153E2D;color:#F2F7EF}
.dsw-item.on small{color:#D5F36A}
.dsw-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.dsw-txt b{font-weight:900;font-size:15px;line-height:1.15}
.dsw-txt small{font-weight:700;font-size:12.5px;line-height:1.25;color:#5B6B62}
.dsw-all{display:flex;align-items:center;justify-content:center;min-height:44px;margin-top:4px;border-radius:14px;font-weight:900;font-size:13.5px;color:#153E2D;text-decoration:none;box-shadow:inset 0 0 0 2px #E6E1D8}
.dsw-all:hover{box-shadow:inset 0 0 0 2px #153E2D}
@media (max-width:560px){.dsw-btn{padding-right:8px;gap:6px}.dsw-tile{width:34px;height:34px}.dsw-tile .cicon,.dsw-tile svg{width:24px;height:24px}.dsw-name{max-width:96px}}
@media (max-width:380px){.dsw-name{display:none}.dsw-btn{padding-right:6px}}
@media (prefers-reduced-motion:reduce){.dsw-chev{transition:none}}
/* экран «курс не открыт» */
.noacc{max-width:620px;margin:32px auto;display:flex;flex-direction:column;gap:14px}
.noacc-list{display:grid;gap:8px}
.noacc-list a{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:18px;text-decoration:none;color:#153E2D;background:#FFFFFF;box-shadow:inset 0 0 0 2px #E6E1D8;min-height:60px}
.noacc-list a:hover{box-shadow:inset 0 0 0 2px #153E2D}
.noacc-list b{font-weight:900}
.noacc-list small{display:block;font-weight:700;font-size:13px;color:#5B6B62}

/* с переключателем курсов: название курса в переключателе, вкладки компактные, чтобы всё помещалось в одну строку */
.has-dsw .brandbox .logo small{display:none}
.has-dsw .brandbox .dsw{flex:none}
.has-dsw .brandbox .dsw-name{max-width:170px}
/* вкладки без значков на компьютере: с логотипом, курсом и именем ученика всё помещается в одну строку и ничего не наезжает */
@media (min-width:1041px){.nav button{padding:0 14px;font-size:14.5px}.nav button svg{display:none}}
@media (min-width:1041px){.has-dsw .nav button{padding:0 10px;font-size:14px}}
@media (max-width:1240px){.has-dsw .logo > span:last-child{display:none}}
/* между телефоном и ноутбуком верхние вкладки не помещаются (наезжали на логотип): нижняя панель, как на телефоне */
@media (max-width:1040px){
  .topbar .nav{display:none}
  .user-name{display:none}
  .user-chip{padding:4px}
  body.in-app{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .bottom-nav{display:flex}
  .bottom-nav[hidden],body.running .bottom-nav{display:none}
  body.in-app .toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .hwd-submit{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .ny .ny-toggle{bottom:90px}
}
.brandbox{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto}
.topbar .dsw-slot{display:flex;align-items:center;min-width:0}
/* длинное имя ученика или название кабинета сжимаются, а не наезжают на вкладки */
.brandbox .logo{min-width:0}
.brandbox .logo > span:last-child{min-width:0;overflow:hidden}
.brandbox .logo small{display:block;overflow:hidden;text-overflow:ellipsis}
.topbar .nav{flex:none}
.user-chip .user-name{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hub-note{margin-top:14px;font-size:14px}
.other-cabs a.oc-lime .cicon,.other-cabs a.oc-mint .cicon,.other-cabs a.oc-yellow .cicon,.other-cabs a.oc-violet .cicon,.other-cabs a.oc-pink .cicon{width:24px;height:24px}

/* v11: разбор прямо на тесте */
.rv-test{display:flex;flex-direction:column;gap:14px;scroll-margin-top:96px}
.rv-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap}
.rv-head h2{font-size:clamp(22px,2.6vw,30px)}
.rv-head p{max-width:64ch;margin-top:4px}
.rv-filter{flex:none}
.rv-legend{display:flex;gap:16px;flex-wrap:wrap;font:800 13px/1 var(--font);color:var(--muted)}
.rv-legend .lg::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.rv-legend .ok::before{background:#DDF3E6;box-shadow:inset 0 0 0 2px var(--ok)}
.rv-legend .bad::before{background:#FDE3D6;box-shadow:inset 0 0 0 2px var(--error)}
.rv-legend .mk::before{background:#FFE98A}
.rv-grid{align-items:start}

.rv-qs{display:flex;flex-direction:column;gap:18px;min-width:0}
.rv-part{display:flex;flex-direction:column;gap:10px}
.rvq{display:flex;flex-direction:column;gap:10px;scroll-margin-top:110px;border-left:5px solid var(--line)}
.rvq.ok{border-left-color:var(--ok)}
.rvq.bad{border-left-color:var(--error);background:#FFFBF8}
.rvq-h{display:flex;gap:10px;align-items:flex-start;font-weight:900;line-height:1.45}
.rvq-t{flex:1;min-width:0;padding-top:4px}
.rv-badge{flex:none;font:900 12px/1 var(--font);border-radius:999px;padding:7px 10px;white-space:nowrap}
.rv-badge.ok{background:#DDF3E6;color:var(--ok)}
.rv-badge.bad{background:#FDE3D6;color:var(--error)}
.rv-opts{display:grid;gap:6px;grid-template-columns:minmax(0,1fr)}

.rv-opt{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:800;font-size:15px;line-height:1.35}
.rv-opt small{margin-left:auto;font:800 12px/1.1 var(--font);color:var(--muted);white-space:nowrap}
.rv-dot{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:1000 12px/1 var(--font);background:var(--surface);box-shadow:inset 0 0 0 2px var(--line)}
.rv-opt.is-right{border-color:var(--ok);background:#DDF3E6}

.rv-opt.is-right small{color:var(--ok)}
.rv-opt.is-wrong{border-color:var(--error);background:#FDE3D6}

.rv-opt.is-wrong small{color:var(--error)}
.rv-fill{display:inline-block;padding:0 8px;border-radius:8px;margin:0 3px;font-weight:1000}

.rv-fill.bad{background:#FDE3D6;color:var(--error);text-decoration:line-through;text-decoration-thickness:2px}
.rv-fill.none{background:var(--bg);color:var(--muted);text-decoration:none;font-weight:800}
.rv-right{font-weight:800}.rv-right b{color:var(--ok)}
.rv-built b{font-weight:1000}.rv-built.ok b{color:var(--ok)}.rv-built.bad b{color:var(--error)}

.rv-ev.ok{background:var(--mint)}
.rv-ev summary{cursor:pointer;font-weight:900}
.rv-ev-h{display:block;font-weight:1000;margin-bottom:2px}
.rv-jump{display:inline-block;margin-top:6px;font-weight:900}
.evm{background:#FFE98A;border-radius:5px;padding:1px 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone;cursor:pointer;color:inherit}

.rv-ctest{line-height:2.5}

.rvq-w.ok{background:#DDF3E6}.rvq-w.ok b{color:var(--ok)}
.rvq-w.bad{background:#FDE3D6}.rvq-w.bad b{color:var(--error);text-decoration:line-through}

.rv-test.only-bad .rvq.ok{display:none}

.rv-top-in{display:flex;gap:18px;align-items:center;flex-wrap:wrap}

.rv-sc small{font:800 11px/1.2 var(--font);color:var(--on-forest-muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px;text-align:center}

<script>/* Фото заданий и HTML-тесты в домашке.

window.MrSamHwMedia = (() => {
  const el = (tag, attrs, ...kids) => {

  };

@media (max-width:560px){.hm-grid:not(.big){grid-template-columns:repeat(2,minmax(0,1fr))}.hm-ov .hm-bar{gap:6px;padding:8px 10px}.hm-ov .hm-bar b{flex-basis:100%;font-size:13px}.hm-btn{min-height:40px;padding:0 12px;font-size:13px}.hm-res{padding:6px 10px;font-size:12.5px}.hm-lb .hm-bar b{font-size:13px}}
`;
  let styled = false;
  const style = () => { if (styled) return; styled = true; document.head.append(el("style", {}, CSS)); };

  /* загрузка файла задания с сервера: только своё задание, только свой курс */
  const cache = {};
  async function fetchFile(o) {
    const k = o.hwId + ":" + o.fileId;
    if (cache[k]) return cache[k];
    const r = await fetch(o.api, { method: "POST", body: new URLSearchParams({ action: o.admin ? "admin_hw_file_get" : "hw_file", token: o.token || "", exam: o.exam || "", hwId: o.hwId || "", fileId: o.fileId }) });

    if (j && j.error === "auth") { if (o.onAuth) o.onAuth(); throw new Error("auth"); }

    return (cache[k] = j.html != null ? { html: j.html } : { url: "data:" + j.type + ";base64," + j.data });
  }

  /* ---------- фото: сетка миниатюр и просмотр на весь экран ---------- */
  function photos(o) {
    style();
    const files = o.files || [], urls = [];
    const grid = el("div", { class: "hm-grid" + (files.length <= 2 ? " big" : ""), role: "list" });   // одно-два фото показываем крупно, целиком
    files.forEach((f, i) => {
      const b = el("button", { type: "button", class: "hm-th wait", role: "listitem", "aria-label": "Фото задания " + (i + 1) + " из " + files.length + ": открыть крупно" });
      grid.append(b);
      Promise.resolve(o.load(f)).then(r => {
        urls[i] = r.url; b.classList.remove("wait");
        b.append(el("img", { src: r.url, alt: "Фото задания " + (i + 1), loading: "lazy" }), el("span", { class: "hm-n" }, (i + 1) + "/" + files.length), el("span", { class: "hm-z", html: IC.zoom }));
        b.addEventListener("click", () => lightbox(urls, i, o.title || "Фото задания", b));
      }).catch(() => { b.classList.remove("wait"); b.classList.add("err"); b.disabled = true; b.textContent = "Фото не загрузилось. Обнови страницу"; });
    });
    return grid;
  }
  function lightbox(urls, start, title, back) {
    style();
    let i = start, z = 1;
    const ZS = [1, 1.6, 2.4, 3.4];
    const img = el("img", { alt: "" });
    const stage = el("div", { class: "hm-stage" }, img);
    const cnt = el("b"), num = el("span", { class: "hm-cnt", hidden: urls.length < 2 });
    const zin = el("button", { type: "button", class: "hm-ib", "aria-label": "Крупнее", html: IC.plus });
    const zout = el("button", { type: "button", class: "hm-ib", "aria-label": "Мельче", html: IC.minus });
    const close = el("button", { type: "button", class: "hm-ib", "aria-label": "Закрыть", html: IC.x });
    const prev = el("button", { type: "button", class: "hm-ib hm-nav prev", "aria-label": "Предыдущее фото", html: IC.left });
    const next = el("button", { type: "button", class: "hm-ib hm-nav next", "aria-label": "Следующее фото", html: IC.right });
    const box = el("div", { class: "hm-lb", role: "dialog", "aria-modal": "true", "aria-label": title }, el("div", { class: "hm-bar" }, cnt, num, zout, zin, close), stage, urls.length > 1 ? [prev, next] : null);

      z = Math.max(0, Math.min(ZS.length - 1, nz));
      stage.classList.toggle("zoomed", z > 0);
      img.style.width = z > 0 ? Math.round(stage.clientWidth * ZS[z] - 16) + "px" : "";
      zout.disabled = z === 0; zin.disabled = z === ZS.length - 1;
    };
    const show = () => { img.src = urls[i] || ""; img.alt = title + ", фото " + (i + 1); cnt.textContent = title; num.textContent = (i + 1) + " из " + urls.length; setZ(0); prev.disabled = i === 0; next.disabled = i === urls.length - 1; };
    const done = () => { box.remove(); document.removeEventListener("keydown", key); document.documentElement.style.overflow = ""; if (back && back.focus) back.focus(); };
    const key = e => { if (e.key === "Escape") done(); else if (e.key === "ArrowLeft" && i > 0) { i--; show(); } else if (e.key === "ArrowRight" && i < urls.length - 1) { i++; show(); } else if (e.key === "+" || e.key === "=") setZ(z + 1); else if (e.key === "-") setZ(z - 1); };
    zin.onclick = () => setZ(z + 1); zout.onclick = () => setZ(z - 1); close.onclick = done;
    prev.onclick = () => { if (i > 0) { i--; show(); } }; next.onclick = () => { if (i < urls.length - 1) { i++; show(); } };
    img.addEventListener("click", () => setZ(z > 0 ? 0 : 2));

    document.body.append(box); show(); close.focus();
  }

  /* ---------- HTML-тест в изолированном окне ---------- */
  // скрипт внутри теста: по запросу кабинета собирает ответы ученика и текст с баллом, если тест его показывает.
  // Свой тест может сам сообщить балл: parent.postMessage({ mrsam: "result", score: 8, max: 10 }, "*")
  const COLLECT = `<script>(function(){
var sp=function(t){return String(t||"").replace(/\\s+/g," ").trim()};
function esc(v){return window.CSS&&CSS.escape?CSS.escape(v):String(v).replace(/"/g,'\\\\"')}

if(!t){var l2=el.closest("label");if(l2)t=l2.innerText}
if(!t)t=el.getAttribute("aria-label")||el.getAttribute("placeholder")||"";
if(!t){var p=el.closest("li,p,td,tr,fieldset,section,div");if(p)t=p.innerText}
return sp(t||el.name).slice(0,160)}
function qbox(el){var n=el.parentElement;while(n&&n!==document.body){if(n.querySelectorAll('input[type=radio][name="'+esc(el.name)+'"]').length>1)return n;n=n.parentElement}return null}
function qtext(b){if(!b)return"";var h=b.querySelector("legend,h1,h2,h3,h4,h5,.question-text,.q-text,.qtext,p,strong,b");var t=h?h.innerText:"";if(!t){var c=b.cloneNode(true);c.querySelectorAll("label,input").forEach(function(x){x.remove()});t=c.innerText}return sp(t).slice(0,160)}
function collect(){var out=[],seen={};
document.querySelectorAll("input,select,textarea").forEach(function(el){var ty=(el.type||"").toLowerCase();
if(/^(hidden|button|submit|reset|file|image|range|color)$/.test(ty))return;
if(ty==="radio"){if(!el.checked)return;var k="r:"+el.name;if(seen[k])return;seen[k]=1;out.push({q:qtext(qbox(el))||el.name,a:lbl(el)});return}

var v=el.tagName==="SELECT"?(el.options[el.selectedIndex]?el.options[el.selectedIndex].text:""):el.value;
if(sp(v))out.push({q:lbl(el),a:sp(v).slice(0,500)})});
var sc="",c=document.querySelectorAll('[id*="score" i],[class*="score" i],[id*="result" i],[class*="result" i],[id*="total" i],[class*="total" i]');
for(var i=0;i<c.length&&!sc;i++){var tx=sp(c[i].innerText);if(/\\d/.test(tx)&&tx.length<200&&c[i].getClientRects().length)sc=tx}
return{answers:out.slice(0,80),scoreText:sc}}
addEventListener("message",function(e){if(e.data&&e.data.mrsam==="collect")parent.postMessage(Object.assign({mrsam:"answers"},collect()),"*")});
})();<\/script>`;
  const withCollector = html => /<\/body>/i.test(html) ? html.replace(/<\/body>(?![\s\S]*<\/body>)/i, COLLECT + "</body>") : html + COLLECT;

  function openHtml(o) {
    style();
    let result = null, finished = false;
    const res = el("span", { class: "hm-res", hidden: true });
    const doneBtn = o.preview ? null : el("button", { type: "button", class: "hm-btn" }, "Готово, сдать");
    const close = el("button", { type: "button", class: "hm-btn ghost" }, o.preview ? "Закрыть" : "Выйти");
    const loading = el("div", { class: "hm-load" }, "Открываем тест…");
    const box = el("div", { class: "hm-ov", role: "dialog", "aria-modal": "true", "aria-label": o.title || "Тест" }, el("div", { class: "hm-bar" }, el("b", {}, o.title || "Тест"), res, doneBtn, close), loading);
    let frame = null;
    const onMsg = e => {
      if (!frame || e.source !== frame.contentWindow || !e.data || typeof e.data !== "object") return;
      if (e.data.mrsam === "result") {
        const sc = Number(e.data.score), mx = Number(e.data.max);
        if (isFinite(sc)) { result = { score: sc, max: isFinite(mx) ? mx : null }; res.hidden = false; res.textContent = "Результат: " + sc + (result.max ? " из " + result.max : ""); }
      }
    };
    const end = () => { window.removeEventListener("message", onMsg); document.removeEventListener("keydown", key); document.documentElement.style.overflow = ""; box.remove(); if (o.back && o.back.focus) o.back.focus(); };
    const collect = () => new Promise(res2 => {
      if (!frame) return res2({ answers: [], scoreText: "" });
      let got = false;
      const h2 = e => { if (e.source === frame.contentWindow && e.data && e.data.mrsam === "answers") { got = true; window.removeEventListener("message", h2); res2({ answers: e.data.answers || [], scoreText: e.data.scoreText || "" }); } };
      window.addEventListener("message", h2);
      try { frame.contentWindow.postMessage({ mrsam: "collect" }, "*"); } catch (_) {}
      setTimeout(() => { if (!got) { window.removeEventListener("message", h2); res2({ answers: [], scoreText: "" }); } }, 1500);
    });
    const finish = async () => {
      if (finished) return; finished = true;
      if (doneBtn) { doneBtn.disabled = true; doneBtn.textContent = "Сохраняем…"; }

    };

    const leave = () => { if (!o.preview && result && !finished) return finish(); end(); };   // тест сам прислал балл: выход = сдача
    close.onclick = leave;

    window.addEventListener("message", onMsg);
    document.addEventListener("keydown", key);
    document.documentElement.style.overflow = "hidden";
    document.body.append(box); close.focus();
    Promise.resolve(o.load()).then(r => {
      frame = el("iframe", { title: o.title || "Тест", sandbox: "allow-scripts allow-forms allow-modals", referrerpolicy: "no-referrer" });
      frame.srcdoc = withCollector(String(r.html || ""));
      loading.replaceWith(frame);
    }).catch(() => { loading.textContent = "Тест не загрузился. Проверь интернет и открой ещё раз."; if (doneBtn) doneBtn.disabled = true; });
  }

  /* кнопка «Открыть тест» и состояние в шаге задания */
  function htmlTest(o) {
    style();
    const v = o.value || {};
    const st = el("span", { class: "hm-state" + (v.done ? " ok" : "") }, v.done ? "✓ Пройден" + (v.result && v.result.score != null ? ": " + v.result.score + (v.result.max ? " из " + v.result.max : "") : v.scoreText ? ": " + v.scoreText : "") : "Ещё не пройден");

    b.addEventListener("click", () => openHtml({ title: o.title, load: o.load, back: b, onDone: o.onDone }));
    return el("div", { class: "hm-open" }, b, st);
  }

  return { photos, lightbox, htmlTest, openHtml, fetchFile, withCollector };
})();

<script>/* ===== Mr.Sam: направления ученика. Один вход на все кабинеты и переключатель курсов.
   Кабинеты курсов лежат на отдельных страницах, но у ученика одна сессия: вошёл один раз и переходит между своими курсами без пароля.
   Сессия хранит только токен входа и список выданных курсов, пароль здесь не хранится. Список курсов присылает сервер. ===== */
window.MrSamDirs = (function () {
  "use strict";
  const LIST = [
    { id: "math", name: "Математика", short: "Математика", href: "math.html", icon: "ruler", tone: "lime", about: "План по темам, задания с подсказками, игры" },
    { id: "english", name: "Английский язык", short: "Английский", href: "english.html", icon: "chat", tone: "mint", about: "Грамматика, слова, чтение и домашка" },
    { id: "mathen", name: "Математика на английском", short: "Math in English", href: "mathen.html", icon: "calc", tone: "yellow", about: "Задачи на английском, словарик терминов, свой план" },
    { id: "ielts", name: "IELTS", short: "IELTS", href: "ielts.html", icon: "cap", tone: "violet", about: "Reading, Listening, Writing в формате IELTS" },
    { id: "toefl", name: "TOEFL", short: "TOEFL", href: "toefl.html", icon: "globe", tone: "pink", about: "Задания нового формата TOEFL и шкала 1–6" }
  ];
  const BY = {}; LIST.forEach(d => { BY[d.id] = d; });
  const HUB = "cabinet.html", KEY = "mrsam.session.v1";
  /** хранилища кабинетов: при выходе убираем токен этого ученика везде */
  const STORES = ["mrsam.math.v1", "mrsam.mathen.v1", "mrsam.english.v1", "mrsam.ielts.v1", "mrsam.toefl.v1"];
  const clean = arr => LIST.map(d => d.id).filter(id => (arr || []).indexOf(id) >= 0);
  const name = id => BY[id] ? BY[id].name : String(id || "");

  function get() {
    try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.code && s.token && (s.role === "student" || s.role === "parent")) return s; } catch (e) {}
    return null;
  }
  function set(s) {
    if (!s || !s.code || !s.token) return;
    try { localStorage.setItem(KEY, JSON.stringify({ role: s.role || "student", code: String(s.code).toUpperCase(), name: s.name || "", token: s.token, tracks: clean(s.tracks), at: Date.now() })); } catch (e) {}
  }
  /** обновить список курсов (сервер прислал свежий) */
  function update(code, patch) { const s = get(); if (s && s.code === String(code || "").toUpperCase()) set(Object.assign(s, patch)); }
  function clear(token) { const s = get(); if (s && token && s.token !== token) return; try { localStorage.removeItem(KEY); } catch (e) {} }
  /** выход: сессия и токены этого кода во всех кабинетах на устройстве */
  function logoutAll(code) {
    code = String(code || "").toUpperCase();
    clear();
    STORES.forEach(k => {
      try {
        const a = JSON.parse(localStorage.getItem(k) || "null");
        if (!a || a.v !== 2 || !a.accounts) return;
        const id = "code:" + code, acc = a.accounts[id];
        if (!acc) return;

        localStorage.setItem(k, JSON.stringify(a));

  }

  /* ---------- переключатель: только выданные курсы ---------- */
  const el = (tag, attrs, kids) => {
    const n = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => { if (v == null || v === false) return; if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? "" : v); });
    (kids || []).forEach(c => { if (c != null) n.append(c); });
    return n;
  };
  const chev = () => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true"); s.setAttribute("class", "dsw-chev"); s.innerHTML = '<path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>'; return s; };
  function tile(d, icon) { return el("span", { class: "dsw-tile t-" + d.tone, "aria-hidden": "true" }, [icon ? icon(d.icon) : null]); }
  /**
   * cur: курс этой страницы; tracks: выданные ученику; opts: { icon(name) → узел, dark: тёмная шапка, hub: ссылка «Все мои курсы» }
   * Один курс: просто подпись. Несколько: кнопка со списком.
   */
  function switcher(cur, tracks, opts) {
    opts = opts || {};
    const list = clean(tracks), d0 = BY[cur];
    const root = el("div", { class: "dsw" + (opts.dark ? " on-dark" : "") });
    if (!d0) return root;

    const id = "dsw-" + Math.random().toString(36).slice(2, 7);

      [tile(d0, opts.icon), el("span", { class: "dsw-name", text: d0.short }), chev()]);
    const close = () => { menu.hidden = true; btn.setAttribute("aria-expanded", "false"); };
    const open = () => { menu.hidden = false; btn.setAttribute("aria-expanded", "true"); const a = menu.querySelector('[aria-current="page"]') || menu.querySelector("a"); if (a) a.focus(); };
    btn.addEventListener("click", () => (menu.hidden ? open() : close()));
    menu.append(el("span", { class: "dsw-cap", text: "Мои курсы" }));
    list.forEach(k => {
      const d = BY[k];
      menu.append(el("a", { href: d.href, class: "dsw-item" + (k === cur ? " on" : ""), "aria-current": k === cur ? "page" : null },
        [tile(d, opts.icon), el("span", { class: "dsw-txt" }, [el("b", { text: d.name }), el("small", { text: k === cur ? "ты здесь" : d.about })])]));
    });
    if (opts.hub !== false) menu.append(el("a", { href: HUB, class: "dsw-all", text: "Все мои курсы на одной странице" }));
    menu.addEventListener("keydown", e => { if (e.key === "Escape") { close(); btn.focus(); } });
    root._close = close;
    root.append(btn, menu);
    return root;
  }
  // один общий обработчик: клик мимо закрывает открытый список
  document.addEventListener("click", e => { document.querySelectorAll(".dsw").forEach(r => { if (r._close && !r.contains(e.target)) r._close(); }); });

  return { LIST, BY, HUB, KEY, name, clean, get, set, update, clear, logoutAll, switcher };
})();

<script>/* ===== Mr.Sam: запись на занятия по слотам + чек об оплате. Общий модуль для всех кабинетов. ===== */
(function () {
  "use strict";
  const MSK = 180; // минуты от UTC, Москва без перехода на летнее время
  const WD = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
  const WDL = ["воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"];
  const MON = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
  const TRACK = { ielts: "IELTS", toefl: "TOEFL", math: "Математика", english: "Английский", mathen: "Математика на английском" };
  const pad = n => String(n).padStart(2, "0");

  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "html") n.innerHTML = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);

  }
  /* даты: слот = день "YYYY-MM-DD" + время "HH:MM" по Москве */

  const key = p => p.y + "-" + pad(p.m + 1) + "-" + pad(p.d);
  const dayOf = d => { const p = msk(at(d, "12:00")); return p; };
  const longDay = d => { const p = dayOf(d); return WDL[p.wd] + ", " + p.d + " " + MON[p.m]; };
  const shortDay = d => { const p = dayOf(d); return WD[p.wd] + ", " + p.d + " " + MON[p.m].slice(0, 3); };
  const localOff = -new Date().getTimezoneOffset();
  const localTime = (d, t) => { const x = new Date(at(d, t)); return pad(x.getHours()) + ":" + pad(x.getMinutes()); };
  const addMin = (t, m) => { const [h, mi] = t.split(":").map(Number); const v = h * 60 + mi + m; return pad(Math.floor(v / 60) % 24) + ":" + pad(v % 60); };

  /* расписание из шаблона недели (демо и локальный режим) */
  function genSlots(cfg, takenFn) {

  let active = null;

    if (!cfg.week || !Object.keys(cfg.week).length) { const hrs = []; for (let x = cfg.from != null ? cfg.from : 9; x < (cfg.to != null ? cfg.to : 22); x++) hrs.push(pad(x) + ":00"); cfg.week = {}; for (let d = 0; d < 7; d++) cfg.week[d] = hrs; }

    }

    function drawMine() {
      mineBox.replaceChildren(el("h2", { id: "bk-mine-t" }, "Мои занятия"));
      const list = mine.filter(b => b.status !== "отменена").sort((a, b) => at(a.d, a.t) - at(b.d, b.t));
      if (!list.length) { mineBox.append(el("p", { class: "bk-muted" }, "Пока нет записей. Выбери время ниже.")); }
      else {
        const ul = el("ul", { class: "bk-mylist" });
        list.forEach(b => {
          const left = at(b.d, b.t) - Date.now(), canCancel = left > cfg.cancelHours * 36e5;
          ul.append(el("li", {},
            el("span", { class: "bk-myic" }, ctx.icon ? ctx.icon("calendar") : null), el("span", { class: "bk-mydate" }, el("b", {}, shortDay(b.d)), el("span", {}, b.t + "–" + addMin(b.t, cfg.lessonMin) + " МСК")),
            el("span", { class: "bk-tag" }, TRACK[b.track] || b.track || ""),
            canCancel ? el("button", { type: "button", class: "bk-btn ghost sm", onclick: () => cancel(b) }, "Отменить") : el("small", { class: "bk-muted" }, "отмена за " + cfg.cancelHours + " ч до начала")));
        });
        mineBox.append(ul);
      }
      if (ctx.balance === 0) mineBox.append(el("p", { class: "bk-warn" }, "Оплаченных занятий нет. Записаться можно, но оплати до начала занятия во вкладке «Оплата»."));
    }
    function drawCal() {
      const bd = byDay(), now = Date.now(), p0 = msk(now);
      const startOff = (p0.wd + 6) % 7; // от понедельника

        const btn = el("button", { type: "button", class: "bk-day" + (d === selDay ? " sel" : "") + (free ? " has" : "") + (has ? " mine" : "") + (!list.length || outside ? " off" : ""), disabled: outside || !list.length ? true : null, "aria-pressed": d === selDay ? "true" : "false", "aria-label": outside ? "" : longDay(d) + ": " + lbl, onclick: () => { selDay = d; selTime = null; draw(); jump(times); } },
          el("b", {}, String(p.d)), el("small", { class: "l-long" }, lbl), el("small", { class: "l-short", "aria-hidden": "true" }, sh));

      const parts = [["Утро", "sunrise", 0, 12], ["День", "sun", 12, 17], ["Вечер", "moon", 17, 24]];
      const g = el("div", { class: "bk-parts" });
      parts.forEach(([name, emo, from, to]) => {
        const inPart = list.filter(s => { const hh = +s.t.slice(0, 2); return hh >= from && hh < to; });
        if (!inPart.length) return;

/* ===== Mr.Sam: пароли. Локально: PBKDF2-SHA256 в браузере. С сервером: пароль проверяет Google Таблица, кабинет хранит только токен. ===== */

    parent: "Это код родителя. Родители входят на странице «Мои курсы».",

    paras: [
      ["A", "More than a century ago, the German researcher Hermann Ebbinghaus spent months memorising lists of nonsense syllables and testing himself after different intervals. He found that most of what he learned disappeared surprisingly quickly: within a day he had forgotten more than half of a new list. His graph of this decline became known as the forgetting curve."],
      ["B", "The good news is that the curve is not fixed. Each time we review information, it fades more slowly. A word you revise the day after learning it may stay with you for a week; revise it again a week later, and it may last much longer. Teachers call this spaced repetition, and many flashcard apps are built around it."],
      ["C", "Cramming the night before an exam feels productive, but it works against this pattern. Information studied in one long session is often gone soon after the test. Spreading the same number of hours over several days usually leads to better long-term results, even though each session feels less intense."],

          if (j.token) { S.token = j.token; store.save(S); const ss = DIRS && DIRS.get(); if (DIRS && (!ss || ss.code === String(S.profile.code).toUpperCase())) DIRS.set({ role: "student", code: S.profile.code, name: S.profile.name, token: j.token, tracks: sessTracks() || [CONFIG.exam] }); }
        } else {
