<style>
:root{
  color-scheme:light;
  --bg:#F5F3EF; --sand:#E7E2D9; --surface:#FFFFFF; --ink:#16231C; --muted:#5B6660; --line:#E3DED4;
  --forest:#153E2D; --forest-2:#1E4D39; --night:#0F2A1F; --on-dark:#F4F7EF; --on-dark-muted:#B9CDBF;
  --lime:#D5F36A; --violet:#8C7BFF; --violet-soft:#E4E0FF; --pink:#FF6FB5; --pink-soft:#FFE0EF; --yellow:#FFD84D; --yellow-soft:#FFF4C7;
  --orange:#FF8A3D; --orange-soft:#FFE6D3; --mint:#7FD8B6; --mint-soft:#DCF3E8; --orange-ink:#9A4A10; --error:#B4361A;
  --display:"Unbounded","Arial Black",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-xl:30px; --r-lg:24px; --r-md:18px; --r-sm:12px; --wrap:1200px; --gutter:clamp(12px,3vw,28px);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
img,svg{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:10px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:var(--gutter)}
.h{font-family:var(--display);text-transform:uppercase;font-weight:900;letter-spacing:-.01em;line-height:1.05}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 24px;border-radius:999px;border:0;font:900 13px/1.1 var(--display);text-transform:uppercase;text-decoration:none;cursor:pointer;transition:transform .15s var(--ease),box-shadow .15s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px)}
.btn-lime{background:var(--lime);color:var(--forest);box-shadow:0 5px 0 #9FBF3A}
.btn-dark{background:var(--forest);color:var(--on-dark);box-shadow:0 5px 0 #0A1F16}
.btn-pink{background:var(--pink);color:#fff;box-shadow:0 5px 0 #D74E95}
.btn-plain{background:var(--sand);color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.card{background:var(--surface);border-radius:var(--r-lg);padding:clamp(18px,2.4vw,28px)}

/* top */
.top{position:sticky;top:0;z-index:20;padding-top:10px}
.bar{background:var(--night);color:var(--on-dark);border-radius:999px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:62px;padding:7px 7px 7px 18px}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
.logo-mark{width:50px;height:42px;display:grid;place-items:center}
.logo-mark svg{width:50px;height:42px}

@keyframes mbob{50%{transform:translateY(-6px) rotate(-2deg)}}
.cab-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.cab-links a{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.14);color:inherit;font:900 14px/1 var(--body,inherit);text-decoration:none}
.cab-links a:hover{background:rgba(255,255,255,.26)}
.logo b{font:900 17px/1 var(--display);text-transform:uppercase}
.logo em{font-style:normal;background:var(--pink);color:#fff;border-radius:999px;padding:5px 9px;font:900 10px/1 var(--display);text-transform:uppercase;margin-left:4px}
.top-links{display:flex;gap:6px;align-items:center}
.top-links a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:999px;text-decoration:none;font-weight:800;font-size:14px}
.top-links a:hover{background:rgba(255,255,255,.08)}
@media (max-width:640px){.top-links a.hide-s{display:none}}
.tabs{display:flex;gap:6px;padding:6px;background:var(--surface);border-radius:999px;margin:14px 0 0;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;border:0;background:transparent;font:800 15px/1 var(--body);color:var(--ink);min-height:44px;padding:0 18px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tabs button[aria-current="page"]{background:var(--forest);color:var(--on-dark)}
main{padding:20px 0 60px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--night);color:#fff;border-radius:999px;padding:12px 20px;font-weight:800;z-index:50;box-shadow:0 14px 30px -14px rgba(0,0,0,.6)}

/* login */
.login{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch;margin-top:20px}
@media (max-width:860px){.login{grid-template-columns:minmax(0,1fr)}}
.login-hero{background:var(--pink);color:#fff;border-radius:var(--r-xl);padding:clamp(24px,4vw,44px);display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden;min-height:420px}
.login-hero .h{font-size:clamp(30px,4.4vw,54px)}
.login-hero p{font-size:18px;color:#FFE9F4;max-width:36ch}
.login-hero .mascot{position:absolute;right:10px;bottom:6px;width:min(46%,240px)}
.formulas{position:absolute;inset:0;pointer-events:none;font:900 22px/1 var(--display);color:rgba(255,255,255,.18)}
.formulas span{position:absolute}
.login-form{display:flex;flex-direction:column;gap:14px;justify-content:center}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:800 14px/1.3 var(--body)}
.input{font:700 16px/1.4 var(--body);color:var(--ink);background:var(--bg);border:2px solid transparent;border-radius:999px;padding:13px 20px;min-height:54px;width:100%}
.input:focus{outline:none;border-color:var(--forest);background:#fff}
textarea.input{border-radius:var(--r-md);min-height:110px;resize:vertical}
.err{color:var(--error);font-weight:800;font-size:14px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:800;font-size:13px}
.or::before,.or::after{content:"";flex:1;height:2px;background:var(--line)}
.banner{background:var(--yellow);border-radius:var(--r-md);padding:12px 16px;font-weight:800;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.banner button{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px;font:900 11px/1 var(--display);text-transform:uppercase;cursor:pointer}

/* overview */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:960px){.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
.hello{background:var(--forest);color:var(--on-dark);border-radius:var(--r-xl);padding:clamp(22px,3vw,36px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;position:relative;overflow:hidden}
.hello .h{font-size:clamp(26px,3.4vw,42px)}
.hello .h span{color:var(--lime)}
.hello p{color:var(--on-dark-muted);margin-top:10px;max-width:46ch}
.hello .mascot{width:150px}
@media (max-width:640px){.hello{grid-template-columns:minmax(0,1fr)}.hello .mascot{width:110px;position:absolute;right:10px;top:10px;opacity:.9}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border-radius:var(--r-md);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi b{font:900 30px/1 var(--display)}
.kpi span{font-weight:800;font-size:13px;color:var(--muted)}
.k1{background:var(--violet-soft)}.k2{background:var(--yellow-soft)}.k3{background:var(--mint-soft)}.k4{background:var(--pink-soft)}
.lvl{height:10px;border-radius:99px;background:rgba(255,255,255,.7);overflow:hidden;margin-top:4px}
.lvl i{display:block;height:100%;background:var(--violet);border-radius:99px}
.sec-t{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.sec-t .h{font-size:17px}
.topics{display:flex;flex-direction:column;gap:12px}
.trow{display:grid;grid-template-columns:34px minmax(0,1fr) 54px;gap:12px;align-items:center}
.trow .e{font-size:24px}
.trow b{font-weight:800;font-size:15px;display:block}
.tbar{height:12px;border-radius:99px;background:var(--bg);overflow:hidden;margin-top:6px}
.tbar i{display:block;height:100%;border-radius:99px;background:var(--mint)}
.trow em{font:900 13px/1 var(--display);font-style:normal;text-align:right}
.chart{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:10px;border-bottom:2px solid var(--line)}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.chart .col i{display:block;width:100%;max-width:38px;border-radius:10px 10px 4px 4px;background:var(--violet);min-height:6px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.chart .col.good i{background:var(--lime)}
.chart .col.bad i{background:var(--pink)}
.chart .col small{font:900 11px/1 var(--display)}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;color:var(--muted);padding:20px}
.empty .mascot{width:120px}
.next{background:var(--violet);color:#fff;border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:12px}
.next .h{font-size:20px}
.next p{color:#EEEBFF}

/* trainer */
.topic-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:960px){.topic-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tcard{border:0;text-align:left;cursor:pointer;border-radius:var(--r-md);padding:16px;min-height:150px;display:flex;flex-direction:column;gap:8px;font:inherit;color:var(--ink);transition:transform .2s var(--ease),box-shadow .2s;box-shadow:0 8px 0 rgba(0,0,0,.08)}
.tcard:hover{transform:translateY(-4px)}
.tcard[aria-pressed="true"]{box-shadow:0 8px 0 var(--forest),0 0 0 3px var(--forest)}
.tcard .e{font-size:34px;line-height:1}
.tcard b{font:900 14px/1.2 var(--display);text-transform:uppercase;margin-top:auto}
.tcard small{font-weight:700;font-size:13px;color:var(--muted)}
.levels{display:flex;gap:8px;flex-wrap:wrap}
.levels label{position:relative}
.levels input{position:absolute;opacity:0;inset:0;cursor:pointer}
.levels span{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 18px;border-radius:999px;background:var(--surface);font-weight:800}
.levels input:checked+span{background:var(--forest);color:var(--on-dark)}
.levels input:focus-visible+span{outline:3px solid var(--orange);outline-offset:2px}
.start-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:18px}
.run{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.run-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.run-head .h{font-size:14px}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--forest)}.dots i.no{background:var(--pink)}.dots i.now{box-shadow:0 0 0 3px var(--lime);background:#fff}
.combo{background:var(--yellow);border-radius:999px;padding:6px 12px;font:900 12px/1 var(--display)}
.qcard{background:var(--surface);border-radius:var(--r-xl);padding:clamp(22px,3vw,36px);display:flex;flex-direction:column;gap:18px;box-shadow:0 12px 0 var(--sand)}
.q{font:800 clamp(20px,2.4vw,28px)/1.35 var(--body)}
.q code{font:inherit;background:var(--yellow-soft);border-radius:8px;padding:0 6px}
.ans{display:flex;gap:10px;flex-wrap:wrap}
.ans .input{flex:1;min-width:180px;font-size:20px;font-weight:800}
.fb{border-radius:var(--r-md);padding:14px 18px;font-weight:700}
.fb.ok{background:var(--mint-soft)}.fb.no{background:var(--pink-soft)}
.fb b{display:block;font-weight:900;margin-bottom:4px}
.hint-t{font-size:13px;color:var(--muted)}
.result{text-align:center;align-items:center}
.result .score{font:900 clamp(56px,8vw,96px)/1 var(--display);color:var(--forest)}
.result .mascot{width:160px}
.xp{display:inline-block;background:var(--lime);border-radius:999px;padding:8px 14px;font:900 13px/1 var(--display)}

/* history, hw, pay */
.list{display:flex;flex-direction:column;gap:10px}
.li{background:var(--surface);border-radius:var(--r-md);padding:14px 18px;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:14px;align-items:center}
.li .e{font-size:28px}
.li b{display:block;font-weight:900}
.li small{color:var(--muted);font-weight:700}
.pill{border-radius:999px;padding:7px 12px;font:900 12px/1 var(--display);white-space:nowrap}
.p-good{background:var(--lime)}.p-mid{background:var(--yellow)}.p-bad{background:var(--pink);color:#fff}
.hw{background:var(--surface);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:12px}
.hw-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.hw h3{font:900 16px/1.25 var(--display);text-transform:uppercase}
.hw ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.st{border-radius:999px;padding:6px 11px;font:900 11px/1 var(--display);text-transform:uppercase}
.st-new{background:var(--yellow)}.st-sent{background:var(--mint-soft)}.st-done{background:var(--lime)}
.file{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:14px;cursor:pointer;background:var(--bg);border-radius:999px;padding:10px 16px}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.pkgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:860px){.pkgs{grid-template-columns:minmax(0,1fr)}}
.pkg{border:0;text-align:left;cursor:pointer;border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:8px;font:inherit;color:var(--ink);box-shadow:0 10px 0 rgba(0,0,0,.08);transition:transform .2s}
.pkg:hover{transform:translateY(-4px)}
.pkg[aria-pressed="true"]{box-shadow:0 10px 0 var(--forest),0 0 0 3px var(--forest)}
.pkg b{font:900 16px/1.2 var(--display);text-transform:uppercase}
.pkg .pr{font:900 30px/1 var(--display)}
.pkg small{font-weight:800;color:var(--muted)}
.pkg em{align-self:flex-start;font-style:normal;background:var(--forest);color:var(--lime);border-radius:999px;padding:6px 10px;font:900 10px/1 var(--display);text-transform:uppercase}
.pay-box{margin-top:16px}
.req{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;background:var(--bg);border-radius:var(--r-md);padding:14px 18px}
.req dt{font-weight:800;color:var(--muted)}.req dd{margin:0;font-weight:900}
.mascot{filter:drop-shadow(0 10px 14px rgba(15,42,31,.25))}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(3deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== запись на занятия + чек ===== */
.bk,.rc-wrap{--bk-ink:var(--ink,#153E2D);--bk-acc:var(--acc,#D5F36A);--bk-acc-ink:var(--acc-ink,#153E2D);--bk-acc-deep:var(--acc-deep,#A9C93F);--bk-acc-soft:var(--acc-soft,#F0FAD0);--bk-bg:var(--bg,#F5F3EF);--bk-line:#E6E1D8;--bk-muted:#5B6B62;--bk-disp:"Unbounded","Arial Black",system-ui,sans-serif}
.bk{display:flex;flex-direction:column;gap:16px;color:var(--bk-ink)}
.bk-card{background:#fff;border-radius:30px;padding:clamp(18px,2.4vw,28px);box-shadow:0 18px 40px -30px rgba(21,62,45,.35);min-width:0}
.bk h1{margin:4px 0 0;font:900 clamp(24px,3.2vw,38px)/1.05 var(--bk-disp);text-transform:uppercase}
.bk h2{margin:0 0 12px;font:800 clamp(17px,1.8vw,21px)/1.15 var(--bk-disp)}
.bk-eyebrow{font:800 11px/1.2 var(--bk-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--bk-muted)}
.bk-muted{color:var(--bk-muted)}
.bk-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;background:var(--bk-acc);color:var(--bk-acc-ink)}
.bk-head .bk-eyebrow,.bk-head .bk-muted{color:inherit;opacity:.85}
.bk-head p{margin:8px 0 0;max-width:60ch;font-weight:700}
.bk-live{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.8);color:var(--bk-ink);border-radius:999px;padding:9px 14px;font:900 13px/1 inherit;white-space:nowrap}
.bk-live.on{background:#fff}
.bk-live.on::first-letter{color:#16A34A}
.bk-live.err{background:#FFE1DA;color:#A33A12}
.bk-mylist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.bk-mylist li{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:12px;align-items:center;background:var(--bk-bg);border-radius:18px;padding:10px 12px 10px 16px}
.bk-mydate{display:flex;flex-direction:column;gap:2px;min-width:0}
.bk-mydate b{font:900 17px/1.2 inherit}
.bk-mydate span{font-weight:800;color:var(--bk-muted);font-size:14px}
.bk-tag{background:var(--bk-acc);color:var(--bk-acc-ink);border-radius:999px;padding:6px 10px;font:900 12px/1 inherit}
@media (max-width:520px){.bk-mylist li{grid-template-columns:40px minmax(0,1fr) auto}.bk-mylist li > :last-child{grid-column:2/-1;justify-self:start}}
.bk-warn{margin:10px 0 0;background:#FFF1D6;border-radius:14px;padding:10px 14px;font-weight:800;font-size:14px}
.bk-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.bk-grid{grid-template-columns:minmax(0,1fr)}}
.bk-cal-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.bk-cal-head .bk-muted{font-size:13px;font-weight:800}
.bk-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.bk-wd{font:900 11px/1 inherit;text-transform:uppercase;letter-spacing:.06em;color:var(--bk-muted);text-align:center;padding:4px 0}
.bk-day{position:relative;border:0;border-radius:14px;background:var(--bk-bg);min-height:64px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--bk-ink);font:inherit;transition:transform .12s,box-shadow .12s,background-color .12s}
.bk-day b{font:900 18px/1 var(--bk-disp)}
.bk-day small{font:800 10.5px/1.1 inherit;color:var(--bk-muted);text-align:center}
.bk-day i{font:900 9px/1 inherit;font-style:normal;text-transform:uppercase;color:var(--bk-muted);margin-bottom:-1px}
.bk-day.has{background:#fff;box-shadow:inset 0 0 0 2px var(--bk-line)}
.bk-day.has small{color:#16803F}
.bk-day.has:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 2px var(--bk-ink)}
.bk-day.mine{background:var(--bk-acc-soft)}
.bk-day.off{opacity:.38;cursor:default}
.bk-day[disabled]:not(.off){opacity:.2}
.bk-day.sel{background:var(--bk-ink);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.bk-day.sel small,.bk-day.sel i{color:#D9E7DD}
@media (max-width:420px){.bk-day{min-height:56px}.bk-day small{font-size:9px}.bk-day b{font-size:15px}}
.bk-tz{font-size:13px;font-weight:800;margin:-6px 0 10px}
.bk-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.bk-chip{border:0;border-radius:16px;min-height:62px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font:inherit;color:var(--bk-ink);transition:transform .12s,box-shadow .12s}
.bk-chip b{font:900 18px/1 var(--bk-disp)}
.bk-chip small{font:800 11px/1 inherit}
.bk-chip.free{background:#fff;box-shadow:inset 0 0 0 2px var(--bk-line),0 4px 0 var(--bk-line)}
.bk-chip.free small{color:#16803F}
.bk-chip.free:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 2px var(--bk-ink),0 5px 0 var(--bk-line)}
.bk-chip.free.sel{background:var(--bk-acc);color:var(--bk-acc-ink);box-shadow:inset 0 0 0 2px var(--bk-ink),0 4px 0 var(--bk-acc-deep)}
.bk-chip.free.sel small{color:inherit}
.bk-chip.taken{background:repeating-linear-gradient(-45deg,#F1EEE8 0 8px,#E8E4DC 8px 16px);color:#9AA59E;cursor:not-allowed}
.bk-chip.taken b{text-decoration:line-through}
.bk-chip.mine{background:var(--bk-ink);color:#fff;cursor:default}
.bk-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font:800 12px/1 inherit;color:var(--bk-muted)}
.bk-legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.bk-legend .free::before{background:#fff;box-shadow:inset 0 0 0 2px var(--bk-line)}
.bk-legend .taken::before{background:repeating-linear-gradient(-45deg,#F1EEE8 0 3px,#DDD8CE 3px 6px)}
.bk-legend .mine::before{background:var(--bk-ink)}
.bk-confirm{margin-top:16px;border-radius:20px;background:var(--bk-acc-soft);padding:16px;display:flex;flex-direction:column;gap:8px}
.bk-confirm > b{font:900 17px/1.25 var(--bk-disp)}
.bk-confirm textarea{width:100%;border:2px solid transparent;border-radius:14px;background:#fff;padding:10px 12px;font:700 15px/1.4 inherit;color:var(--bk-ink);resize:vertical}
.bk-confirm textarea:focus{outline:none;border-color:var(--bk-ink)}
.bk-lbl{font-weight:900;font-size:14px}
.bk-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border:0;border-radius:999px;background:var(--bk-ink);color:#fff;font:900 15px/1 inherit;cursor:pointer;box-shadow:0 4px 0 #0A2318;transition:transform .14s}
.bk-btn:hover{transform:translateY(-2px)}
.bk-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0A2318}
.bk-btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.bk-btn.ghost{background:#fff;color:var(--bk-ink);box-shadow:inset 0 0 0 2px var(--bk-line),0 3px 0 var(--bk-line)}
.bk-btn.sm{min-height:42px;padding:0 16px;font-size:14px}
.bk-go{align-self:flex-start;background:var(--bk-acc);color:var(--bk-acc-ink);box-shadow:0 4px 0 var(--bk-acc-deep);min-height:54px;padding:0 30px;font-size:16px}
.bk-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;opacity:0}
.rc-wrap{display:flex;flex-direction:column;gap:6px}
.rc{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;border:2px dashed #CFC8BB;border-radius:18px;background:#fff;padding:10px 12px;cursor:pointer;transition:border-color .15s,background-color .15s}
.rc:hover,.rc.over{border-color:var(--bk-ink);background:var(--bk-acc-soft)}
.rc.ok{border-style:solid;border-color:#16803F;background:#EAF7EF}
.rc-prev{width:56px;height:56px;border-radius:12px;background:var(--bk-bg) center/cover no-repeat;display:grid;place-items:center;font-size:26px}
.rc-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.rc-txt b{font:900 15px/1.2 inherit}
.rc-name{font:700 13px/1.3 inherit;color:var(--bk-muted);overflow-wrap:anywhere}
.rc-wrap input:focus-visible + .rc{outline:3px solid #E88135;outline-offset:2px}
.bk-link{background:none;border:0;padding:4px 0;font:800 14px/1.2 inherit;color:var(--bk-ink);text-decoration:underline;cursor:pointer;align-self:flex-start}
.bk-err{color:#A33A12;font-weight:800;font-size:14px;margin:0}
.rc-chip{display:inline-flex;align-items:center;gap:4px;background:#EAF7EF;color:#16803F;border-radius:999px;padding:4px 9px;font:900 12px/1 inherit;text-decoration:none}

.bk-parts{display:flex;flex-direction:column;gap:14px}
.bk-part-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font:900 14px/1 inherit}
.bk-part-h small{font:800 12px/1 inherit;color:var(--bk-muted)}
.bk-chips{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
.bk-conf-top{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center}
.bk-conf-top b{display:block;font:900 17px/1.25 var(--bk-disp)}
.bk-conf-top .bk-muted{font-size:14px;font-weight:700}
.samir-ava{display:inline-block;width:52px;height:52px;border-radius:50%;background:#DDE5E0 var(--samir,none) center/cover no-repeat;box-shadow:0 0 0 3px #fff,0 4px 10px -4px rgba(0,0,0,.35);flex:none}
.samir-ava.sm{width:30px;height:30px;box-shadow:0 0 0 2px #fff}

.bk-day .l-short{display:none}
@media (max-width:560px){.bk-day .l-long{display:none}.bk-day .l-short{display:block;font-size:10.5px}.bk-day{min-height:54px;border-radius:12px}.bk-days{gap:5px}}
.bk-day.off b{opacity:.6}
.rc-chip{white-space:nowrap}

.bk-myic .cicon{width:40px;height:40px}
.bk-part-h span{display:inline-flex;align-items:center;gap:8px}
.bk-part-h .cicon{width:26px;height:26px}
.rc-prev .cicon{width:40px;height:40px}
.cicon{display:inline-block;flex:none;line-height:0}
.cicon svg{width:100%;height:100%;overflow:visible}

.cicon{display:inline-block;flex:none;line-height:0;width:22px;height:22px}
.cicon svg{width:100%;height:100%;overflow:visible}
.tabs button{gap:8px}
.tabs button .cicon{width:24px;height:24px}
.trow .e .cicon{width:30px;height:30px}
.tcard .e .cicon{width:46px;height:46px}
.li .e .cicon{width:36px;height:36px}
.kpi b{display:inline-flex;align-items:center;gap:6px}
.kpi b .cicon{width:30px;height:30px}
.next .h,.run-head .h{display:inline-flex;align-items:center;gap:8px}
.m3dwrap{position:relative;display:inline-block}
.m3dwrap .m3d-in{width:100%;margin:0;animation:none}
.m-badge{position:absolute;right:-4px;top:-8px;width:40px;height:40px}
.tl-btn{border:0;background:rgba(255,255,255,.1);color:inherit;min-height:40px;padding:0 14px;border-radius:999px;font:800 14px/1 var(--body);cursor:pointer}
.tl-btn:hover{background:rgba(255,255,255,.2)}
.saved-acc{display:flex;flex-direction:column;gap:8px}
.saved-row{display:grid;grid-template-columns:44px minmax(0,1fr) 20px;gap:12px;align-items:center;border:0;background:var(--bg,#F5F3EF);border-radius:18px;padding:10px 14px 10px 10px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.saved-row:hover{box-shadow:inset 0 0 0 2px var(--forest)}
.saved-ava .cicon{width:44px;height:44px}
.saved-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.saved-txt b{font:900 16px/1.2 var(--body)}
.saved-txt small{font-weight:800;color:var(--muted);font-size:13px}
.col-ic .cicon{width:18px;height:18px}

.pw-form{display:flex;flex-direction:column;gap:14px}
.pw-wrap{position:relative;display:flex}
.pw-wrap input{width:100%;padding-right:96px}
.pw-field input{background:var(--bg,#F5F3EF);border:2px solid transparent;border-radius:16px;min-height:52px;padding:12px 96px 12px 16px;font:700 16px/1.2 var(--body);color:var(--ink)}
.pw-field input:focus{outline:none;border-color:var(--forest)}
.pw-field label{font-weight:900;font-size:14px}
.pw-field{display:flex;flex-direction:column;gap:6px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:#fff;border-radius:999px;min-height:36px;padding:0 12px;font:800 13px/1 var(--body);color:var(--muted);cursor:pointer}
.pw-hint{font-size:13px;color:var(--muted);font-weight:700}
.login-note{background:#FFF1D6;border-radius:14px;padding:10px 14px;font-weight:800;font-size:14px;margin:0 0 12px}
.login-links{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* ===== Mr.Sam Stories ===== */
.ms-row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:6px 4px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ms-row::-webkit-scrollbar{display:none}
.ms-item{flex:none;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:7px;width:86px;background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit}
.ms-ring{position:relative;width:78px;height:78px;border-radius:50%;padding:3px;background:conic-gradient(from 210deg,#D5F36A,#FFD84D,#FF6FB5,#8C7BFF,#D5F36A);transition:transform .2s cubic-bezier(.2,.7,.2,1)}
.ms-item:hover .ms-ring{transform:scale(1.06) rotate(-3deg)}
.ms-item:active .ms-ring{transform:scale(.95)}
.ms-item.seen .ms-ring{background:rgba(127,140,133,.45)}
.ms-in{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;border:3px solid var(--ms-gap,#F5F3EF);line-height:1;gap:2px;overflow:hidden}
.ms-in b{font:900 20px/1 "Unbounded","Arial Black",system-ui,sans-serif;letter-spacing:-.02em;color:#10291E;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-in small{font:900 8.5px/1 "Unbounded",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em;color:rgba(16,41,30,.7)}
.t-violet .ms-in,.ms-ava.t-violet{background:linear-gradient(150deg,#C9C0FF,#8C7BFF)}
.t-pink .ms-in,.ms-ava.t-pink{background:linear-gradient(150deg,#FFC2E0,#FF6FB5)}
.t-yellow .ms-in,.ms-ava.t-yellow{background:linear-gradient(150deg,#FFF0A8,#FFD84D)}
.t-lime .ms-in,.ms-ava.t-lime{background:linear-gradient(150deg,#F0FCC0,#D5F36A)}
.t-mint .ms-in,.ms-ava.t-mint{background:linear-gradient(150deg,#D4F6E8,#7FD8B6)}
.ms-new{position:absolute;right:-4px;bottom:2px;background:#FF5A6E;color:#fff;font:900 9px/1 "Unbounded",system-ui,sans-serif;text-transform:uppercase;padding:4px 6px;border-radius:999px;border:2px solid var(--ms-gap,#F5F3EF)}
.ms-name{font-weight:800;font-size:13px;line-height:1.15;text-align:center;max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.ms-lock,.ms-lock body{overflow:hidden}
.ms-ov{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:rgba(8,20,14,.78);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);opacity:0;transition:opacity .2s}
.ms-ov.in{opacity:1}
.ms-card{position:relative;width:min(420px,100vw);height:min(760px,100dvh);border-radius:30px;overflow:hidden;background:#10291E;color:#fff;touch-action:pan-y;user-select:none;-webkit-user-select:none;transform:scale(.94);transition:transform .25s cubic-bezier(.2,.7,.2,1);box-shadow:0 40px 90px -30px rgba(0,0,0,.7)}
.ms-ov.in .ms-card{transform:none}
@media (max-width:480px){.ms-card{border-radius:0;width:100vw;height:100dvh}}
.ms-bars{position:absolute;top:12px;left:12px;right:12px;z-index:5;display:flex;gap:4px}
.ms-bars span{flex:1;height:3.5px;border-radius:3px;background:rgba(255,255,255,.32);overflow:hidden}
.ms-bars i{display:block;height:100%;width:0;background:#fff;border-radius:3px}
.ms-top{position:absolute;top:24px;left:14px;right:8px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ms-who{display:flex;align-items:center;gap:10px;min-width:0}
.ms-who b{display:block;font:900 15px/1.1 "Unbounded",system-ui,sans-serif}
.ms-who small{display:block;font-weight:800;font-size:12.5px;opacity:.85}
.ms-ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:900 16px/1 "Unbounded",system-ui,sans-serif;color:#10291E;border:2px solid rgba(255,255,255,.8);flex:none}
.ms-x{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ms-x:focus-visible,.ms-nav:focus-visible,.ms-cta:focus-visible{outline:3px solid #D5F36A;outline-offset:2px}
.ms-nav{position:absolute;top:90px;bottom:90px;z-index:3;width:32%;background:transparent;border:0;cursor:pointer}
.ms-nav.prev{left:0}.ms-nav.next{right:0;width:68%}
.ms-stage{position:absolute;inset:0}
.ms-slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:96px 26px 104px;overflow:hidden;animation:msIn .35s cubic-bezier(.2,.7,.2,1)}
@keyframes msIn{from{opacity:0;transform:translateX(18px) scale(.985)}to{opacity:1;transform:none}}
.ms-slide.t-violet{background:linear-gradient(165deg,#6E5BF0 0%,#8C7BFF 45%,#C7A6FF 100%)}
.ms-slide.t-pink{background:linear-gradient(165deg,#E2408F 0%,#FF6FB5 48%,#FFB0A8 100%)}
.ms-slide.t-yellow{background:linear-gradient(165deg,#F2A93B 0%,#FFD84D 55%,#F6F08A 100%);color:#10291E}
.ms-slide.t-lime{background:linear-gradient(165deg,#153E2D 0%,#2F6B3D 50%,#9CC23A 100%)}
.ms-slide.t-mint{background:linear-gradient(165deg,#1E6B53 0%,#3BA884 55%,#A8EBCF 100%)}
.ms-blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;pointer-events:none}
.ms-blob.b1{width:280px;height:280px;top:-60px;right:-80px;background:#D5F36A;animation:msFloat 9s ease-in-out infinite}
.ms-blob.b2{width:240px;height:240px;bottom:-40px;left:-90px;background:#FFFFFF;opacity:.35;animation:msFloat 11s ease-in-out infinite reverse}
@keyframes msFloat{50%{transform:translate(-20px,30px) scale(1.1)}}
.ms-body{position:relative;z-index:1;display:flex;flex-direction:column;gap:16px}
.ms-score{display:flex;flex-direction:column;gap:4px}
.ms-exam{font:900 13px/1 "Unbounded",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;opacity:.9}
.ms-score b{font:900 clamp(92px,30vw,132px)/.9 "Unbounded","Arial Black",system-ui,sans-serif;letter-spacing:-.05em;text-shadow:0 10px 40px rgba(0,0,0,.18)}
.ms-score b:not([data-to]),.ms-score b[data-to=""]{font-size:clamp(38px,11vw,52px);line-height:1;letter-spacing:-.02em;text-transform:uppercase}
.ms-chips{display:flex;flex-wrap:wrap;gap:8px}
.ms-glass{display:inline-flex;align-items:center;padding:8px 13px;border-radius:999px;font-weight:900;font-size:13.5px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 8px 24px -14px rgba(0,0,0,.4);-webkit-backdrop-filter:blur(12px) saturate(160%);backdrop-filter:blur(12px) saturate(160%)}
.t-yellow .ms-glass{background:rgba(255,255,255,.45);border-color:rgba(255,255,255,.7)}
.ms-scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:2px}
.ms-scale span{display:flex;flex-direction:column;gap:6px;align-items:center}
.ms-scale i{display:block;width:100%;height:10px;border-radius:6px;background:rgba(255,255,255,.25)}
.ms-scale .on i{background:rgba(255,255,255,.85)}
.ms-scale .cur i{background:#D5F36A;box-shadow:0 0 0 3px rgba(213,243,106,.35),0 0 18px #D5F36A}
.t-yellow .ms-scale .cur i,.t-lime .ms-scale .cur i{background:#10291E;box-shadow:none}
.t-lime .ms-scale .cur i{background:#FFD84D}
.ms-scale small{font:900 11px/1 "Unbounded",system-ui,sans-serif;opacity:.75}
.ms-scale .cur small{opacity:1}
.ms-secs{display:flex;flex-direction:column;gap:9px;padding:14px 16px;border-radius:20px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.ms-sec{display:grid;grid-template-columns:86px 1fr 38px;align-items:center;gap:10px;font-weight:900;font-size:14px}
.ms-sec b{font:900 16px/1 "Unbounded",system-ui,sans-serif;text-align:right}
.ms-bar{height:10px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden}
.ms-bar i{display:block;height:100%;width:var(--w);border-radius:6px;background:#fff;transform-origin:left;animation:msBar .8s cubic-bezier(.2,.7,.2,1) var(--d) both}
@keyframes msBar{from{transform:scaleX(0)}}
.ms-note{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:20px;background:rgba(16,41,30,.28);font-weight:700;font-size:15px;line-height:1.42}
.t-yellow .ms-note{background:rgba(255,255,255,.5)}
.ms-note p{margin:0}
.ms-note small{display:block;font:900 10.5px/1 "Unbounded",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;opacity:.75;margin-bottom:5px}
.ms-kicker{font:900 12px/1 "Unbounded",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.ms-title{margin:0;font:900 clamp(30px,8.5vw,40px)/1.02 "Unbounded",system-ui,sans-serif;text-transform:uppercase;letter-spacing:-.02em}
.ms-lines{margin:0;padding:0;list-style:none;counter-reset:l;display:flex;flex-direction:column;gap:10px}
.ms-lines li{counter-increment:l;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;font-weight:800;font-size:16px;line-height:1.35;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);animation:msUp .45s cubic-bezier(.2,.7,.2,1) var(--d) both}
.ms-lines li::before{content:counter(l);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;color:#10291E;font:900 14px/1 "Unbounded",system-ui,sans-serif}
@keyframes msUp{from{opacity:0;transform:translateY(12px)}}
.ms-cta{position:absolute;left:18px;right:18px;bottom:20px;z-index:6;display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:999px;background:#D5F36A;color:#10291E;font:900 15px/1 "Unbounded",system-ui,sans-serif;text-transform:uppercase;text-decoration:none;box-shadow:0 6px 0 #9CC23A,0 18px 40px -16px rgba(0,0,0,.5)}
.ms-cta:active{transform:translateY(3px);box-shadow:0 3px 0 #9CC23A}
.ms-card.paused .ms-bars{opacity:.5}
@media (prefers-reduced-motion:reduce){.ms-slide,.ms-lines li,.ms-bar i,.ms-blob{animation:none!important}}

.ny-snow.front{z-index:26}
.ny-garland{position:absolute;left:28px;right:28px;bottom:-15px;height:26px;pointer-events:none;z-index:2}
.ny-garland svg{position:absolute;inset:0;overflow:visible}
.ny-garland i{position:absolute;top:10px;width:9px;height:14px;margin-left:-4.5px;border-radius:50% 50% 46% 46%/40% 40% 60% 60%;background:var(--c);box-shadow:0 0 10px 2px var(--c),inset -2px -3px 0 rgba(0,0,0,.18);animation:nyBlink 1.35s ease-in-out infinite alternate}
.ny-garland i::before{content:"";position:absolute;left:2px;top:-4px;width:5px;height:5px;border-radius:2px;background:#0E2219}
.ny-garland i:nth-child(even){top:13px}

.ny-cap{position:relative}

  background:radial-gradient(circle at 50% 0,#fff 9px,transparent 9.5px) 0 2px/22px 20px repeat-x,radial-gradient(circle at 50% 0,#fff 5px,transparent 5.5px) 11px 8px/44px 20px repeat-x,linear-gradient(#fff,#fff) 0 0/100% 7px no-repeat;

/* ===== раздел «Игры» ===== */
.gm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.gm-card{display:flex;flex-direction:column;gap:12px;padding:10px 10px 14px;border-radius:26px;background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 0 #fff,0 22px 46px -32px rgba(21,62,45,.45);transition:transform .2s cubic-bezier(.2,.7,.2,1)}
.gm-card:hover{transform:translateY(-4px)}
.gm-cover{height:140px;border-radius:20px;display:grid;place-items:center;color:#fff;position:relative;overflow:hidden}
.gm-cover::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 10%,rgba(255,255,255,.4),transparent 50%)}
.gm-cover svg{width:52px;height:52px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}

.gm-body p{margin:0;font-size:14.5px;line-height:1.45;color:#5B6B62;font-weight:700}
.gm-tag{align-self:flex-start;padding:4px 10px;border-radius:999px;background:#ECE8FF;font:900 11px/1.2 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em;color:#4B3BC0}
.gm-play{margin:auto 6px 0;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:999px;border:0;background:#D5F36A;color:#153E2D;font:900 14px/1 "Unbounded",system-ui,sans-serif;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 0 #A9CC33}
.gm-play:active{transform:translateY(2px);box-shadow:0 2px 0 #A9CC33}
.gm-play:disabled{opacity:.6}
.gm-empty,.gm-load{grid-column:1/-1;padding:30px;text-align:center;font-weight:800;color:#5B6B62;border:2px dashed rgba(21,62,45,.15);border-radius:22px}
.gm-load{display:flex;align-items:center;justify-content:center;gap:10px;border:0}
.gm-spin{width:18px;height:18px;border-radius:50%;border:3px solid rgba(21,62,45,.15);border-top-color:#153E2D;animation:gmsp .8s linear infinite}
@keyframes gmsp{to{transform:rotate(360deg)}}
.gm-lock,.gm-lock body{overflow:hidden}
.gm-ov{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;background:#0B1A2A}
.gm-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px 8px 16px;padding-top:max(8px,env(safe-area-inset-top));background:#0F2A1F;color:#F2F7EF}
.gm-bar b{font:900 14px/1.2 "Unbounded",system-ui,sans-serif;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gm-x{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.gm-x:focus-visible{outline:3px solid #D5F36A;outline-offset:2px}
.gm-frame{flex:1;width:100%;border:0;background:#0B1A2A}
.gm-info{margin-left:auto;padding:6px 10px;border-radius:999px;background:rgba(213,243,106,.16);color:#D5F36A;font:900 11px/1.2 "Unbounded",system-ui,sans-serif;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
@media (max-width:520px){.gm-info{display:none}}

.hw-cm{margin:0;padding:10px 14px;border-radius:14px;background:var(--violet-soft,#ECE8FF);font-weight:800}
.st-redo{background:#FFE6D3}
/* ===== Mr.Sam · ачивки с иллюстрациями ===== */
.ach-sec{display:flex;flex-direction:column;gap:16px}
.ach-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ach-head h2{margin:0;font:900 clamp(20px,2.4vw,28px)/1 "Unbounded","Arial Black",system-ui,sans-serif;text-transform:uppercase;letter-spacing:-.01em;color:#153E2D}
.ach-count{padding:7px 13px;border-radius:999px;background:#D5F36A;font:900 13px/1 "Unbounded","Arial Black",system-ui,sans-serif;color:#153E2D}
.ach-more{margin-left:auto;border:0;background:none;padding:6px 2px;font:900 14px/1.2 "Unbounded","Arial Black",system-ui,sans-serif;color:#153E2D;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px;cursor:pointer}
.ach-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
@media (max-width:1100px){.ach-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:760px){.ach-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:540px){.ach-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.ach{position:relative;display:flex;flex-direction:column;gap:6px;padding:8px 12px 14px;border-radius:24px;text-align:center;
  background:radial-gradient(120% 90% at 20% 0,#FFFFFF 0,#F7FBEF 45%,#EEF7DA 100%);box-shadow:inset 0 1px 0 #fff,0 16px 30px -24px rgba(21,62,45,.55);transition:transform .2s cubic-bezier(.2,.7,.2,1)}
.ach.on:hover{transform:translateY(-3px)}
.ach-art{position:relative;aspect-ratio:340/176;margin:0 -8px;background:url("ach.webp") calc(var(--k) * 100% / 11) 0/1200% 100% no-repeat}
.ach-t{font:900 14.5px/1.2 "Nunito",system-ui,sans-serif;color:#153E2D}
.ach-d{min-height:2.5em;font:700 12.5px/1.25 "Nunito",system-ui,sans-serif;color:#5B6B62}
.ach-foot{display:flex;align-items:center;gap:8px;margin-top:auto}
.ach-bar{flex:1;height:10px;border-radius:99px;background:#E2E8D6;overflow:hidden}
.ach-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#9ED62C,#C9EE4F);box-shadow:inset 0 -2px 0 rgba(0,0,0,.06)}
.ach-st{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#2FA34A;color:#fff;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.ach-st svg{width:16px;height:16px}
.ach-n{flex:none;font:900 11.5px/1 "Nunito",system-ui,sans-serif;color:#8A938E;white-space:nowrap}
.ach:not(.on){background:radial-gradient(120% 90% at 20% 0,#FAFAF9 0,#F1F1EF 60%,#ECECEA 100%)}
.ach:not(.on) .ach-art{filter:grayscale(1) contrast(.85) brightness(1.06);opacity:.7}
.ach:not(.on) .ach-t{color:#8C948F}
.ach:not(.on) .ach-bar i{background:#B9C4AE}
.ach:not(.on) .ach-st{background:#E4E6E2;color:#98A09B;box-shadow:none}
.ach-lock{position:absolute;right:18%;bottom:6%;width:22%;max-width:46px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:#fff;color:#8E948F;box-shadow:0 6px 14px -6px rgba(0,0,0,.3)}
.ach-lock svg{width:52%;height:52%}
@media (prefers-reduced-motion:reduce){.ach{transition:none}}

/* ===== v9: персональный кабинет по математике ===== */
.coach{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:18px;align-items:end;background:radial-gradient(120% 150% at 100% 0,#2C6E4E 0,var(--forest) 52%,#0F2A1F 100%);color:var(--on-dark);border-radius:var(--r-xl);padding:clamp(20px,3vw,34px);overflow:hidden}
.coach-body{display:flex;flex-direction:column;gap:10px;min-width:0}
.coach-hi{font-weight:800;color:var(--on-dark-muted);font-size:16px;margin-top:4px}
.coach-hi b{color:#fff}
.coach-chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);font-weight:800;font-size:13.5px;color:#EAF4E6;max-width:100%}
.chip .cicon{width:18px;height:18px;flex:none}
.chip-goal{background:rgba(213,243,106,.14);border-color:rgba(213,243,106,.42);color:var(--lime)}
.coach-kicker{margin-top:8px;font:900 12px/1.2 var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--pink)}
.coach .coach-kicker{color:#FF9CCB}
.coach-t{font:900 clamp(21px,2.9vw,34px)/1.15 var(--display);letter-spacing:-.01em;max-width:26ch;margin:0}
.coach-why{color:var(--on-dark-muted);max-width:58ch;font-size:15.5px;font-weight:700}
.coach-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.btn-big{min-height:58px;padding:0 30px;font-size:14px}
.btn-glass{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22)}
.btn-glass:hover{background:rgba(255,255,255,.2)}
.btn-sm{min-height:42px;padding:0 16px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.coach-note{margin-top:2px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.08);font-size:14.5px;color:#EAF4E6;max-width:62ch}
.coach-note b{color:var(--lime)}
.coach-side{display:flex;flex-direction:column;align-items:center;gap:12px;align-self:stretch;justify-content:flex-end}
.bubble{position:relative;margin:0;background:#fff;color:var(--ink);border-radius:18px;padding:12px 14px;font-weight:800;font-size:14px;line-height:1.35;box-shadow:0 14px 30px -18px rgba(0,0,0,.6)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:3px}
.coach-m{width:170px}
@media (max-width:760px){
  .coach{grid-template-columns:minmax(0,1fr);gap:14px}
  .coach-side{flex-direction:row;align-items:center;justify-content:flex-start;gap:12px}
  .coach-side .bubble{order:2;flex:1;font-size:13.5px}
  .coach-side .bubble::after{left:-6px;top:50%;bottom:auto;transform:translateY(-50%) rotate(45deg)}
  .coach-m{width:92px;flex:none;order:1}
  .coach-cta .btn{flex:1 1 220px}
}
.link-btn{border:0;background:none;padding:6px 2px;font:900 13px/1.2 var(--body);color:var(--forest);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.sec-sub{font-size:13.5px;font-weight:800}

/* назначения */
.asg-list{display:flex;flex-direction:column;gap:10px}
.asg{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 14px;border-radius:var(--r-md);background:#FBFAF7;border:1px solid var(--line)}
.asg-ic .cicon{width:40px;height:40px}
.asg-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.asg-main b{font-weight:900;font-size:16px;line-height:1.3}
.asg-main small{color:var(--muted);font-weight:700;font-size:13.5px}
.asg-main .asg-note{color:var(--forest)}
.asg-st{font:900 11.5px/1.1 var(--display);text-transform:uppercase;padding:7px 11px;border-radius:999px;background:var(--sand);white-space:nowrap}
.s-new .asg-st{background:var(--lime)}
.s-go .asg-st{background:var(--yellow)}
.s-late{border-color:#F6B4D2;background:#FFF6FA}
.s-late .asg-st{background:var(--pink);color:#fff}
.s-done{opacity:.85}
.s-done .asg-st{background:var(--mint-soft);color:#1D5A40}
@media (max-width:640px){.asg{grid-template-columns:40px minmax(0,1fr);row-gap:10px}.asg-st{grid-column:2;justify-self:start}.asg .btn{grid-column:1/-1;width:100%}}

/* мои темы */
.mt-list{display:flex;flex-direction:column;gap:8px}
.mt{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:#FBFAF7;border-radius:var(--r-md);padding:10px 14px;font:inherit;color:inherit;cursor:pointer;transition:transform .15s var(--ease),border-color .15s}
.mt:hover{transform:translateY(-2px);border-color:rgba(21,62,45,.3)}
.mt .e .cicon{width:38px;height:38px}
.mt-main{display:flex;flex-direction:column;gap:5px;min-width:0}
.mt-main b{font-weight:900}
.weak{display:inline-block;margin-left:8px;padding:3px 8px;border-radius:999px;background:var(--pink);color:#fff;font:900 10.5px/1.2 var(--display);text-transform:uppercase;vertical-align:2px}
.mt-main small{color:var(--muted);font-weight:700;font-size:13px;line-height:1.3}
.mt .tbar{display:block;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.mt .tbar i{display:block;height:100%;border-radius:99px}
.lv{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:999px;font:900 11px/1 var(--display);text-transform:uppercase;white-space:nowrap}
.lv1{background:var(--mint-soft);color:#1D5A40}.lv2{background:var(--yellow-soft);color:#7A5A00}.lv3{background:var(--violet-soft);color:#3D2EA8}
.lv-lock{display:inline-flex}
.mt-rule{margin-top:12px;font-size:13px;font-weight:700;color:var(--muted)}

/* ошибки */
.err-card{display:flex;flex-direction:column}
.err-list{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:10px}
.err-list li{padding:10px 12px;border-radius:14px;background:var(--pink-soft)}
.err-list b{display:block;font-weight:900}
.err-list small{display:block;color:#7B3557;font-weight:700;font-size:13px;line-height:1.35;overflow-wrap:anywhere}
.err-act{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:auto}

/* тренажёр */
.trainer{display:flex;flex-direction:column;gap:14px}
.tr-h{font:900 13px/1.2 var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:8px 0 0}
.tr-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.trainer .sec-t{flex-wrap:wrap}
.tg{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:0 16px;border-radius:999px;background:var(--surface);font-weight:800;cursor:pointer}
.tg input{width:20px;height:20px;accent-color:var(--forest)}
.trainer .levels span{background:#F4F1EA}
.tcard{min-height:130px}

/* решение */
.run-pos{font:900 12px/1 var(--display);text-transform:uppercase;color:var(--muted)}
.run-timer{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);font:900 14px/1 var(--display);font-variant-numeric:tabular-nums}
.run-timer .cicon{width:20px;height:20px}
.run-timer.low{background:var(--pink);color:#fff}
.dots{flex-wrap:wrap}
.dots i.done{background:var(--violet)}
.q-skill{font:900 11.5px/1.3 var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.fix-note{align-self:flex-start;padding:7px 12px;border-radius:999px;background:var(--pink-soft);color:#8A2A5A;font-weight:900;font-size:13px}
.hint-box{border-radius:var(--r-md);padding:12px 16px;background:var(--yellow-soft);font-weight:700}
.hint-box b{display:block;font-weight:900;margin-bottom:2px}
.fb.mid{background:var(--yellow-soft)}
.fb p{margin:4px 0 0}
.fb-a{font-weight:800}
.fb .fb-a b{display:inline;margin:0}
.fb-trap{margin-top:6px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.65);font-weight:800;color:#8A2A5A}
.steps{margin:8px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:4px;font-weight:700}
.how{margin-top:6px}
.how summary{cursor:pointer;font-weight:900;color:var(--forest)}
.run-act{display:flex;gap:10px;flex-wrap:wrap}
.quit-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r-md);background:var(--sand);font-weight:800}
.quit-bar span{flex:1 1 220px}
@media (max-width:640px){.run-act .btn{flex:1 1 140px}.qcard{padding:20px 16px}.ans .input{min-width:0}}

/* результат и разбор */
.res-kicker{font:900 12px/1 var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.res-act{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lvl-up,.lvl-down{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;font-weight:900}
.lvl-up{background:var(--lime);color:var(--forest)}
.lvl-up .cicon{width:24px;height:24px}
.lvl-down{background:var(--yellow-soft)}
.rv-card{display:flex;flex-direction:column;gap:12px}
.rv-card .h{font-size:17px}
.rv-list{display:flex;flex-direction:column;gap:8px}
.rv{border-radius:var(--r-md);background:#FBFAF7;border:1px solid var(--line)}
.rv summary{display:grid;grid-template-columns:30px minmax(0,1fr) 30px;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;list-style:none}
.rv summary::-webkit-details-marker{display:none}
.rv-n{font:900 12px/1 var(--display);color:var(--muted)}
.rv-q{font-weight:800}
.rv-mark{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900}
.rv.ok .rv-mark{background:var(--mint-soft);color:#1D5A40}
.rv.no .rv-mark{background:var(--pink);color:#fff}
.rv-body{padding:0 14px 14px 54px;font-weight:700;display:flex;flex-direction:column;gap:6px}
.rv-hint{background:var(--yellow-soft);padding:8px 12px;border-radius:12px}
.next-card{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.next-t{font:900 18px/1.3 var(--display)}

/* история */
.hist-top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
.hist-top p{margin-top:8px;max-width:62ch}
.eg-list{display:flex;flex-direction:column;gap:10px}
.eg{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-md);background:var(--pink-soft);flex-wrap:wrap}
.eg b{display:block;font-weight:900}
.eg small{display:block;font-weight:700;color:#7B3557;font-size:13px;overflow-wrap:anywhere}
.eg > div{flex:1 1 260px;min-width:0}
.li-d{border-radius:var(--r-md);background:var(--surface)}
.li-d summary{list-style:none;cursor:pointer}
.li-d summary::-webkit-details-marker{display:none}
.li-d[open] summary{border-bottom:1px solid var(--line);border-radius:var(--r-md) var(--r-md) 0 0}
.li-rows{padding:10px 18px 14px 74px;display:flex;flex-direction:column;gap:6px;font-weight:700}
.li-rows p{margin:0}
.li-rows .no span{color:var(--error)}
.li-rows .ok span{color:#1D7A4C}
.li-rows small{color:var(--muted);font-weight:700}
@media (max-width:640px){.li-rows{padding-left:18px}}

/* игры */
.gm-sections{display:flex;flex-direction:column;gap:22px}
.gm-sec .sec-t{margin:0 4px 12px}
.gm-asg{box-shadow:0 0 0 3px var(--lime),0 22px 46px -32px rgba(21,62,45,.45)}
.gc-ic{position:relative;z-index:1;display:grid;place-items:center;width:84px;height:84px;border-radius:24px;background:rgba(255,255,255,.22)}
.gc-ic .cicon{width:62px;height:62px}
.gc-badge{position:absolute;left:10px;top:10px;z-index:1;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--forest);font:900 11px/1 var(--display);text-transform:uppercase}
.gc-skill{color:var(--forest)!important}
.gc-note{background:var(--yellow-soft);border-radius:12px;padding:6px 10px;color:var(--ink)!important}
.gc-lv{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.gc-lv label{position:relative}
.gc-lv input{position:absolute;inset:0;opacity:0;cursor:pointer}
.gc-lv span{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:999px;background:#F1EEE6;font-weight:800;font-size:13px}
.gc-lv input:checked+span{background:var(--forest);color:var(--on-dark)}
.gc-lv input:focus-visible+span{outline:3px solid var(--orange);outline-offset:2px}
.gc-fix{font-weight:800!important;color:var(--ink)!important}

/* спокойный режим: во время решения ничего не мигает и не плавает */
.ny-calm body::before{animation:none}
.ny-calm .bob{animation:none}
.ny-calm .ny-hat::after{display:none}
@media (prefers-reduced-motion:reduce){.mt,.coach *{transition:none}}
/* шапка на узком экране: после входа остаётся только «Выйти» */
@media (max-width:430px){.top-links #logout ~ a{display:none}.bar{padding-left:12px}}
/* курс «Математика на английском»: название темы по-английски, словарик под условием */
.tcard .tc-ru{font-weight:800;font-size:12.5px;color:var(--muted);margin-top:-4px}
.en-note{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:6px 16px;border-radius:18px;background:var(--surface);font-weight:800;font-size:14px;line-height:1.35}
.en-note .cicon{width:26px;height:26px;flex:none}
.gloss{border-radius:var(--r-md);background:var(--mint-soft,#E3F4EA);padding:0 14px}
.gloss summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:900;font-size:14.5px}
.gloss dl{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr);gap:6px 14px;margin:0 0 12px;font-size:14.5px}
.gloss dt{font-weight:900}
.gloss dd{margin:0;font-weight:700;color:var(--muted)}
@media (max-width:430px){.gloss dl{grid-template-columns:1fr;gap:0}.gloss dd{margin-bottom:6px}}

.banner-local{background:var(--yellow-soft)}
.login-local{margin-top:10px;padding:8px 12px;border-radius:12px;background:rgba(255,216,77,.2);font-weight:800;font-size:13.5px;color:#FFF3B8!important}
/* Mr.Sam: переключатель курсов в шапке кабинета */
.dsw{position:relative;display:inline-flex;flex:0 1 auto;min-width:0}
.dsw-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;max-width:100%;padding:3px 12px 3px 3px;border:0;border-radius:999px;background:#FFFFFF;color:#153E2D;box-shadow:inset 0 0 0 2px #E1DCD1;font-family:inherit;font-weight:900;font-size:14px;line-height:1.1;cursor:pointer;white-space:nowrap}
.dsw-btn:hover{box-shadow:inset 0 0 0 2px #153E2D}
.dsw-btn:focus-visible{outline:3px solid #8C7BFF;outline-offset:2px}
.dsw-static{cursor:default}.dsw-static:hover{box-shadow:inset 0 0 0 2px #E1DCD1}
.dsw-name{overflow:hidden;text-overflow:ellipsis;min-width:0}
.dsw-chev{width:16px;height:16px;flex:none;transition:transform .15s}
.dsw-btn[aria-expanded="true"] .dsw-chev{transform:rotate(180deg)}
.dsw.on-dark .dsw-btn{background:rgba(255,255,255,.1);color:inherit;box-shadow:none}
.dsw.on-dark .dsw-btn:hover,.dsw.on-dark .dsw-btn[aria-expanded="true"]{background:rgba(255,255,255,.2)}
.dsw.on-dark .dsw-static:hover{background:rgba(255,255,255,.1)}
.dsw-tile{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.dsw-tile .cicon,.dsw-tile svg{width:28px;height:28px;display:block}

<script>/* Фото заданий и HTML-тесты в домашке.
   Файлы приходят с сервера только для своего задания (action hw_file), открываются внутри кабинета.
   HTML-тест работает в изолированном окне (sandbox без allow-same-origin): у него нет доступа к данным кабинета. */
window.MrSamHwMedia = (() => {
  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (v == null || v === false) return;
      if (k === "class") n.className = v;
      else if (k === "html") n.innerHTML = v;
      else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    });
    kids.flat(9).forEach(c => { if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c))); });
    return n;
  };
  const SVG = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + "</svg>";
  const IC = { x: SVG('<path d="M6 6l12 12M18 6L6 18"/>'), plus: SVG('<path d="M12 5v14M5 12h14"/>'), minus: SVG('<path d="M5 12h14"/>'), left: SVG('<path d="M15 5l-7 7 7 7"/>'), right: SVG('<path d="M9 5l7 7-7 7"/>'), zoom: SVG('<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2M11 8.5v5M8.5 11h5"/>'), play: SVG('<path d="M8 5.5v13l10.5-6.5z"/>') };

  const CSS = `
.hm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.hm-th{position:relative;display:block;width:100%;aspect-ratio:4/3;border:0;padding:0;border-radius:14px;overflow:hidden;background:#EEF0EA;cursor:zoom-in;box-shadow:inset 0 0 0 1px rgba(21,62,45,.1)}
.hm-th img{width:100%;height:100%;object-fit:cover;display:block}
.hm-th .hm-n{position:absolute;left:8px;top:8px;background:rgba(16,41,30,.82);color:#fff;font:900 12px/1 system-ui,sans-serif;border-radius:999px;padding:5px 8px}
.hm-th .hm-z{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);color:#10291E;display:grid;place-items:center}
.hm-th .hm-z svg{width:16px;height:16px}
.hm-th.err{display:grid;place-items:center;cursor:default;color:#8A3A2A;font:800 13px/1.3 system-ui,sans-serif;padding:10px;text-align:center}
.hm-th.wait::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);background-size:200% 100%;animation:hm-sh 1.2s linear infinite}
@keyframes hm-sh{to{background-position:-200% 0}}
.hm-lb{position:fixed;inset:0;z-index:2000;background:rgba(10,24,18,.94);display:flex;flex-direction:column}
.hm-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;color:#fff;font:800 14px/1.2 system-ui,sans-serif}
.hm-bar b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:900}
.hm-ib{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.hm-ib:hover{background:rgba(255,255,255,.22)}.hm-ib:disabled{opacity:.35;cursor:default}
.hm-ib svg{width:20px;height:20px}
.hm-stage{flex:1;overflow:auto;display:flex;align-items:safe center;justify-content:safe center;padding:0 8px 12px;touch-action:pan-x pan-y pinch-zoom}
.hm-stage img{display:block;max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#fff;cursor:zoom-in}
.hm-stage.zoomed img{max-width:none;max-height:none;cursor:zoom-out}
.hm-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:64px;background:rgba(16,41,30,.78);box-shadow:0 6px 18px -8px rgba(0,0,0,.6)}
.hm-nav:hover{background:rgba(16,41,30,.92)}
.hm-cnt{flex:none;background:rgba(255,255,255,.14);border-radius:999px;padding:7px 10px;font-weight:900;white-space:nowrap}
.hm-grid.big{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}

.hm-ov{position:fixed;inset:0;z-index:2000;background:#F4F3EF;display:flex;flex-direction:column}

.hm-res{background:#D5F36A;color:#10291E;border-radius:999px;padding:7px 12px;font-weight:900;white-space:nowrap}
.hm-btn{min-height:44px;border:0;border-radius:12px;padding:0 16px;font:900 14px/1 system-ui,sans-serif;cursor:pointer;background:#D5F36A;color:#10291E}
.hm-btn.ghost{background:rgba(255,255,255,.14);color:#fff}
.hm-load{flex:1;display:grid;place-items:center;font:800 15px/1.4 system-ui,sans-serif;color:#46584F;padding:20px;text-align:center}
.hm-open{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.hm-state.ok{color:#16815A}
@media (max-width:560px){.hm-grid:not(.big){grid-template-columns:repeat(2,minmax(0,1fr))}.hm-ov .hm-bar{gap:6px;padding:8px 10px}.hm-ov .hm-bar b{flex-basis:100%;font-size:13px}.hm-btn{min-height:40px;padding:0 12px;font-size:13px}.hm-res{padding:6px 10px;font-size:12.5px}.hm-lb .hm-bar b{font-size:13px}}
`;
  let styled = false;
  const style = () => { if (styled) return; styled = true; document.head.append(el("style", {}, CSS)); };

  /* загрузка файла задания с сервера: только своё задание, только свой курс */
  const cache = {};
  async function fetchFile(o) {
    const k = o.hwId + ":" + o.fileId;
    if (cache[k]) return cache[k];
    const r = await fetch(o.api, { method: "POST", body: new URLSearchParams({ action: o.admin ? "admin_hw_file_get" : "hw_file", token: o.token || "", exam: o.exam || "", hwId: o.hwId || "", fileId: o.fileId }) });
    const j = await r.json();
    if (j && j.error === "auth") { if (o.onAuth) o.onAuth(); throw new Error("auth"); }
    if (!j || !j.ok) throw new Error((j && j.error) || "server");
    return (cache[k] = j.html != null ? { html: j.html } : { url: "data:" + j.type + ";base64," + j.data });
  }

  /* ---------- фото: сетка миниатюр и просмотр на весь экран ---------- */
  function photos(o) {
    style();
    const files = o.files || [], urls = [];
    const grid = el("div", { class: "hm-grid" + (files.length <= 2 ? " big" : ""), role: "list" });   // одно-два фото показываем крупно, целиком
    files.forEach((f, i) => {
      const b = el("button", { type: "button", class: "hm-th wait", role: "listitem", "aria-label": "Фото задания " + (i + 1) + " из " + files.length + ": открыть крупно" });
      grid.append(b);
      Promise.resolve(o.load(f)).then(r => {
        urls[i] = r.url; b.classList.remove("wait");
        b.append(el("img", { src: r.url, alt: "Фото задания " + (i + 1), loading: "lazy" }), el("span", { class: "hm-n" }, (i + 1) + "/" + files.length), el("span", { class: "hm-z", html: IC.zoom }));
        b.addEventListener("click", () => lightbox(urls, i, o.title || "Фото задания", b));
      }).catch(() => { b.classList.remove("wait"); b.classList.add("err"); b.disabled = true; b.textContent = "Фото не загрузилось. Обнови страницу"; });
    });
    return grid;
  }
  function lightbox(urls, start, title, back) {
    style();
    let i = start, z = 1;
    const ZS = [1, 1.6, 2.4, 3.4];
    const img = el("img", { alt: "" });
    const stage = el("div", { class: "hm-stage" }, img);
    const cnt = el("b"), num = el("span", { class: "hm-cnt", hidden: urls.length < 2 });
    const zin = el("button", { type: "button", class: "hm-ib", "aria-label": "Крупнее", html: IC.plus });
    const zout = el("button", { type: "button", class: "hm-ib", "aria-label": "Мельче", html: IC.minus });
    const close = el("button", { type: "button", class: "hm-ib", "aria-label": "Закрыть", html: IC.x });
    const prev = el("button", { type: "button", class: "hm-ib hm-nav prev", "aria-label": "Предыдущее фото", html: IC.left });
    const next = el("button", { type: "button", class: "hm-ib hm-nav next", "aria-label": "Следующее фото", html: IC.right });
    const box = el("div", { class: "hm-lb", role: "dialog", "aria-modal": "true", "aria-label": title }, el("div", { class: "hm-bar" }, cnt, num, zout, zin, close), stage, urls.length > 1 ? [prev, next] : null);
    const setZ = nz => {
      z = Math.max(0, Math.min(ZS.length - 1, nz));
      stage.classList.toggle("zoomed", z > 0);
      img.style.width = z > 0 ? Math.round(stage.clientWidth * ZS[z] - 16) + "px" : "";
      zout.disabled = z === 0; zin.disabled = z === ZS.length - 1;
    };
    const show = () => { img.src = urls[i] || ""; img.alt = title + ", фото " + (i + 1); cnt.textContent = title; num.textContent = (i + 1) + " из " + urls.length; setZ(0); prev.disabled = i === 0; next.disabled = i === urls.length - 1; };
    const done = () => { box.remove(); document.removeEventListener("keydown", key); document.documentElement.style.overflow = ""; if (back && back.focus) back.focus(); };
    const key = e => { if (e.key === "Escape") done(); else if (e.key === "ArrowLeft" && i > 0) { i--; show(); } else if (e.key === "ArrowRight" && i < urls.length - 1) { i++; show(); } else if (e.key === "+" || e.key === "=") setZ(z + 1); else if (e.key === "-") setZ(z - 1); };
    zin.onclick = () => setZ(z + 1); zout.onclick = () => setZ(z - 1); close.onclick = done;
    prev.onclick = () => { if (i > 0) { i--; show(); } }; next.onclick = () => { if (i < urls.length - 1) { i++; show(); } };
    img.addEventListener("click", () => setZ(z > 0 ? 0 : 2));
    document.addEventListener("keydown", key);
    document.documentElement.style.overflow = "hidden";
    document.body.append(box); show(); close.focus();
  }

  /* ---------- HTML-тест в изолированном окне ---------- */
  // скрипт внутри теста: по запросу кабинета собирает ответы ученика и текст с баллом, если тест его показывает.
  // Свой тест может сам сообщить балл: parent.postMessage({ mrsam: "result", score: 8, max: 10 }, "*")
  const COLLECT = `<script>(function(){
var sp=function(t){return String(t||"").replace(/\\s+/g," ").trim()};
function esc(v){return window.CSS&&CSS.escape?CSS.escape(v):String(v).replace(/"/g,'\\\\"')}
function lbl(el){var t="";if(el.id){var l=document.querySelector('label[for="'+esc(el.id)+'"]');if(l)t=l.innerText}
if(!t){var l2=el.closest("label");if(l2)t=l2.innerText}
if(!t)t=el.getAttribute("aria-label")||el.getAttribute("placeholder")||"";
if(!t){var p=el.closest("li,p,td,tr,fieldset,section,div");if(p)t=p.innerText}
return sp(t||el.name).slice(0,160)}
function qbox(el){var n=el.parentElement;while(n&&n!==document.body){if(n.querySelectorAll('input[type=radio][name="'+esc(el.name)+'"]').length>1)return n;n=n.parentElement}return null}
function qtext(b){if(!b)return"";var h=b.querySelector("legend,h1,h2,h3,h4,h5,.question-text,.q-text,.qtext,p,strong,b");var t=h?h.innerText:"";if(!t){var c=b.cloneNode(true);c.querySelectorAll("label,input").forEach(function(x){x.remove()});t=c.innerText}return sp(t).slice(0,160)}
function collect(){var out=[],seen={};
document.querySelectorAll("input,select,textarea").forEach(function(el){var ty=(el.type||"").toLowerCase();
if(/^(hidden|button|submit|reset|file|image|range|color)$/.test(ty))return;
if(ty==="radio"){if(!el.checked)return;var k="r:"+el.name;if(seen[k])return;seen[k]=1;out.push({q:qtext(qbox(el))||el.name,a:lbl(el)});return}
if(ty==="checkbox"){if(el.checked)out.push({q:lbl(el),a:"✓"});return}
var v=el.tagName==="SELECT"?(el.options[el.selectedIndex]?el.options[el.selectedIndex].text:""):el.value;
if(sp(v))out.push({q:lbl(el),a:sp(v).slice(0,500)})});
var sc="",c=document.querySelectorAll('[id*="score" i],[class*="score" i],[id*="result" i],[class*="result" i],[id*="total" i],[class*="total" i]');
for(var i=0;i<c.length&&!sc;i++){var tx=sp(c[i].innerText);if(/\\d/.test(tx)&&tx.length<200&&c[i].getClientRects().length)sc=tx}
return{answers:out.slice(0,80),scoreText:sc}}
addEventListener("message",function(e){if(e.data&&e.data.mrsam==="collect")parent.postMessage(Object.assign({mrsam:"answers"},collect()),"*")});
})();<\/script>`;
  const withCollector = html => /<\/body>/i.test(html) ? html.replace(/<\/body>(?![\s\S]*<\/body>)/i, COLLECT + "</body>") : html + COLLECT;

  function openHtml(o) {
    style();
    let result = null, finished = false;
    const res = el("span", { class: "hm-res", hidden: true });
    const doneBtn = o.preview ? null : el("button", { type: "button", class: "hm-btn" }, "Готово, сдать");
    const close = el("button", { type: "button", class: "hm-btn ghost" }, o.preview ? "Закрыть" : "Выйти");
    const loading = el("div", { class: "hm-load" }, "Открываем тест…");
    const box = el("div", { class: "hm-ov", role: "dialog", "aria-modal": "true", "aria-label": o.title || "Тест" }, el("div", { class: "hm-bar" }, el("b", {}, o.title || "Тест"), res, doneBtn, close), loading);
    let frame = null;
    const onMsg = e => {

      }

      if (!frame) return res2({ answers: [], scoreText: "" });

      window.addEventListener("message", h2);

    });

      if (finished) return; finished = true;

  }

  /* кнопка «Открыть тест» и состояние в шаге задания */
  function htmlTest(o) {

<script>/* ===== Mr.Sam: направления ученика. Один вход на все кабинеты и переключатель курсов.
   Кабинеты курсов лежат на отдельных страницах, но у ученика одна сессия: вошёл один раз и переходит между своими курсами без пароля.
   Сессия хранит только токен входа и список выданных курсов, пароль здесь не хранится. Список курсов присылает сервер. ===== */
window.MrSamDirs = (function () {
  "use strict";
  const LIST = [
    { id: "math", name: "Математика", short: "Математика", href: "math.html", icon: "ruler", tone: "lime", about: "План по темам, задания с подсказками, игры" },
    { id: "english", name: "Английский язык", short: "Английский", href: "english.html", icon: "chat", tone: "mint", about: "Грамматика, слова, чтение и домашка" },
    { id: "mathen", name: "Математика на английском", short: "Math in English", href: "mathen.html", icon: "calc", tone: "yellow", about: "Задачи на английском, словарик терминов, свой план" },
    { id: "ielts", name: "IELTS", short: "IELTS", href: "ielts.html", icon: "cap", tone: "violet", about: "Reading, Listening, Writing в формате IELTS" },
    { id: "toefl", name: "TOEFL", short: "TOEFL", href: "toefl.html", icon: "globe", tone: "pink", about: "Задания нового формата TOEFL и шкала 1–6" }
  ];
  const BY = {}; LIST.forEach(d => { BY[d.id] = d; });
  const HUB = "cabinet.html", KEY = "mrsam.session.v1";
  /** хранилища кабинетов: при выходе убираем токен этого ученика везде */
  const STORES = ["mrsam.math.v1", "mrsam.mathen.v1", "mrsam.english.v1", "mrsam.ielts.v1", "mrsam.toefl.v1"];
  const clean = arr => LIST.map(d => d.id).filter(id => (arr || []).indexOf(id) >= 0);
  const name = id => BY[id] ? BY[id].name : String(id || "");

  function get() {
    try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.code && s.token && (s.role === "student" || s.role === "parent")) return s; } catch (e) {}
    return null;
  }
  function set(s) {
    if (!s || !s.code || !s.token) return;
    try { localStorage.setItem(KEY, JSON.stringify({ role: s.role || "student", code: String(s.code).toUpperCase(), name: s.name || "", token: s.token, tracks: clean(s.tracks), at: Date.now() })); } catch (e) {}
  }
  /** обновить список курсов (сервер прислал свежий) */
  function update(code, patch) { const s = get(); if (s && s.code === String(code || "").toUpperCase()) set(Object.assign(s, patch)); }
  function clear(token) { const s = get(); if (s && token && s.token !== token) return; try { localStorage.removeItem(KEY); } catch (e) {} }
  /** выход: сессия и токены этого кода во всех кабинетах на устройстве */
  function logoutAll(code) {
    code = String(code || "").toUpperCase();
    clear();
    STORES.forEach(k => {
      try {
        const a = JSON.parse(localStorage.getItem(k) || "null");
        if (!a || a.v !== 2 || !a.accounts) return;
        const id = "code:" + code, acc = a.accounts[id];
        if (!acc) return;
        delete acc.token; if (a.current === id) a.current = null;
        localStorage.setItem(k, JSON.stringify(a));
      } catch (e) {}
    });
  }

  /* ---------- переключатель: только выданные курсы ---------- */
  const el = (tag, attrs, kids) => {
    const n = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => { if (v == null || v === false) return; if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? "" : v); });
    (kids || []).forEach(c => { if (c != null) n.append(c); });
    return n;
  };
  const chev = () => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true"); s.setAttribute("class", "dsw-chev"); s.innerHTML = '<path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>'; return s; };
  function tile(d, icon) { return el("span", { class: "dsw-tile t-" + d.tone, "aria-hidden": "true" }, [icon ? icon(d.icon) : null]); }
  /**
   * cur: курс этой страницы; tracks: выданные ученику; opts: { icon(name) → узел, dark: тёмная шапка, hub: ссылка «Все мои курсы» }
   * Один курс: просто подпись. Несколько: кнопка со списком.
   */
  function switcher(cur, tracks, opts) {
    opts = opts || {};
    const list = clean(tracks), d0 = BY[cur];
    const root = el("div", { class: "dsw" + (opts.dark ? " on-dark" : "") });
    if (!d0) return root;
    if (list.length < 2) { root.append(el("span", { class: "dsw-btn dsw-static" }, [tile(d0, opts.icon), el("span", { class: "dsw-name", text: d0.short })])); return root; }
    const id = "dsw-" + Math.random().toString(36).slice(2, 7);
    const menu = el("div", { class: "dsw-menu", id, hidden: true });
    const btn = el("button", { type: "button", class: "dsw-btn", "aria-expanded": "false", "aria-controls": id, "aria-label": "Курс: " + d0.name + ". Переключить курс" },
      [tile(d0, opts.icon), el("span", { class: "dsw-name", text: d0.short }), chev()]);
    const close = () => { menu.hidden = true; btn.setAttribute("aria-expanded", "false"); };
    const open = () => { menu.hidden = false; btn.setAttribute("aria-expanded", "true"); const a = menu.querySelector('[aria-current="page"]') || menu.querySelector("a"); if (a) a.focus(); };
    btn.addEventListener("click", () => (menu.hidden ? open() : close()));
    menu.append(el("span", { class: "dsw-cap", text: "Мои курсы" }));
    list.forEach(k => {
      const d = BY[k];
      menu.append(el("a", { href: d.href, class: "dsw-item" + (k === cur ? " on" : ""), "aria-current": k === cur ? "page" : null },
        [tile(d, opts.icon), el("span", { class: "dsw-txt" }, [el("b", { text: d.name }), el("small", { text: k === cur ? "ты здесь" : d.about })])]));
    });
    if (opts.hub !== false) menu.append(el("a", { href: HUB, class: "dsw-all", text: "Все мои курсы на одной странице" }));
    menu.addEventListener("keydown", e => { if (e.key === "Escape") { close(); btn.focus(); } });
    root._close = close;
    root.append(btn, menu);
    return root;
  }
  // один общий обработчик: клик мимо закрывает открытый список
  document.addEventListener("click", e => { document.querySelectorAll(".dsw").forEach(r => { if (r._close && !r.contains(e.target)) r._close(); }); });

  return { LIST, BY, HUB, KEY, name, clean, get, set, update, clear, logoutAll, switcher };
})();
</script>
<script>/* Mr.Sam · банк заданий по математике.

   Общий файл для кабинета ученика и кабинета учителя: window.MathBank */
(function () {
  "use strict";

  const TOPICS = [
    { id: "addsub", e: "bolt", name: "Сложение и вычитание", en: "Addition and subtraction", bg: "var(--mint-soft)" },

    count: "Счёт по одному", carry: "Переход через десяток", borrow: "Заём при вычитании", word: "Выбор действия в задаче",

  });

    const o1 = r.int(3, 9), o2 = r.int(10 - o1, 9), t1 = r.int(1, 6), t2 = r.int(1, 8 - t1), a = t1 * 10 + o1, b = t2 * 10 + o2, s = a + b;
    return { q: `${a} + ${b} = ?`, qEn: `${a} + ${b} = ?`, a: s, hint: "Сложи отдельно десятки и единицы. Если единиц стало 10 и больше, это ещё один десяток.",

      traps: [[s - 10, "Забыл перенести десяток из единиц."]] };

  add("as.sub2", "addsub", 2, "borrow", "Вычитание двузначных с заёмом", r => {

  });

  function parse(v) {
    v = String(v == null ? "" : v).trim().replace(/−|–/g, "-").replace(/\s+/g, "").replace(/°|%|₽/g, "").replace(",", ".");
    if (!v) return NaN;
    const m = v.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/); if (m) return +m[2] === 0 ? NaN : +m[1] / +m[2];

  }

    const v = parse(raw);
    if (isNaN(v)) return { ok: false, bad: true, value: v };
    if (near(v, item.a, item.tol)) return { ok: true, value: v };
    const t = (item.traps || []).find(t => t && t[1] && near(v, t[0], item.tol));
    return { ok: false, value: v, trap: t ? t[1] : null };
  }

    if (!it) return null;

    // коэффициент 1 не пишем: «x + 47», а не «1x + 47»
    const tidy = v => typeof v === "string" ? v.replace(/(^|[^\d.,\wа-яё])1x/g, "$1x") : v;
    ["q", "qEn", "hint"].forEach(k => { it[k] = tidy(it[k]); });
    it.steps = (it.steps || []).map(tidy); it.traps = it.traps.map(t => [t[0], tidy(t[1])]);
    return Object.assign(it, { tpl: tpl.id, topic: tpl.topic, skill: tpl.skill, diff: tpl.diff, err: tpl.err, show: it.show || num(it.a), seed: String(seed) });

<script>/* Mr.Sam · математика: персональный план ученика.

<script>/* ===== Mr.Sam: запись на занятия по слотам + чек об оплате. Общий модуль для всех кабинетов. ===== */

  const TRACK = { ielts: "IELTS", toefl: "TOEFL", math: "Математика", english: "Английский", mathen: "Математика на английском" };

  /* расписание из шаблона недели (демо и локальный режим) */
  function genSlots(cfg, takenFn) {

  function schedule(ctx) {

    if (!cfg.week || !Object.keys(cfg.week).length) { const hrs = []; for (let x = cfg.from != null ? cfg.from : 9; x < (cfg.to != null ? cfg.to : 22); x++) hrs.push(pad(x) + ":00"); cfg.week = {}; for (let d = 0; d < 7; d++) cfg.week[d] = hrs; }

          mine = (ctx.demoStore.mine || []).filter(b => at(b.d, b.t) > Date.now() - 36e5 && b.status !== "отменена");
          const mineKey = new Set(mine.map(b => b.d + " " + b.t));
          slots = genSlots(cfg, (d, t) => ctx.mode === "demo" && hash(d + t) < 38).map(s => mineKey.has(s.d + " " + s.t) ? Object.assign(s, { st: "mine" }) : s);
        }
        loadedAt = Date.now();
        if (selTime && !slots.some(s => s.d === selDay && s.t === selTime && s.st === "free")) { if (silent && ctx.toast) ctx.toast("Время " + selTime + " только что заняли, выбери другое"); selTime = null; }

      } catch (e) { error = e; if (!silent && ctx.toast) ctx.toast("Не удалось загрузить расписание. Проверь интернет."); }

    }
    const byDay = () => { const m = {}; slots.forEach(s => { (m[s.d] = m[s.d] || []).push(s); }); return m; };

    function drawMine() {
      mineBox.replaceChildren(el("h2", { id: "bk-mine-t" }, "Мои занятия"));
      const list = mine.filter(b => b.status !== "отменена").sort((a, b) => at(a.d, a.t) - at(b.d, b.t));
      if (!list.length) { mineBox.append(el("p", { class: "bk-muted" }, "Пока нет записей. Выбери время ниже.")); }
      else {
        const ul = el("ul", { class: "bk-mylist" });
        list.forEach(b => {
          const left = at(b.d, b.t) - Date.now(), canCancel = left > cfg.cancelHours * 36e5;
          ul.append(el("li", {},
            el("span", { class: "bk-myic" }, ctx.icon ? ctx.icon("calendar") : null), el("span", { class: "bk-mydate" }, el("b", {}, shortDay(b.d)), el("span", {}, b.t + "–" + addMin(b.t, cfg.lessonMin) + " МСК")),
            el("span", { class: "bk-tag" }, TRACK[b.track] || b.track || ""),

        });
        mineBox.append(ul);
      }

    }

        const sh = outside ? "" : !list.length ? "" : free ? free + " ч" : has ? "твоё" : "нет";

      if (!slots.length) { times.append(el("h2", {}, "Свободного времени нет"), el("p", { class: "bk-muted" }, loading ? "Загружаем расписание…" : "Самир скоро откроет новые часы. Загляни позже или напиши ему.")); return; }
      if (!selDay) return;

      if (localOff !== MSK) times.append(el("p", { class: "bk-muted bk-tz" }, "Время по Москве. У тебя в скобках местное."));
      const parts = [["Утро", "sunrise", 0, 12], ["День", "sun", 12, 17], ["Вечер", "moon", 17, 24]];
      const g = el("div", { class: "bk-parts" });

        const cm = el("textarea", { id: "bk-cm", rows: "2", placeholder: "Например: разобрать эссе или задачи на проценты", oninput: e => { commentText = e.target.value; } });

        const btn = el("button", { type: "button", class: "bk-btn bk-go", disabled: busy || ctx.mode === "local" ? true : null, onclick: () => book(selDay, selTime, cm.value.trim(), btn) }, busy ? "Записываем…" : "Записаться");
