<!doctype html>
<html lang="ru">

<meta charset="utf-8">

<title>Mr.Sam · Кабинет учителя</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20256%20256%22%3E%3Crect%20width%3D%22256%22%20height%3D%22256%22%20rx%3D%2264%22%20fill%3D%22%23D5F36A%22/%3E%3Cg%20transform%3D%22translate%2820%2034%29%20scale%281.82%29%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22fvT%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%22.6%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23FFFDF6%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23F1EBDC%22/%3E%3C/linearGradient%3E%3ClinearGradient%20id%3D%22fvW%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%22.35%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23E8FA9C%22/%3E%3Cstop%20offset%3D%22.5%22%20stop-color%3D%22%23C9EC5A%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%239FCB33%22/%3E%3C/linearGradient%3E%3CradialGradient%20id%3D%22fvB%22%20cx%3D%22.5%22%20cy%3D%22.5%22%20r%3D%22.5%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23FF8FA0%22%20stop-opacity%3D%22.75%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23FF8FA0%22%20stop-opacity%3D%220%22/%3E%3C/radialGradient%3E%3CradialGradient%20id%3D%22fvS%22%20cx%3D%22.4%22%20cy%3D%22.35%22%20r%3D%22.7%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23FFF6B8%22/%3E%3Cstop%20offset%3D%22.6%22%20stop-color%3D%22%23FFD84D%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23F2B92A%22/%3E%3C/radialGradient%3E%3C/defs%3E%3Cpath%20d%3D%22M34%2056%20L114%2043%20L9%2094%20Z%22%20fill%3D%22url%28%23fvW%29%22%20stroke%3D%22%23123F2B%22%20stroke-width%3D%226.5%22%20stroke-linejoin%3D%22round%22/%3E%3Cpath%20d%3D%22M42%2062%20L82%2055%22%20stroke%3D%22%23fff%22%20stroke-opacity%3D%22.6%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M11%206%20L114%2043%20L34%2056%20Z%22%20fill%3D%22url%28%23fvT%29%22%20stroke%3D%22%23123F2B%22%20stroke-width%3D%226.5%22%20stroke-linejoin%3D%22round%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Unbounded:wght@700;800;900&display=swap">
<style>
:root{color-scheme:light;--bg:#F4F2EE;--surface:#fff;--ink:#14382A;--muted:#5E6E65;--line:rgba(20,56,42,.09);--forest:#153E2D;--forest-2:#1F5A3E;--night:#0F2A1F;--lime:#D5F36A;--lime-2:#C2E54B;--violet:#8C7BFF;--violet-soft:#ECE8FF;--pink:#FF6FB5;--pink-soft:#FFE6F2;--yellow:#FFD84D;--yellow-soft:#FFF5CC;--mint:#7FD8B6;--mint-soft:#DFF5EA;--orange:#FF8A3D;--orange-soft:#FFEBDD;--red:#D9473A;
--display:"Unbounded","Arial Black",system-ui,sans-serif;--font:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;--ease:cubic-bezier(.2,.7,.2,1);--r:24px}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:600 15.5px/1.5 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:-25vmax;z-index:-1;pointer-events:none;background:radial-gradient(36vmax 26vmax at 8% 6%,rgba(213,243,106,.3),transparent 62%),radial-gradient(32vmax 26vmax at 94% 24%,rgba(140,123,255,.18),transparent 62%),radial-gradient(38vmax 28vmax at 50% 100%,rgba(255,111,181,.12),transparent 62%)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--display);letter-spacing:-.01em;line-height:1.1}
p{margin:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid #E88135;outline-offset:2px}
.muted{color:var(--muted)}
.ic{width:20px;height:20px;flex:none}

/* layout */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:18px 14px;display:flex;flex-direction:column;gap:6px;background:rgba(15,42,31,.96);color:#EAF2EC}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;text-decoration:none}
.brand .logo-mark{width:46px;height:38px;display:grid;place-items:center}
.brand .logo-mark svg{width:46px;height:38px}
.brand b{display:block;font:900 16px/1 var(--display)}
.brand small{display:block;margin-top:5px;font:800 10.5px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--lime)}
.nav-b{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-radius:14px;border:0;background:none;color:rgba(234,242,236,.82);font-weight:800;font-size:15px;cursor:pointer;text-align:left;width:100%;position:relative}
.nav-b:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-b[aria-current="page"]{background:var(--lime);color:var(--forest)}
.nav-b .cnt{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--pink);color:#fff;font:900 11.5px/22px var(--font);text-align:center}
.nav-b[aria-current="page"] .cnt{background:var(--forest);color:var(--lime)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1)}
.side-foot .nav-b{min-height:40px;font-size:14px}
.main{min-width:0;padding:22px clamp(16px,3vw,36px) 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-size:clamp(24px,3vw,34px);text-transform:uppercase}
.top .sub{color:var(--muted);font-weight:700;margin-top:6px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bnav{display:none}
.mtop{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding:14px 14px 96px}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:20;margin:-14px -14px 14px;padding:10px 14px;background:rgba(244,242,238,.75);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.7)}
  .mtop .brand{padding:0}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));background:rgba(15,42,31,.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;border:0;background:none;color:rgba(234,242,236,.7);font:800 10.5px/1 var(--font);border-radius:12px;position:relative;cursor:pointer}
  .bnav button[aria-current="page"]{color:var(--lime)}
  .bnav .cnt{position:absolute;top:3px;right:calc(50% - 20px);min-width:17px;height:17px;border-radius:999px;background:var(--pink);color:#fff;font:900 10px/17px var(--font);padding:0 4px}
}

/* cards */
.card{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.95);border-radius:var(--r);padding:clamp(16px,2.2vw,24px);box-shadow:inset 0 1px 0 #fff,0 22px 46px -34px rgba(20,56,42,.45);-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);min-width:0}
.card h2{font-size:17px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:1100px){.c3{grid-column:span 6}.c4,.c5,.c7,.c8{grid-column:span 12}}
@media (max-width:600px){.c3,.c6{grid-column:span 12}}

/* KPI */
.kpi{display:flex;flex-direction:column;gap:6px;justify-content:space-between;min-height:132px;position:relative;overflow:hidden;cursor:default}
.kpi.kpi-go{cursor:pointer;transition:transform .2s var(--ease)}
.kpi.kpi-go:hover{transform:translateY(-3px)}
.kpi .k{font:900 11px/1.2 var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.kpi .v{font:900 clamp(26px,3vw,36px)/1 var(--display);letter-spacing:-.02em}
.kpi .s{font-weight:700;font-size:13.5px;color:var(--muted)}
.kpi .kic{position:absolute;right:16px;top:16px;width:40px;height:40px;border-radius:13px;display:grid;place-items:center}
.kpi.dark{background:linear-gradient(140deg,var(--forest),var(--forest-2));color:#F2F7EF;border-color:rgba(255,255,255,.06)}
.kpi.dark::after{content:"";position:absolute;width:240px;height:240px;right:-80px;top:-90px;border-radius:50%;background:radial-gradient(circle,rgba(213,243,106,.45),transparent 65%);pointer-events:none}
.kpi.dark .k,.kpi.dark .s{color:rgba(242,247,239,.75)}
.kpi.dark .v{color:var(--lime);font-size:clamp(32px,4vw,46px)}
.kpi.dark .kic{background:var(--lime);color:var(--forest)}
.t-violet{background:var(--violet-soft)!important}.t-yellow{background:var(--yellow-soft)!important}.t-pink{background:var(--pink-soft)!important}.t-mint{background:var(--mint-soft)!important}.t-orange{background:var(--orange-soft)!important}
.kic.violet{background:var(--violet);color:#fff}.kic.yellow{background:var(--yellow)}.kic.pink{background:var(--pink);color:#fff}.kic.mint{background:var(--mint)}.kic.orange{background:var(--orange);color:#fff}

/* bars */
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:24px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bar i{display:block;width:100%;max-width:54px;border-radius:12px 12px 6px 6px;background:linear-gradient(180deg,#B8A9FF,var(--violet));position:relative;min-height:4px;transform-origin:bottom;animation:grow .7s var(--ease) both}
.bar.now i{background:linear-gradient(180deg,#E7FA9E,var(--lime-2))}
.bar b{font:900 11px/1 var(--display);white-space:nowrap}
.bar small{font:800 11.5px/1 var(--font);color:var(--muted)}
@keyframes grow{from{transform:scaleY(0)}}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--bg)}
.row .t{font-weight:900}
.row .m{font-size:13.5px;color:var(--muted);font-weight:700}
.when{display:flex;flex-direction:column;align-items:center;justify-content:center;width:58px;height:54px;border-radius:14px;background:#fff;font:900 16px/1 var(--display);box-shadow:0 6px 14px -10px rgba(20,56,42,.5)}
.when small{font:800 10.5px/1 var(--font);color:var(--muted);margin-top:4px;text-transform:uppercase}
.ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:900 15px/1 var(--display);background:var(--violet-soft);color:var(--forest);flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:900 11px/1.2 var(--font);text-transform:uppercase;letter-spacing:.03em;background:var(--bg);white-space:nowrap}
.pill.ielts{background:var(--violet-soft);color:#4B3BC0}.pill.toefl{background:var(--pink-soft);color:#B0256D}.pill.math{background:var(--yellow-soft);color:#8A6500}
.pill.ok{background:#E3F6D3;color:#2E7A12}.pill.wait{background:var(--yellow-soft);color:#8A6500}.pill.no{background:#FFE3DE;color:#B4361A}.pill.redo{background:var(--orange-soft);color:#9A4A10}
.empty{padding:26px;text-align:center;color:var(--muted);font-weight:700;border:2px dashed rgba(20,56,42,.12);border-radius:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:0;cursor:pointer;font:900 13px/1 var(--display);text-transform:uppercase;letter-spacing:.01em;text-decoration:none;transition:transform .15s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-lime{background:var(--lime);color:var(--forest);box-shadow:0 4px 0 #A9CC33}
.btn-dark{background:var(--forest);color:var(--lime)}
.btn-ghost{background:#fff;color:var(--forest);box-shadow:inset 0 0 0 1.5px rgba(20,56,42,.14)}
.btn-red{background:#FFE3DE;color:#B4361A}
.btn-sm{min-height:36px;padding:0 14px;font-size:11.5px}
.link{border:0;background:none;padding:0;cursor:pointer;font-weight:900;color:var(--forest);text-decoration:underline;text-underline-offset:3px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font:800 13px/1.2 var(--font);color:var(--muted)}
.input{width:100%;min-height:46px;padding:10px 14px;border-radius:14px;border:1.5px solid rgba(20,56,42,.14);background:#fff;font-weight:700;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--violet)}
textarea.input{min-height:90px;resize:vertical;line-height:1.45}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .wide{grid-column:1/-1}
@media (max-width:600px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.chk{position:relative}
.chk input{position:absolute;opacity:0;pointer-events:none}
.chk span{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1.5px rgba(20,56,42,.14);font-weight:800;font-size:14px;cursor:pointer}
.chk input:checked+span{background:var(--forest);color:var(--lime);box-shadow:none}
.chk input:focus-visible+span{outline:3px solid #E88135;outline-offset:2px}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1.5px rgba(20,56,42,.08);flex-wrap:wrap}
.seg button{min-height:36px;padding:0 14px;border-radius:999px;border:0;background:none;font-weight:800;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--forest);color:var(--lime)}

/* table-like students */
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.st{display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:transform .2s var(--ease)}
.st:hover{transform:translateY(-3px)}
.st-top{display:flex;gap:12px;align-items:center}
.st-top b{display:block;font:900 15px/1.2 var(--display)}
.st-top small{color:var(--muted);font-weight:800}
.st-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.st-stats div{padding:9px 10px;border-radius:12px;background:var(--bg)}
.st-stats b{display:block;font:900 15px/1 var(--display)}
.st-stats small{display:block;margin-top:4px;font-size:11.5px;color:var(--muted);font-weight:800;line-height:1.15}
.st-foot{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.warn{color:#B4361A}

/* homework builder */
.parts{display:flex;flex-direction:column;gap:10px}
.part{border-radius:18px;background:var(--bg);padding:14px;display:flex;flex-direction:column;gap:10px;border:1.5px solid transparent}
.part-h{display:flex;align-items:center;gap:10px}
.part-h .pt{display:inline-flex;align-items:center;gap:8px;font:900 12px/1 var(--display);text-transform:uppercase}
.part-h .pt i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:#fff;font-style:normal}
.part-h .sp{margin-left:auto;display:flex;gap:4px}
.icon-b{width:34px;height:34px;border-radius:10px;border:0;background:#fff;cursor:pointer;display:grid;place-items:center;color:var(--forest)}
.icon-b:hover{background:var(--lime)}
.icon-b.del:hover{background:#FFE3DE;color:#B4361A}
.addparts{display:flex;gap:6px;flex-wrap:wrap}
.addparts button{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:12px;border:1.5px dashed rgba(20,56,42,.22);background:#fff;font-weight:800;font-size:13.5px;cursor:pointer}
.addparts button:hover{border-color:var(--violet);background:var(--violet-soft)}
.qbox{border-radius:14px;background:#fff;padding:12px;display:flex;flex-direction:column;gap:8px}

/* submissions */
.subm{display:flex;flex-direction:column;gap:12px}
.sub-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ans{display:flex;flex-direction:column;gap:8px}
.ans div{padding:10px 12px;border-radius:12px;background:var(--bg);white-space:pre-wrap;word-break:break-word}
.ans small{display:block;font:900 10.5px/1 var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.files{display:flex;gap:6px;flex-wrap:wrap}
.files a{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--violet-soft);font-weight:800;font-size:13px;text-decoration:none}
.review{display:grid;grid-template-columns:180px 120px minmax(0,1fr) auto;gap:8px;align-items:end}
@media (max-width:800px){.review{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.review .wide{grid-column:1/-1}}

/* payments */
.pay{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:center}
.pay .amt{font:900 18px/1 var(--display);white-space:nowrap}
.pay-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:700px){.pay{grid-template-columns:auto minmax(0,1fr)}.pay .amt{grid-column:2}.pay-act{grid-column:1/-1;justify-content:flex-start}}

/* bookings */
.day-h{font:900 12px/1 var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 8px}
.day-h:first-child{margin-top:0}

/* games */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:150px;border-radius:20px;border:2px dashed rgba(140,123,255,.5);background:linear-gradient(135deg,var(--violet-soft),#F7F4FF);text-align:center;padding:20px;cursor:pointer;transition:background .15s}
.drop.over{background:var(--lime)}
.drop b{font:900 15px/1.2 var(--display);text-transform:uppercase}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.game{display:flex;flex-direction:column;gap:10px}
.game-cover{height:120px;border-radius:16px;display:grid;place-items:center;font:900 30px/1 var(--display);color:#fff;position:relative;overflow:hidden}
.game-cover::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 10%,rgba(255,255,255,.35),transparent 50%)}
.game.off{opacity:.55}
.game-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}

/* modal */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(8,20,14,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.modal-box{width:min(720px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--bg);border-radius:28px;padding:clamp(18px,3vw,28px);box-shadow:0 40px 90px -30px rgba(0,0,0,.6)}
.modal-box.wide{width:min(1100px,100%);height:calc(100dvh - 32px);display:flex;flex-direction:column;padding:14px}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.modal-h h2{font-size:20px;text-transform:uppercase}
.frame{flex:1;width:100%;border:0;border-radius:18px;background:#fff}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-box{width:min(440px,100%);display:flex;flex-direction:column;gap:16px;padding:30px;border-radius:30px;background:linear-gradient(150deg,var(--forest),var(--night));color:#F2F7EF;box-shadow:0 40px 90px -40px rgba(0,0,0,.7);position:relative;overflow:hidden}
.login-box::after{content:"";position:absolute;width:300px;height:300px;right:-110px;top:-120px;border-radius:50%;background:radial-gradient(circle,rgba(213,243,106,.4),transparent 65%);pointer-events:none}
.login-box h1{font-size:26px;text-transform:uppercase;position:relative}
.login-box p{color:rgba(242,247,239,.75);position:relative}
.login-box .input{background:rgba(255,255,255,.95);color:var(--ink)}
.login-box .field>span{color:rgba(242,247,239,.8)}
.login-box form{display:flex;flex-direction:column;gap:12px;position:relative}
.err{color:#FFB4A8;font-weight:800;font-size:14px;min-height:20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;background:var(--forest);color:#fff;padding:12px 18px;border-radius:999px;font-weight:800;box-shadow:0 20px 40px -20px rgba(0,0,0,.6);max-width:calc(100vw - 32px)}
@media (max-width:900px){.toast{bottom:84px}}
.demo-b{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;border-radius:18px;background:var(--orange-soft);font-weight:800;margin-bottom:14px}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid rgba(20,56,42,.15);border-top-color:var(--forest);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:800;padding:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.ny-snow{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}
.ny-snow.back{z-index:-1}
.ny-snow.front{z-index:26}
.ny-garland{position:absolute;left:28px;right:28px;bottom:-15px;height:26px;pointer-events:none;z-index:2}
.ny-garland svg{position:absolute;inset:0;overflow:visible}
.ny-garland i{position:absolute;top:10px;width:9px;height:14px;margin-left:-4.5px;border-radius:50% 50% 46% 46%/40% 40% 60% 60%;background:var(--c);box-shadow:0 0 10px 2px var(--c),inset -2px -3px 0 rgba(0,0,0,.18);animation:nyBlink 1.35s ease-in-out infinite alternate}
.ny-garland i::before{content:"";position:absolute;left:2px;top:-4px;width:5px;height:5px;border-radius:2px;background:#0E2219}

    document.documentElement.classList.add("ny");
    if (on) start();
    if (o.garland) { const tryG = () => document.querySelectorAll(o.garland).forEach(garland); tryG(); new MutationObserver(tryG).observe(document.body, { childList: true, subtree: true }); }
    if (o.hats !== false) { hats(); new MutationObserver(hats).observe(document.body, { childList: true, subtree: true }); }
    toggle(o.toggleBottom);
    document.querySelectorAll("[data-ny-days]").forEach(el => { const d = daysToNY(); const m10 = d % 10, m100 = d % 100; el.textContent = d + " " + (m10 === 1 && m100 !== 11 ? "день" : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? "дня" : "дней"); });
  }
  window.MrSamNY = { init, daysToNY };
})();

MrSamNY.init({ hats: true, toggleBottom: 16 });
</script>
</body>
</html>
