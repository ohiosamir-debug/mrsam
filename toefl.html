    async function book(d, t, comment, btn) {
      if (busy) return;
      if (mine.filter(b => b.status !== "отменена" && at(b.d, b.t) > Date.now()).length >= cfg.maxActive) { ctx.toast && ctx.toast("Можно держать до " + cfg.maxActive + " записей вперёд. Отмени одну или дождись занятия."); return; }

            const msg = { taken: "Это время только что занял другой ученик. Выбери другое.", limit: "Слишком много записей вперёд. Отмени одну из них.", too_late: "На это время уже нельзя записаться.", no_code: "Код ученика не найден. Напиши Самиру.", closed: "Это время закрыто." }[j && j.error] || "Не получилось записаться. Попробуй ещё раз.";

        } else {

    }
    async function cancel(b) {

          if (!j || !j.ok) { ctx.toast && ctx.toast(j && j.error === "too_late" ? "Отменить уже нельзя: до занятия меньше " + cfg.cancelHours + " ч." : "Не получилось отменить."); return; }
        } else { const x = (ctx.demoStore.mine || []).find(y => y.id === b.id); if (x) x.status = "отменена"; if (ctx.persist) ctx.persist(); }
        ctx.toast && ctx.toast("Запись отменена, время снова свободно");

    const vis = () => { if (document.visibilityState === "visible" && root.isConnected) load(true); };
    timer = setInterval(() => { if (!root.isConnected) return destroy(); if (document.visibilityState === "visible" && ctx.mode === "api") load(true); }, 20000);
    tickT = setInterval(() => { if (root.isConnected) setLive(); }, 5000);

    function destroy() { clearInterval(timer); clearInterval(tickT); document.removeEventListener("visibilitychange", vis); if (active && active.el === root) active = null; }

  /* ближайшее занятие для главной */
  function nextLesson(list) {

    return f ? f.d + "T" + f.t + ":00+03:00" : null;
  }

  /* поле «Приложить чек» */

    const ico = n => opts && opts.icon ? opts.icon(n) : null;

/* ===== Mr.Sam: пароли. Локально: PBKDF2-SHA256 в браузере. С сервером: пароль проверяет Google Таблица, кабинет хранит только токен. ===== */
window.MrSamAuth = (function () {
  "use strict";
  const MIN = 6;
  const enc = s => new TextEncoder().encode(s);
  const hex = buf => [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, "0")).join("");
  const rnd = n => { const a = new Uint8Array(n); (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach((_, i) => { a[i] = Math.random() * 256 | 0; }); return hex(a); };
  async function derive(pass, salt) {
    if (window.crypto && crypto.subtle) {
      const key = await crypto.subtle.importKey("raw", enc(pass), "PBKDF2", false, ["deriveBits"]);
      return "p1:" + hex(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: enc(salt), iterations: 150000, hash: "SHA-256" }, key, 256));
    }
    // запасной вариант для старых браузеров без WebCrypto
    let h1 = 0x811c9dc5, h2 = 0x01000193, s = salt + ":" + pass;
    for (let r = 0; r < 20000; r++) for (let i = 0; i < s.length; i++) { h1 = Math.imul(h1 ^ s.charCodeAt(i), 16777619) >>> 0; h2 = Math.imul(h2 ^ h1, 2246822519) >>> 0; }
    return "f1:" + h1.toString(16) + h2.toString(16);
  }
  async function make(pass) { const salt = rnd(16); return { salt, hash: await derive(pass, salt) }; }
  async function verify(pass, rec) { return !!(rec && rec.salt && rec.hash) && (await derive(pass, rec.salt)) === rec.hash; }
  async function post(api, params) { const r = await fetch(api, { method: "POST", body: new URLSearchParams(params) }); return r.json(); }
  const ERR = {
    no_code: "Код не найден. Проверь его или напиши Самиру.",
    no_access: "Этот код для другого кабинета. Проверь, тот ли кабинет открыт.",
    wrong_password: "Неверный пароль.",
    locked: "Слишком много неверных попыток. Подожди 15 минут или напиши Самиру, он сбросит пароль.",
    weak_password: "Пароль должен быть не короче " + MIN + " символов.",
    has_password: "Пароль уже задан. Введи его или попроси Самира сбросить.",
    no_password: "Для этого кода ещё нет пароля. Придумай его.",
    auth: "Сессия закончилась. Войди заново."
  };
  const msg = (j, fallback) => j && j.error ? (ERR[j.error] || fallback) + (j.error === "wrong_password" && j.left != null ? " Осталось попыток: " + j.left + "." : "") : fallback;
  /* поле пароля с кнопкой «показать» */
  function field(h, id, label, opts) {
    opts = opts || {};
    const input = h("input", { id, type: "password", autocomplete: opts.autocomplete || "current-password", required: true, minlength: opts.min || null, spellcheck: "false", "aria-describedby": opts.describedby || null, placeholder: opts.placeholder || "" });
    const eye = h("button", { type: "button", class: "pw-eye", "aria-label": "Показать пароль", "aria-pressed": "false", onclick: () => { const show = input.type === "password"; input.type = show ? "text" : "password"; eye.setAttribute("aria-pressed", show ? "true" : "false"); eye.setAttribute("aria-label", show ? "Скрыть пароль" : "Показать пароль"); eye.textContent = show ? "Скрыть" : "Показать"; input.focus(); } }, "Показать");
    const wrap = h("div", { class: "field pw-field" }, h("label", { for: id }, label), h("div", { class: "pw-wrap" }, input, eye), opts.hint ? h("small", { class: "pw-hint" }, opts.hint) : null);
    return { wrap, input };
  }
  return { MIN, make, verify, post, msg, field };
})();

  /* ---------- analytics ---------- */
  const scoreOf = a => a.teacherScore != null ? a.teacherScore : a.score;
  function latestBySection(exam) {
    const out = {};
    data().attempts.filter(a => a.exam === exam).forEach(a => { (out[a.section] = out[a.section] || []).push(a); });
    const res = {};
    Object.keys(out).forEach(sec => { const arr = out[sec]; res[sec] = { last: scoreOf(arr[arr.length - 1]), prev: arr.length > 1 ? scoreOf(arr[arr.length - 2]) : null, n: arr.length }; });
    return res;
  }
  function examAverage(exam) {
    const l = latestBySection(exam), vals = Object.values(l).map(x => x.last);
    return vals.length ? { v: round5(vals.reduce((a, b) => a + b, 0) / vals.length), n: vals.length } : null;
  }
  function weakTags() {
    const agg = {};
    data().attempts.filter(a => tracks().includes(a.exam)).slice(-12).forEach(a => { Object.entries(a.tags || {}).forEach(([t, [r, n]]) => { const g = agg[t] = agg[t] || { r: 0, n: 0, exam: a.exam, testId: a.testId }; g.r += r; g.n += n; g.testId = a.testId; }); });
    return Object.entries(agg).filter(([, g]) => g.n >= 2).map(([t, g]) => ({ tag: t, pct: g.r / g.n, n: g.n, testId: g.testId, exam: g.exam })).filter(x => x.pct < 0.85).sort((a, b) => a.pct - b.pct).slice(0, 3);
  }
  function nextTest() {
    const d = data(); let best = null;
    tracks().forEach(ex => {
      const tgt = d.profile.targets[ex], l = latestBySection(ex);
      TESTS.filter(t => t.exam === ex).forEach(t => {
        const cur = l[t.section] ? l[t.section].last : null;
        const gap = cur == null ? 99 : (tgt - cur) / (EXAMS[ex].max - EXAMS[ex].min);
        const tries = d.attempts.filter(a => a.testId === t.id).length;
        const sc = gap * 10 - tries * 0.1;
        if (!best || sc > best.sc) best = { t, sc, cur, tgt, gap };
      });
    });
    return best;
  }
